<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fond dégradé vert -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006A4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009597;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rectangle de fond avec coins arrondis -->
  <rect width="100" height="100" rx="15" fill="url(#grad)"/>

  <!-- Lettres IM en blanc -->
  <text x="50" y="72"
        font-size="48"
        text-anchor="middle"
        fill="white"
        font-family="Arial, sans-serif"
        font-weight="bold"
        letter-spacing="-2">IM</text>
</svg>
