<script>
    // Garde de session : sans identité (choisie au login), retour à l'écran de connexion

        var u = window.ImpulsionMarketing && window.ImpulsionMarketing.users;

</script>
<script>
    var directoryStorage = window.ImpulsionMarketing.directoryStorage;

    window.addEventListener('load', function() {
        directoryStorage.getRootHandleWithCheck().then(function(result) {
            if (result.status !== 'success') {
                showError('Session expirée. <a href="../login.html">Reconnectez-vous</a> pour recharger le dossier.');
                return;
            }
            return result.handle.getDirectoryHandle('docs')
                .then(function(d) { return d.getFileHandle('USER_GUIDE.md'); })
                .then(function(fh) { return fh.getFile(); })
                .then(function(f) { return f.text(); })
                .then(function(text) { renderGuide(text); });
        }).catch(function() {
            showError('Impossible de charger le guide. Vérifiez que le dossier racine est bien sélectionné.');
        });
    });

    function showError(msg) {
        document.getElementById('guide-loading').style.display = 'none';
        var el = document.getElementById('guide-error');
        el.innerHTML = '📖 ' + msg;
        el.style.display = 'block';
    }

    // ── Parseur Markdown minimal ──────────────────────────────────────────
    function renderGuide(md) {
        var html = parseMarkdown(md);
        document.getElementById('guide-loading').style.display = 'none';
        document.getElementById('guide-body').innerHTML = html;
        document.getElementById('guide-content').style.display = 'block';
        buildToc();
    }

    function inline(s) {
        return s
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(m, text, href) {
                return '<a href="' + href + '">' + text + '</a>';
            });
    }

    function parseMarkdown(md) {
        var lines = md.split('\n');
        var out = '';
        var inUL = false, inOL = false;
        var tablePhase = 0; // 0=off, 1=thead, 2=tbody

        function closeLists() {
            if (inUL) { out += '</ul>'; inUL = false; }
            if (inOL) { out += '</ol>'; inOL = false; }
        }
        function closeTable() {
            if (tablePhase === 2) out += '</tbody></table>';
            else if (tablePhase === 1) out += '</thead></table>';
            tablePhase = 0;
        }

        lines.forEach(function(raw) {
            var line = raw;

            // Headings
            if (/^### /.test(line)) {
                closeLists(); closeTable();
                var txt = line.slice(4);
                var id = 'h-' + txt.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                out += '<h3 id="' + id + '">' + inline(txt) + '</h3>';
                return;
            }
            if (/^## /.test(line)) {
                closeLists(); closeTable();
                var txt = line.slice(3);
                var id = 'h-' + txt.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                out += '<h2 id="' + id + '">' + inline(txt) + '</h2>';
                return;
            }
            if (/^# /.test(line)) {
                closeLists(); closeTable();
                out += '<h1>' + inline(line.slice(2)) + '</h1>';
                return;
            }

            // Blockquote
            if (/^> /.test(line)) {
                closeLists(); closeTable();
                out += '<blockquote>' + inline(line.slice(2)) + '</blockquote>';
                return;
            }

            // HR
            if (/^---+$/.test(line.trim())) {
                closeLists(); closeTable();
                out += '<hr>';
                return;
            }

            // Table
            if (/^\|/.test(line)) {
                closeLists();
                var cells = line.split('|').slice(1, -1);
                var isSep = cells.every(function(c) { return /^[\s\-:]+$/.test(c); });
                if (isSep) {
                    if (tablePhase === 1) { out += '</thead><tbody>'; tablePhase = 2; }
                    return;
                }
                if (tablePhase === 0) {
                    out += '<table><thead>'; tablePhase = 1;
                }
                var tag = tablePhase === 1 ? 'th' : 'td';
                out += '<tr>' + cells.map(function(c) {
                    return '<' + tag + '>' + inline(c.trim()) + '</' + tag + '>';
                }).join('') + '</tr>';
                return;
            }

            // Unordered list
            if (/^- /.test(line)) {
                closeTable();
                if (!inUL) { closeLists(); out += '<ul>'; inUL = true; }
                out += '<li>' + inline(line.slice(2)) + '</li>';
                return;
            }

            // Ordered list
            if (/^\d+\. /.test(line)) {
                closeTable();
                if (!inOL) { closeLists(); out += '<ol>'; inOL = true; }
                out += '<li>' + inline(line.replace(/^\d+\. /, '')) + '</li>';
                return;
            }

            // Empty line
            if (line.trim() === '') {
                closeLists(); closeTable();
                return;
            }

            // Paragraph
            closeLists(); closeTable();
            out += '<p>' + inline(line) + '</p>';
        });

        closeLists(); closeTable();
        return out;
    }

    // ── Table des matières ────────────────────────────────────────────────
    function buildToc() {
        var headings = document.querySelectorAll('#guide-body h2');
        if (headings.length === 0) { document.getElementById('guide-toc').style.display = 'none'; return; }
        var tocEl = document.getElementById('guide-toc');
        var html = '<div class="guide-toc-title">Sommaire</div><ul>';
        headings.forEach(function(h) {
            html += '<li><a href="#' + h.id + '">' + h.textContent + '</a></li>';
        });
        html += '</ul>';
        tocEl.innerHTML = html;
    }
</script>
