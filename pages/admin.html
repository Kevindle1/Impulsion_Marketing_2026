    <style>
        .admin-tabs { display: flex; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 6px; margin-bottom: 22px; box-shadow: var(--shadow-xs); }
        .admin-tab { flex: 1; padding: 10px 14px; border: none; background: transparent; border-radius: 8px; font-size: 13.5px; font-weight: 650; color: var(--muted); cursor: pointer; }
        .admin-tab.active { background: var(--primary); color: #fff; }
        .admin-section { display: none; }
        .admin-section.active { display: block; }
        .admin-card { background: var(--bg-card,#fff); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow-xs); }
        .admin-card h3 { font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 14px; }
        .person-row, .canal-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
        .person-row:last-child, .canal-row:last-child { border-bottom: none; }
        .person-name { font-size: 14px; font-weight: 600; color: var(--ink); flex: 1; min-width: 0; }
        .pill-mgr { font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--green-50); color: var(--green-600); }
        .admin-input, .admin-select { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-family: inherit; color: var(--ink); background: #fff; }
        .admin-input:focus, .admin-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb),.14); }
        .icon-del { background: none; border: 1px solid var(--line); color: var(--red); border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 13px; }
        .icon-del:hover { background: var(--red-50); border-color: var(--red); }
        .add-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
        .save-bar { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .inc-item { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
        .inc-item.done { opacity: .6; }
        .inc-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
        .inc-type { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
        .inc-type.incident { background: var(--red-50); color: var(--red); }
        .inc-type.amelioration { background: var(--amber-50); color: #9a6b00; }
        .inc-meta { font-size: 12px; color: var(--muted-2); }
        .inc-desc { font-size: 13.5px; color: var(--gray-700); line-height: 1.5; white-space: pre-wrap; }
        .inc-reponse-saved { background: var(--green-50, #e8f6ef); border: 1px solid var(--green-200, #b7e4cd); border-radius: 8px; padding: 9px 12px; margin-top: 10px; font-size: 13px; color: var(--gray-700); white-space: pre-wrap; }
        .inc-reponse-meta { font-size: 11px; color: var(--muted-2); margin-top: 4px; }
        .inc-reply { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
        .inc-reply-text { width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; }
        .inc-reply-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
        .inc-reply-statut { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; font-family: inherit; cursor: pointer; }
        .btn-reply { padding: 8px 14px; border: none; border-radius: 8px; background: var(--primary, #00875A); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-reply:disabled { opacity: .6; cursor: default; }
        .empty-hint { color: var(--muted-2); font-size: 14px; padding: 16px 0; }
        .toggle-label { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer; }
    </style>
</head>

<script>
    // Garde : identité requise + droit d'accès admin
    (function () {
        var u = window.ImpulsionMarketing && window.ImpulsionMarketing.users;
        if (!u || !u.getCurrentUser()) { window.location.replace('../login.html'); return; }
        if (!u.canAccessAdmin()) { window.location.replace('../Impulsion-Marketing.html'); }
    })();
</script>
<script>
    (function () {
        'use strict';
        var IM = window.ImpulsionMarketing;
        var users = IM.users, config = IM.config, adminConfig = IM.adminConfig, errors = IM.errors;
        var esc = (IM.security && IM.security.escapeHtml) ? IM.security.escapeHtml : function (s) { return String(s == null ? '' : s); };

        var TEAMS = [
            { role: 'marketing', label: 'Marketing' },
            { role: 'com', label: 'Com' },
            { role: 'ebf', label: 'EBF' },
            { role: 'data', label: 'Data' },
            { role: 'superadmin', label: 'Super Admin' }
        ];
        function labelFor(role, isManager) {
            var base = { marketing: 'Marketing', com: 'Com', ebf: 'EBF', data: 'Data', superadmin: 'Super Admin' }[role] || role;
            return (isManager && role !== 'superadmin') ? ('Resp. ' + base) : base;
        }

        var people = [];          // copie éditable des personnes
        var lists = {};           // { canaux:[], universBesoins:[], … } copies éditables
        var segmentsGroups = [];  // copie éditable des segments groupés
        var incidents = [];

        // Listes de choix simples éditables (clé _config.json → libellé + clé IM.config)
        var LISTS_META = [
            { key: 'canaux',         label: 'Types de livrables / canaux', ph: 'Ex : Mail, SMS, Site web…' },
            { key: 'universBesoins', label: 'Univers de besoin',           ph: 'Ex : Épargne, Crédits…' },
            { key: 'typesCom',       label: 'Types de communication',      ph: 'Ex : Commerciales, Gestion, Réglementaire…' },
            { key: 'typologies',     label: 'Typologies',                  ph: 'Ex : PR, Campagne' },
            { key: 'marches',        label: 'Marchés',                     ph: 'Ex : Particuliers…' },
            { key: 'recurrences',    label: 'Récurrences',                 ph: 'Ex : Mensuel, One shot…' },
            { key: 'lots',           label: 'Numéros de lot',              ph: 'Ex : 1, 2, Création' }
        ];
        var CFG_KEY = { canaux: 'CANAUX', universBesoins: 'UNIVERS_BESOINS', typesCom: 'TYPES_COM', typologies: 'TYPOLOGIES', marches: 'MARCHES', recurrences: 'RECURRENCES', lots: 'LOTS' };

        // ── Onglets ──
        document.querySelectorAll('.admin-tab').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.admin-tab').forEach(function (b) { b.classList.remove('active'); });
                btn.classList.add('active');
                document.querySelectorAll('.admin-section').forEach(function (s) { s.classList.remove('active'); });
                document.getElementById('tab-' + btn.getAttribute('data-tab')).classList.add('active');
            });
        });

        // ── PERSONNES ──
        function renderPeople() {
            var teamSelectOptions = TEAMS.map(function (t) { return '<option value="' + t.role + '">' + t.label + '</option>'; }).join('');
            var html = '';
            TEAMS.forEach(function (t) {
                var members = people.filter(function (p) { return p.role === t.role; });
                html += '<div class="admin-card"><h3>' + esc(t.label) + ' (' + members.length + ')</h3>';
                if (!members.length) html += '<div class="empty-hint">Aucune personne.</div>';
                members.forEach(function (p) {
                    var idx = people.indexOf(p);
                    html += '<div class="person-row">'
                        + '<span class="person-name">' + esc(p.name) + (p.isSuperAdmin ? ' <span class="pill-mgr">Super Admin</span>' : (p.isManager ? ' <span class="pill-mgr">Responsable</span>' : '')) + '</span>'
                        + (p.isSuperAdmin ? '' : '<label class="toggle-label"><input type="checkbox" class="cb-mgr" data-i="' + idx + '"' + (p.isManager ? ' checked' : '') + '> Responsable</label>')
                        + '<select class="admin-select sel-team" data-i="' + idx + '">' + teamSelectOptions + '</select>'
                        + '<button class="icon-del" data-del="' + idx + '">🗑</button>'
                        + '</div>';
                });
                html += '</div>';
            });
            // Ajout
            html += '<div class="admin-card"><h3>Ajouter une personne</h3><div class="add-row">'
                + '<input class="admin-input" id="add-name" placeholder="Nom et prénom" style="flex:1;min-width:180px;">'
                + '<select class="admin-select" id="add-team">' + teamSelectOptions + '</select>'
                + '<label class="toggle-label"><input type="checkbox" id="add-mgr"> Responsable</label>'
                + '<button class="btn btn-primary" id="add-person-btn">+ Ajouter</button>'
                + '</div></div>';
            html += '<div class="save-bar"><button class="btn btn-primary" id="save-people">💾 Enregistrer les équipes</button></div>';
            document.getElementById('people-container').innerHTML = html;

            // Pré-sélectionner l'équipe de chaque ligne + handlers
            document.querySelectorAll('.sel-team').forEach(function (sel) {
                var i = +sel.getAttribute('data-i'); sel.value = people[i].role;
                sel.addEventListener('change', function () { people[i].role = sel.value; people[i].roleLabel = labelFor(sel.value, people[i].isManager); renderPeople(); });
            });
            document.querySelectorAll('.cb-mgr').forEach(function (cb) {
                var i = +cb.getAttribute('data-i');
                cb.addEventListener('change', function () { people[i].isManager = cb.checked; people[i].roleLabel = labelFor(people[i].role, cb.checked); });
            });
            document.querySelectorAll('[data-del]').forEach(function (b) {
                b.addEventListener('click', function () { people.splice(+b.getAttribute('data-del'), 1); renderPeople(); });
            });
            document.getElementById('add-person-btn').addEventListener('click', function () {
                var name = document.getElementById('add-name').value.trim();
                var role = document.getElementById('add-team').value;
                var mgr = document.getElementById('add-mgr').checked;
                if (!name) { notify('Indiquez un nom.', 'error'); return; }
                people.push({ name: name, role: role, roleLabel: labelFor(role, mgr), isManager: mgr || undefined });
                renderPeople();
            });
            document.getElementById('save-people').addEventListener('click', savePeople);
        }
        function savePeople() {
            var clean = people.map(function (p) {
                var o = { name: p.name, role: p.role, roleLabel: p.roleLabel || labelFor(p.role, p.isManager) };
                if (p.isManager) o.isManager = true;
                if (p.isSuperAdmin) o.isSuperAdmin = true;
                return o;
            });
            saveConfig({ users: clean }, 'Équipes enregistrées.').then(function () { users.applyUsers(clean); });
        }

        // ── LISTES DE CHOIX SIMPLES ──
        function renderLists() {
            var html = '<div class="admin-card" style="background:var(--amber-50,#fff8e6);border-color:#f0d98a;">'
                + '<div style="font-size:13px;color:#7a5b00;line-height:1.55;">'
                + '<strong>⚠️ À savoir :</strong> ces listes alimentent les choix du <strong>formulaire de création</strong> et les filtres. '
                + 'Modifier ou supprimer une valeur <strong>ne change pas</strong> les campagnes déjà créées (elles gardent la valeur enregistrée). '
                + 'On peut ajouter de nouvelles valeurs sans risque ; évitez de renommer/supprimer une valeur déjà utilisée.'
                + '</div></div>';
            LISTS_META.forEach(function (meta) {
                var arr = lists[meta.key] || (lists[meta.key] = []);
                html += '<div class="admin-card"><h3>' + esc(meta.label) + ' (' + arr.length + ')</h3>';
                if (!arr.length) html += '<div class="empty-hint">Aucune valeur.</div>';
                arr.forEach(function (v, i) {
                    html += '<div class="canal-row"><span class="person-name">' + esc(v) + '</span>'
                        + '<button class="icon-del" data-list="' + meta.key + '" data-deli="' + i + '">🗑</button></div>';
                });
                html += '<div class="add-row"><input class="admin-input" data-addinput="' + meta.key + '" placeholder="' + esc(meta.ph) + '" style="flex:1;min-width:200px;">'
                    + '<button class="btn btn-primary" data-addbtn="' + meta.key + '">+ Ajouter</button></div></div>';
            });
            html += '<div class="save-bar"><button class="btn btn-primary" id="save-lists">💾 Enregistrer les listes</button></div>';
            var cont = document.getElementById('lists-container');
            cont.innerHTML = html;
            cont.querySelectorAll('[data-deli]').forEach(function (b) {
                b.addEventListener('click', function () { lists[b.getAttribute('data-list')].splice(+b.getAttribute('data-deli'), 1); renderLists(); });
            });
            cont.querySelectorAll('[data-addbtn]').forEach(function (b) {
                b.addEventListener('click', function () {
                    var k = b.getAttribute('data-addbtn');
                    var inp = cont.querySelector('[data-addinput="' + k + '"]');
                    var v = (inp.value || '').trim();
                    if (!v) return;
                    if (lists[k].indexOf(v) === -1) lists[k].push(v);
                    renderLists();
                });
            });
            document.getElementById('save-lists').addEventListener('click', saveLists);
        }
        function saveLists() {
            var patch = {};
            LISTS_META.forEach(function (meta) { patch[meta.key] = (lists[meta.key] || []).slice(); });
            saveConfig(patch, 'Listes enregistrées.').then(function () {
                LISTS_META.forEach(function (meta) {
                    var target = config && config[CFG_KEY[meta.key]];
                    if (Array.isArray(target)) target.splice.apply(target, [0, target.length].concat(lists[meta.key] || []));
                });
            });
        }

        // ── SEGMENTS GROUPÉS ──
        function renderSegments() {
            var html = '<div class="admin-card" style="background:var(--amber-50,#fff8e6);border-color:#f0d98a;">'
                + '<div style="font-size:13px;color:#7a5b00;line-height:1.55;">'
                + 'Les segments sont organisés par groupe (Particuliers / Pro / Agri). La <strong>valeur</strong> est enregistrée dans les campagnes ; '
                + 'le <strong>libellé</strong> est ce qui s\'affiche dans le formulaire. Même précaution : ne renommez pas une valeur déjà utilisée.'
                + '</div></div>';
            segmentsGroups.forEach(function (g, gi) {
                var items = g.items || (g.items = []);
                html += '<div class="admin-card"><h3 style="display:flex;align-items:center;gap:10px;justify-content:space-between;">'
                    + '<input class="admin-input" data-grpname="' + gi + '" value="' + esc(g.group || '') + '" style="font-size:13px;font-weight:750;text-transform:uppercase;letter-spacing:.6px;min-width:160px;">'
                    + '<button class="icon-del" data-delgrp="' + gi + '">🗑 Groupe</button></h3>';
                if (!items.length) html += '<div class="empty-hint">Aucun segment.</div>';
                items.forEach(function (it, ii) {
                    html += '<div class="person-row">'
                        + '<input class="admin-input" data-segval="' + gi + '_' + ii + '" value="' + esc(it.value || '') + '" placeholder="Valeur (enregistrée)" style="flex:1;min-width:120px;">'
                        + '<input class="admin-input" data-seglab="' + gi + '_' + ii + '" value="' + esc(it.label || '') + '" placeholder="Libellé (affiché)" style="flex:1;min-width:120px;">'
                        + '<button class="icon-del" data-delseg="' + gi + '_' + ii + '">🗑</button></div>';
                });
                html += '<div class="add-row"><input class="admin-input" data-newval="' + gi + '" placeholder="Valeur" style="flex:1;min-width:120px;">'
                    + '<input class="admin-input" data-newlab="' + gi + '" placeholder="Libellé (optionnel)" style="flex:1;min-width:120px;">'
                    + '<button class="btn btn-primary" data-addseg="' + gi + '">+ Ajouter</button></div></div>';
            });
            html += '<div class="admin-card"><div class="add-row" style="border:none;padding:0;margin:0;">'
                + '<input class="admin-input" id="new-group-name" placeholder="Nom d\'un nouveau groupe" style="flex:1;min-width:180px;">'
                + '<button class="btn btn-secondary" id="add-group-btn">+ Ajouter un groupe</button></div></div>';
            html += '<div class="save-bar"><button class="btn btn-primary" id="save-segments">💾 Enregistrer les segments</button></div>';
            var cont = document.getElementById('segments-container');
            cont.innerHTML = html;
            // Édition en direct des champs (sans re-render, pour ne pas perdre le focus)
            cont.querySelectorAll('[data-grpname]').forEach(function (inp) { inp.addEventListener('input', function () { segmentsGroups[+inp.getAttribute('data-grpname')].group = inp.value; }); });
            cont.querySelectorAll('[data-segval]').forEach(function (inp) { var p = inp.getAttribute('data-segval').split('_'); inp.addEventListener('input', function () { segmentsGroups[+p[0]].items[+p[1]].value = inp.value; }); });
            cont.querySelectorAll('[data-seglab]').forEach(function (inp) { var p = inp.getAttribute('data-seglab').split('_'); inp.addEventListener('input', function () { segmentsGroups[+p[0]].items[+p[1]].label = inp.value; }); });
            cont.querySelectorAll('[data-delseg]').forEach(function (b) { b.addEventListener('click', function () { var p = b.getAttribute('data-delseg').split('_'); segmentsGroups[+p[0]].items.splice(+p[1], 1); renderSegments(); }); });
            cont.querySelectorAll('[data-delgrp]').forEach(function (b) { b.addEventListener('click', function () { segmentsGroups.splice(+b.getAttribute('data-delgrp'), 1); renderSegments(); }); });
            cont.querySelectorAll('[data-addseg]').forEach(function (b) {
                b.addEventListener('click', function () {
                    var gi = +b.getAttribute('data-addseg');
                    var val = (cont.querySelector('[data-newval="' + gi + '"]').value || '').trim();
                    var lab = (cont.querySelector('[data-newlab="' + gi + '"]').value || '').trim();
                    if (!val) { notify('Indiquez une valeur.', 'error'); return; }
                    segmentsGroups[gi].items.push({ value: val, label: lab || val });
                    renderSegments();
                });
            });
            document.getElementById('add-group-btn').addEventListener('click', function () {
                var n = (document.getElementById('new-group-name').value || '').trim();
                if (!n) return;
                segmentsGroups.push({ group: n, items: [] });
                renderSegments();
            });
            document.getElementById('save-segments').addEventListener('click', saveSegments);
        }
        function saveSegments() {
            var clean = segmentsGroups.map(function (g) {
                return { group: g.group || '', items: (g.items || []).filter(function (it) { return it && it.value; }).map(function (it) { return { value: it.value, label: it.label || it.value }; }) };
            });
            saveConfig({ segmentsGroups: clean }, 'Segments enregistrés.').then(function () {
                if (config && Array.isArray(config.SEGMENTS_GROUPS)) config.SEGMENTS_GROUPS.splice.apply(config.SEGMENTS_GROUPS, [0, config.SEGMENTS_GROUPS.length].concat(clean));
                if (config && Array.isArray(config.SEGMENTS) && adminConfig.flattenSegments) {
                    var flat = adminConfig.flattenSegments(clean);
                    config.SEGMENTS.splice.apply(config.SEGMENTS, [0, config.SEGMENTS.length].concat(flat));
                }
            });
        }

        // ── VUE D'ENSEMBLE ──
        function renderOverview() {
            var cont = document.getElementById('overview-container');
            cont.innerHTML = '<div class="admin-card"><div class="empty-hint">Lecture des campagnes…</div></div>';
            IM.directoryStorage.getRootHandleWithCheck().then(function (res) {
                if (res.status !== 'success') throw new Error('Dossier non chargé.');
                return res.handle.getDirectoryHandle('Campagnes').then(function (d) {
                    return d.getFileHandle('_index.json').then(function (fh) { return fh.getFile(); }).then(function (f) { return f.text(); })
                        .then(function (t) { try { return JSON.parse(t) || {}; } catch (e) { return {}; } });
                });
            }).then(function (idx) {
                var camps = (idx && idx.campaigns) ? Object.keys(idx.campaigns).map(function (k) { return idx.campaigns[k]; }) : [];
                var actives = camps.filter(function (c) { return c.actif !== false; });
                var done = actives.filter(function (c) { return c.done === true; }).length;
                var byTyp = {}, byMkt = {}, byTeam = { Com: 0, EBF: 0, Data: 0, Marketing: 0 };
                actives.forEach(function (c) {
                    if (c.typ) byTyp[c.typ] = (byTyp[c.typ] || 0) + 1;
                    if (c.mkt) byMkt[c.mkt] = (byMkt[c.mkt] || 0) + 1;
                    (c.requiredTeams || []).forEach(function (t) { byTeam[t] = (byTeam[t] || 0) + 1; });
                });
                var openInc = incidents.filter(function (i) { return i.statut !== 'traité'; }).length;
                function statCard(label, value, accent) {
                    return '<div style="flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-xs);">'
                        + '<div style="font-size:28px;font-weight:800;color:' + (accent || 'var(--primary)') + ';">' + value + '</div>'
                        + '<div style="font-size:12.5px;color:var(--muted);font-weight:650;margin-top:2px;">' + esc(label) + '</div></div>';
                }
                function breakdown(title, obj) {
                    var keys = Object.keys(obj).filter(function (k) { return obj[k]; });
                    var rows = keys.length ? keys.map(function (k) {
                        return '<div class="canal-row"><span class="person-name">' + esc(k) + '</span><span class="pill-mgr">' + obj[k] + '</span></div>';
                    }).join('') : '<div class="empty-hint">Aucune donnée.</div>';
                    return '<div class="admin-card"><h3>' + esc(title) + '</h3>' + rows + '</div>';
                }
                var html = '<div class="admin-card"><h3>Campagnes actives</h3>'
                    + '<div style="display:flex;gap:12px;flex-wrap:wrap;">'
                    + statCard('Campagnes actives', actives.length)
                    + statCard('Terminées', done, 'var(--green-600)')
                    + statCard('En cours', actives.length - done, 'var(--amber,#b8860b)')
                    + statCard('Signalements ouverts', openInc, openInc ? 'var(--red)' : 'var(--muted)')
                    + '</div></div>';
                html += breakdown('Par typologie', byTyp);
                html += breakdown('Par marché', byMkt);
                html += breakdown('Par équipe sollicitée', byTeam);
                html += '<div class="save-bar"><button class="btn btn-secondary" id="refresh-overview">↻ Rafraîchir</button></div>';
                cont.innerHTML = html;
                document.getElementById('refresh-overview').addEventListener('click', renderOverview);
            }).catch(function (e) {
                cont.innerHTML = '<div class="admin-card"><div class="empty-hint">Impossible de lire l\'index des campagnes (' + esc(e && e.message) + ').<br>Ouvrez d\'abord le dossier de travail depuis le tableau de bord.</div>'
                    + '<div class="save-bar"><button class="btn btn-secondary" id="refresh-overview">↻ Réessayer</button></div></div>';
                var b = document.getElementById('refresh-overview'); if (b) b.addEventListener('click', renderOverview);
            });
        }

        // ── SIGNALEMENTS ──
        // Statuts de réponse proposés quand on traite un signalement.
        // `incStatut` = statut appliqué au signalement (les non-« traité » restent « ouverts »).
        var REPONSE_STATUTS = [
            { value: 'resolu',      label: '✅ Résolu',                  incStatut: 'traité' },
            { value: 'pris_compte', label: '🕒 Pris en compte (bientôt)', incStatut: 'en cours' },
            { value: 'rejete',      label: '❌ Ne sera pas traité',      incStatut: 'traité' },
            { value: 'autre',       label: '💬 Autre / info',            incStatut: 'en cours' }
        ];
        function statutReponseLabel(v) {
            for (var k = 0; k < REPONSE_STATUTS.length; k++) if (REPONSE_STATUTS[k].value === v) return REPONSE_STATUTS[k].label;
            return v || '';
        }

        function renderIncidents() {
            var c = document.getElementById('incidents-container');
            if (!incidents.length) { c.innerHTML = '<div class="admin-card"><div class="empty-hint">Aucun signalement pour l\'instant.</div></div>'; return; }
            var html = '<div class="admin-card"><h3>Signalements (' + incidents.length + ')</h3>';
            incidents.slice().reverse().forEach(function (it) {
                var i = incidents.indexOf(it);
                var done = it.statut === 'traité';
                var rep = it.reponse;
                var selVal = rep ? rep.statut : 'resolu';
                var optsHtml = REPONSE_STATUTS.map(function (o) {
                    return '<option value="' + o.value + '"' + (o.value === selVal ? ' selected' : '') + '>' + o.label + '</option>';
                }).join('');
                html += '<div class="inc-item' + (done ? ' done' : '') + '">'
                    + '<div class="inc-head"><span class="inc-type ' + (it.type === 'amelioration' ? 'amelioration' : 'incident') + '">' + (it.type === 'amelioration' ? '💡 Amélioration' : '🐞 Incident') + '</span>'
                    + '<span class="inc-meta"><strong>' + esc(it.auteur || '?') + '</strong> · ' + esc(it.page || '') + ' · ' + esc((it.date || '').slice(0, 10)) + '</span></div>'
                    + '<div class="inc-desc">' + esc(it.description || '') + '</div>';
                if (rep && rep.texte) {
                    html += '<div class="inc-reponse-saved">↳ <strong>' + esc(statutReponseLabel(rep.statut)) + '</strong> — ' + esc(rep.texte)
                        + '<div class="inc-reponse-meta">par ' + esc(rep.par || '?') + ' · ' + esc((rep.date || '').slice(0, 10)) + ' · auteur notifié</div></div>';
                }
                html += '<div class="inc-reply">'
                    + '<textarea class="inc-reply-text" data-rep="' + i + '" rows="2" placeholder="Réponse à l\'auteur : ce que vous avez fait…">' + esc(rep ? rep.texte : '') + '</textarea>'
                    + '<div class="inc-reply-row"><select class="inc-reply-statut" data-reps="' + i + '">' + optsHtml + '</select>'
                    + '<button class="btn-reply" data-reply="' + i + '">💬 Répondre &amp; notifier</button></div>'
                    + '</div>'
                    + '<div class="save-bar" style="margin-top:10px;">'
                    + '<button class="btn btn-secondary" data-toggle="' + i + '">' + (done ? '↩ Rouvrir' : '✅ Marquer traité') + '</button>'
                    + '<button class="icon-del" data-deli="' + i + '">🗑 Supprimer</button></div>'
                    + '</div>';
            });
            html += '</div>';
            c.innerHTML = html;
            c.querySelectorAll('[data-toggle]').forEach(function (b) { b.addEventListener('click', function () { var i = +b.getAttribute('data-toggle'); incidents[i].statut = incidents[i].statut === 'traité' ? 'nouveau' : 'traité'; saveIncidents(); }); });
            c.querySelectorAll('[data-deli]').forEach(function (b) { b.addEventListener('click', function () { incidents.splice(+b.getAttribute('data-deli'), 1); saveIncidents(); }); });
            c.querySelectorAll('[data-reply]').forEach(function (b) { b.addEventListener('click', function () { respondToIncident(+b.getAttribute('data-reply'), b); }); });
        }

        // Répond à un signalement : enregistre la réponse, met à jour le statut
        // et notifie l'auteur via _notifications.json (lecture-puis-écriture).
        function respondToIncident(i, btn) {
            var it = incidents[i];
            if (!it) return;
            var card = btn.closest('.inc-item');
            var texte = card.querySelector('.inc-reply-text').value.trim();
            var statut = card.querySelector('.inc-reply-statut').value;
            if (!texte) { notify('Saisissez une réponse avant de notifier l\'auteur.', 'error'); return; }
            var me = (users && users.getCurrentUser()) ? users.getCurrentUser().name : 'Admin';
            var def = REPONSE_STATUTS.filter(function (o) { return o.value === statut; })[0] || REPONSE_STATUTS[0];

            it.reponse = { texte: texte, statut: statut, par: me, date: new Date().toISOString() };
            it.statut = def.incStatut;

            btn.disabled = true; btn.textContent = 'Envoi…';
            notifyAuthor(it, def, me)
                .then(function () {
                    return writeJson('Données', 'incidents.json', incidents, 'Réponse enregistrée — auteur notifié.');
                })
                .then(function () { renderIncidents(); renderOverview(); })
                .catch(function (e) { btn.disabled = false; btn.textContent = '💬 Répondre & notifier'; notify('Échec : ' + (e && e.message), 'error'); });
        }

        // Ajoute une notification destinée à l'auteur du signalement.
        function notifyAuthor(it, def, me) {
            var dest = (it.auteur || '').trim();
            if (!dest) return Promise.resolve();
            return IM.directoryStorage.getRootHandleWithCheck().then(function (res) {
                if (res.status !== 'success') throw new Error('Dossier non chargé.');
                return res.handle.getFileHandle('_notifications.json', { create: true });
            }).then(function (fh) {
                return fh.getFile().then(function (f) { return f.text(); })
                    .then(function (t) { var a; try { a = JSON.parse(t); } catch (e) { a = []; } return { fh: fh, notifs: Array.isArray(a) ? a : [] }; })
                    .catch(function () { return { fh: fh, notifs: [] }; });
            }).then(function (r) {
                var typeLabel = it.type === 'amelioration' ? '💡 Amélioration' : '🐞 Incident';
                r.notifs.push({
                    id: 'notif-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                    type: 'signalement_reponse',
                    destinataire: dest,
                    campagneId: '',
                    campagneTitre: typeLabel + (it.page ? ' · ' + it.page : ''),
                    statutReponse: def.label,
                    message: it.reponse.texte,
                    auteur: me,
                    dateCreation: new Date().toISOString(),
                    // Snapshot du signalement d'origine, pour l'afficher dans la modale
                    // côté destinataire (la cloche n'a pas accès à incidents.json).
                    signalementId: it.id,
                    signalementType: typeLabel,
                    signalementPage: it.page || '',
                    signalementDescription: it.description || '',
                    signalementDate: it.date || '',
                    lu: false
                });
                return r.fh.createWritable().then(function (w) { return w.write(JSON.stringify(r.notifs, null, 2)).then(function () { return w.close(); }); });
            });
        }
        function saveIncidents() {
            writeJson('Données', 'incidents.json', incidents, 'Signalement mis à jour.').then(renderIncidents);
        }

        // ── Persistance ──
        function notify(msg, type) { if (errors && errors.showNotification) errors.showNotification(msg, type || 'success', 2500); }
        function saveConfig(patch, okMsg) {
            return adminConfig.load().then(function (cur) {
                Object.keys(patch).forEach(function (k) { cur[k] = patch[k]; });
                return adminConfig.save(cur);
            }).then(function () { notify(okMsg); }).catch(function (e) { notify('Échec : ' + (e && e.message), 'error'); throw e; });
        }
        function writeJson(dir, file, data, okMsg) {
            return IM.directoryStorage.getRootHandleWithCheck().then(function (res) {
                if (res.status !== 'success') throw new Error('Dossier non chargé.');
                return res.handle.getDirectoryHandle(dir, { create: true });
            }).then(function (d) {
                return d.getFileHandle(file, { create: true }).then(function (fh) {
                    return fh.createWritable().then(function (w) { return w.write(JSON.stringify(data, null, 2)).then(function () { return w.close(); }); });
                });
            }).then(function () { notify(okMsg); }).catch(function (e) { notify('Échec : ' + (e && e.message), 'error'); });
        }

        // ── QUOI DE NEUF (annonces) ──────────────────────────────────────────────
        // Persisté dans _whatsnew.json à la racine. Chaque annonce : { id, dateLabel,
        // title, type, text, audience:[noms] (vide = tout le monde), seenBy:[noms] }.
        var WHATSNEW_FILE = '_whatsnew.json';
        var whatsNewList = [];
        var WN_BADGE = {
            'new':     { icon: '🆕', label: 'Nouveau', color: '#16a34a' },
            'fix':     { icon: '🛠️', label: 'Correction', color: '#0d6efd' },
            'improve': { icon: '✨', label: 'Amélioration', color: '#7c3aed' }
        };

        function readWhatsNewFile() {
            return IM.directoryStorage.getRootHandleWithCheck().then(function (res) {
                if (res.status !== 'success') return [];
                return res.handle.getFileHandle(WHATSNEW_FILE).then(function (fh) { return fh.getFile(); })
                    .then(function (f) { return f.text(); })
                    .then(function (t) { try { var a = JSON.parse(t); return Array.isArray(a) ? a : []; } catch (e) { return []; } })
                    .catch(function () { return []; });
            }).catch(function () { return []; });
        }
        function writeWhatsNewFile(list) {
            return IM.directoryStorage.getRootHandleWithCheck().then(function (res) {
                if (res.status !== 'success') throw new Error('Dossier non chargé.');
                return res.handle.getFileHandle(WHATSNEW_FILE, { create: true });
            }).then(function (fh) { return fh.createWritable(); })
              .then(function (w) { return w.write(JSON.stringify(list, null, 2)).then(function () { return w.close(); }); });
        }
        function loadWhatsNew() {
            return readWhatsNewFile().then(function (list) { whatsNewList = list; renderWhatsNew(); });
        }

        function renderWhatsNew() {
            var cont = document.getElementById('whatsnew-container');
            if (!cont) return;
            var typeOpts = Object.keys(WN_BADGE).map(function (k) {
                return '<option value="' + k + '">' + WN_BADGE[k].icon + ' ' + WN_BADGE[k].label + '</option>';
            }).join('');

            // Liste des personnes (audience)
            var people = (users.USERS || []).slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
            var peopleHtml = people.map(function (p) {
                return '<label style="display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0;">'
                    + '<input type="checkbox" class="wn-person" value="' + esc(p.name) + '"> ' + esc(p.name)
                    + ' <span style="color:var(--muted);font-size:11px;">' + esc(p.roleLabel || p.role || '') + '</span></label>';
            }).join('');

            var html = '';
            html += '<div class="admin-card"><h3>📣 Publier une annonce</h3>';
            html += '<div class="form-row" style="margin-bottom:10px;"><label class="admin-label">Titre</label>'
                + '<input class="admin-input" id="wn-title" placeholder="Ex : Nouvelle fonctionnalité Documents" style="width:100%;"></div>';
            html += '<div class="form-row" style="margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">'
                + '<label class="admin-label">Type</label><select class="admin-input" id="wn-type">' + typeOpts + '</select></div>';
            html += '<div class="form-row" style="margin-bottom:10px;"><label class="admin-label">Message</label>'
                + '<textarea class="admin-input" id="wn-text" rows="3" placeholder="Décrivez la nouveauté ou la correction…" style="width:100%;resize:vertical;"></textarea></div>';
            html += '<div class="form-row" style="margin-bottom:10px;"><label class="admin-label">Destinataires</label>'
                + '<label style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;margin-bottom:6px;"><input type="checkbox" id="wn-all" checked> Tout le monde</label>'
                + '<div id="wn-people" style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px 12px;opacity:.45;pointer-events:none;">' + (peopleHtml || '<span class="empty-hint">Aucune personne.</span>') + '</div></div>';
            html += '<div class="save-bar"><button class="btn btn-primary" id="wn-publish">📣 Publier l\'annonce</button></div>';
            html += '</div>';

            // Liste des annonces existantes
            var sorted = whatsNewList.slice().sort(function (a, b) { return (b.id || 0) - (a.id || 0); });
            html += '<div class="admin-card"><h3>Annonces publiées (' + sorted.length + ')</h3>';
            if (!sorted.length) {
                html += '<div class="empty-hint">Aucune annonce pour le moment.</div>';
            } else {
                sorted.forEach(function (e) {
                    var b = WN_BADGE[e.type] || WN_BADGE.improve;
                    var audience = (Array.isArray(e.audience) && e.audience.length) ? (e.audience.length + ' personne' + (e.audience.length > 1 ? 's' : '')) : 'Tout le monde';
                    var seen = Array.isArray(e.seenBy) ? e.seenBy.length : 0;
                    html += '<div class="canal-row" style="align-items:flex-start;">';
                    html += '<div style="flex:1;min-width:0;">'
                        + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px;">'
                        + '<span style="font-size:11px;font-weight:700;color:#fff;background:' + b.color + ';border-radius:4px;padding:2px 6px;">' + b.icon + ' ' + b.label + '</span>'
                        + '<strong>' + esc(e.title) + '</strong>'
                        + '<span style="color:var(--muted);font-size:11px;">' + esc(e.dateLabel || '') + '</span></div>'
                        + (e.text ? '<div style="font-size:12.5px;color:var(--muted-2,#667);white-space:pre-wrap;line-height:1.45;">' + esc(e.text) + '</div>' : '')
                        + '<div style="font-size:11px;color:var(--muted);margin-top:4px;">👥 ' + esc(audience) + ' · 👁 vu par ' + seen + '</div>'
                        + '</div>';
                    html += '<button class="icon-del" data-wn-del="' + e.id + '" title="Supprimer">🗑</button>';
                    html += '</div>';
                });
            }
            html += '</div>';
            cont.innerHTML = html;

            // Activer/désactiver la liste des personnes selon « Tout le monde »
            var allCb = document.getElementById('wn-all');
            var peopleBox = document.getElementById('wn-people');
            allCb.addEventListener('change', function () {
                if (allCb.checked) { peopleBox.style.opacity = '.45'; peopleBox.style.pointerEvents = 'none'; }
                else { peopleBox.style.opacity = '1'; peopleBox.style.pointerEvents = 'auto'; }
            });
            document.getElementById('wn-publish').addEventListener('click', publishWhatsNew);
            cont.querySelectorAll('[data-wn-del]').forEach(function (btn) {
                btn.addEventListener('click', function () { deleteWhatsNew(+btn.getAttribute('data-wn-del')); });
            });
        }

        function publishWhatsNew() {
            var title = (document.getElementById('wn-title').value || '').trim();
            var type = document.getElementById('wn-type').value;
            var text = (document.getElementById('wn-text').value || '').trim();
            var all = document.getElementById('wn-all').checked;
            if (!title) { notify('Indiquez un titre pour l\'annonce.', 'error'); return; }
            var audience = [];
            if (!all) {
                audience = Array.prototype.map.call(document.querySelectorAll('.wn-person:checked'), function (c) { return c.value; });
                if (!audience.length) { notify('Sélectionnez au moins une personne, ou cochez « Tout le monde ».', 'error'); return; }
            }
            var entry = {
                id: Date.now(),
                dateLabel: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }),
                title: title, type: type, text: text, audience: audience, seenBy: []
            };
            whatsNewList.push(entry);
            writeWhatsNewFile(whatsNewList)
                .then(function () { notify('Annonce publiée.'); renderWhatsNew(); })
                .catch(function (e) { notify('Échec : ' + (e && e.message), 'error'); });
        }

        function deleteWhatsNew(id) {
            if (!confirm('Supprimer cette annonce ?')) return;
            whatsNewList = whatsNewList.filter(function (e) { return e.id !== id; });
            writeWhatsNewFile(whatsNewList)
                .then(function () { notify('Annonce supprimée.'); renderWhatsNew(); })
                .catch(function (e) { notify('Échec : ' + (e && e.message), 'error'); });
        }

        // ── Init : charger config + incidents puis rendre ──
        function clone(a) { return a.map(function (x) { return Object.assign({}, x); }); }
        function loadStateFromConfig() {
            people = clone(users.USERS);
            lists = {};
            LISTS_META.forEach(function (meta) {
                var arr = config && config[CFG_KEY[meta.key]];
                lists[meta.key] = Array.isArray(arr) ? arr.slice() : [];
            });
            segmentsGroups = (config && Array.isArray(config.SEGMENTS_GROUPS))
                ? JSON.parse(JSON.stringify(config.SEGMENTS_GROUPS)) : [];
        }
        function renderAll() { renderPeople(); renderLists(); renderSegments(); }

        // On attend le signal "ready" de admin-standalone (config déjà appliquée / amorcée).
        var ready = (adminConfig && adminConfig.ready) ? adminConfig.ready : Promise.resolve();
        ready.then(function () {
            loadStateFromConfig();
            renderAll();
            loadWhatsNew();
            // incidents
            return IM.directoryStorage.getRootHandleWithCheck().then(function (res) {
                if (res.status !== 'success') return [];
                return res.handle.getDirectoryHandle('Données').then(function (d) {
                    return d.getFileHandle('incidents.json').then(function (fh) { return fh.getFile(); }).then(function (f) { return f.text(); })
                        .then(function (t) { try { return JSON.parse(t) || []; } catch (e) { return []; } });
                }).catch(function () { return []; });
            });
        }).then(function (inc) {
            incidents = Array.isArray(inc) ? inc : [];
            renderIncidents();
            renderOverview();
        }).catch(function () {
            loadStateFromConfig();
            renderAll(); renderIncidents(); renderOverview(); loadWhatsNew();
        });
    })();
</script>
</body>
</html>
