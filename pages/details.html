    // ── Journal d'activité ──────────────────────────────────
    // Historique « qui a fait quoi, quand » par campagne, dans activity.json
    // (dossier de la campagne). Les discussions ne sont volontairement PAS tracées.
    var ACT_STEP_LABELS = {
        po_saisie: 'Saisie projet', manager_affectation: 'Affectation', po_kickoff: 'Kick-off',
        com_maquette: 'Maquette Com', po_validation_maquette: 'Validation maquette',
        ebf_bat: 'Réalisation BAT', po_validation_bat: 'Validation BAT',
        data_ciblage: 'Ciblage Data', po_validation_ciblage: 'Validation ciblage',
        data_lancement_test: 'Lancement test', ebf_test_prod: 'Test en prod',
        po_validation_test_prod: 'Validation test', data_mise_en_prod: 'Mise en prod',
        ebf_mise_en_prod: 'Mise en prod LP'
    };
    var ACT_STATUS_LABELS = { submitted: 'soumis', validated: 'validé', completed: 'terminé', revision_requested: 'révision demandée' };
    var ACT_ICONS = { workflow: '🔄', document: '📁', statut: '🔌', campagne: '📝' };
    var _activityCache = [];

    function logActivity(campaignName, type, detail) {
        var u = users && users.getCurrentUser();
        var actor = u ? u.name : '?';
        if (!currentRootHandle || !campaignName) return Promise.resolve();
        return currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(dir) {
                return dir.getFileHandle('activity.json', { create: true }).then(function(fh) {
                    return fh.getFile().then(function(f) { return f.text(); })
                        .then(function(t) { var a; try { a = JSON.parse(t); } catch (e) { a = []; } return { fh: fh, list: Array.isArray(a) ? a : [] }; })
                        .catch(function() { return { fh: fh, list: [] }; });
                }).then(function(res) {
                    res.list.push({ id: 'act-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4), date: new Date().toISOString(), type: type, acteur: actor, detail: detail });
                    return res.fh.createWritable().then(function(w) { return w.write(JSON.stringify(res.list, null, 2)).then(function() { return w.close(); }); });
                });
            })
            .then(function() { if (campaignName === currentCampaignName) loadActivity(campaignName); })
            .catch(function(e) { console.warn('logActivity:', e && e.message); });
    }

    function readActivity(campaignName) {
        return currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(d) { return d.getFileHandle('activity.json'); })
            .then(function(fh) { return fh.getFile(); }).then(function(f) { return f.text(); })
            .then(function(t) { var a = JSON.parse(t); return Array.isArray(a) ? a : []; })
            .catch(function() { return []; });
    }

    function loadActivity(campaignName) {
        var loading = document.getElementById('activity-loading'), content = document.getElementById('activity-content');
        if (!loading || !content) return;
        readActivity(campaignName).then(function(list) { _activityCache = list; renderActivity(); });
        var filter = document.getElementById('activity-filter');
        if (filter && !filter._actBound) { filter._actBound = true; filter.addEventListener('change', renderActivity); }
    }

    function renderActivity() {
        var loading = document.getElementById('activity-loading'), content = document.getElementById('activity-content');
        if (!loading || !content) return;
        loading.style.display = 'none'; content.style.display = 'block';
        var filter = (document.getElementById('activity-filter') || {}).value || '';
        var list = _activityCache.slice().sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
        if (filter) list = list.filter(function(e) { return e.type === filter; });
        if (!list.length) { content.innerHTML = '<p style="color:var(--muted-2);font-size:13px;margin:0;">Aucune activité' + (filter ? ' pour ce filtre' : '') + '.</p>'; return; }
        var html = '';
        list.forEach(function(e) {
            var when = e.date ? new Date(e.date).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
            html += '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);">'
                + '<span style="flex:none;">' + (ACT_ICONS[e.type] || '•') + '</span>'
                + '<div style="flex:1;min-width:0;"><div style="font-size:13px;color:var(--ink,#0c1a14);">' + security.escapeHtml(e.detail || '') + '</div>'
                + '<div style="font-size:11px;color:var(--muted-2,#8b988f);">' + security.escapeHtml(e.acteur || '?') + ' · ' + when + '</div></div></div>';
        });
        content.innerHTML = html;
    }

    // Journalise automatiquement les transitions de workflow en enveloppant le module
    // (couvre affectation, kick-off et toutes les actions de canaux, sans toucher aux handlers).
    var _pendingActivity = [];
    (function installWorkflowActivity() {
        if (!workflow || workflow._activityWrapped) return;
        workflow._activityWrapped = true;
        var origAdv = workflow.advanceStep;
        workflow.advanceStep = function(data, stepId, status) {
            if (ACT_STATUS_LABELS[status]) _pendingActivity.push({ type: 'workflow', detail: (ACT_STEP_LABELS[stepId] || stepId) + ' — ' + ACT_STATUS_LABELS[status] });
            return origAdv.apply(this, arguments);
        };
        var origAdvCh = workflow.advanceChannelStep;
        workflow.advanceChannelStep = function(data, idx, stepId, status) {
            if (ACT_STATUS_LABELS[status]) _pendingActivity.push({ type: 'workflow', detail: 'Canal ' + (idx + 1) + ' · ' + (ACT_STEP_LABELS[stepId] || stepId) + ' — ' + ACT_STATUS_LABELS[status] });
            return origAdvCh.apply(this, arguments);
        };
        var origSave = workflow.saveCampaignWorkflow;
        workflow.saveCampaignWorkflow = function(root, name, data) {
            var p = origSave.apply(this, arguments);
            if (_pendingActivity.length) {
                var buf = _pendingActivity.splice(0);
                p.then(function() { buf.forEach(function(a) { logActivity(name, a.type, a.detail); }); });
            }
            return p;
        };
    })();

    // ── Bilan des campagnes : remontée du suivi hebdo (.xlsx) par canal ──────────
    // Le fichier « Suivi MDC-MKD_12mois_*.xlsx » le plus récent est lu dans le dossier
    // « Suivi » de l'espace de travail. On relie chaque canal aux lignes du suivi via
    // codeAction (dépôt Data = ID_ACTION) et codeCom (dépôt EBF = code_communication).
    var SUIVI_FOLDER = 'Suivi';
    var SUIVI_SHEET = 'détail-tous';
    var _suiviIndex = null;
    var BILAN_KPIS = [
        { k: 'Nb_Envois', label: 'Envois', pct: false },
        { k: 'Nb_communications', label: 'Comm.', pct: false },
        { k: 'Tx_Ouvreurs', label: 'Tx ouv.', pct: true },
        { k: 'Tx_Cliqueurs', label: 'Tx clic', pct: true },
        { k: 'Tx_Desabonnement', label: 'Tx désab.', pct: true },
        { k: 'Nb_leads', label: 'Leads', pct: false },
        { k: 'Tx_Reussite', label: 'Tx réussite', pct: true }
    ];

    function bilanClean(v) { v = (v == null ? '' : String(v)).trim(); return (v === '.' || v === '') ? '' : v; }
    // Un canal peut porter plusieurs codes saisis « A / B / C » (ou , ; retour-ligne).
    function splitCodes(s) { return bilanClean(s).split(/[\/,;\n]+/).map(function (x) { return x.trim(); }).filter(Boolean); }
    function bilanNum(v) { v = bilanClean(v); if (v === '') return '—'; var n = Number(v.replace(',', '.')); return isNaN(n) ? v : n.toLocaleString('fr-FR'); }
    function bilanPct(v) { v = bilanClean(v); if (v === '') return '—'; var n = Number(v.replace(',', '.')); return isNaN(n) ? v : (Math.round(n * 10) / 10).toLocaleString('fr-FR') + ' %'; }

    function collectSuiviXlsx(dir) {
        var files = [];
        return new Promise(function(resolve) {
            var it = dir.values();
            function next() {
                it.next().then(function(r) {
                    if (r.done) { resolve(files); return; }
                    var e = r.value;
                    if (e.kind === 'file' && /\.xlsx$/i.test(e.name) && /suivi/i.test(e.name)) files.push(e);
                    next();
                }).catch(function() { resolve(files); });
            }
            next();
        });
    }

    function buildSuiviIndex(rows, label) {
        var header = rows[2] || [];
        var col = {}; header.forEach(function(h, i) { col[String(h).trim()] = i; });
        var byAction = {}, byComm = {};
        rows.slice(3).forEach(function(r) {
            if (!r) return;
            var a = bilanClean(r[col['ID_ACTION']]);
            var c = bilanClean(r[col['code_communication']]);
            if (a) { (byAction[a] = byAction[a] || []).push(r); }
            if (c) { (byComm[c] = byComm[c] || []).push(r); }
        });
        var m = /(\d{4}-\d{2}-\d{2})/.exec(label || '');
        return { byAction: byAction, byComm: byComm, label: (m ? m[1] : label), col: col };
    }

    function loadSuiviFile() {
        if (_suiviIndex) return Promise.resolve(_suiviIndex);
        var sx = window.ImpulsionMarketing && window.ImpulsionMarketing.suiviXlsx;
        if (!currentRootHandle || !sx) return Promise.resolve(null);
        return currentRootHandle.getDirectoryHandle(SUIVI_FOLDER)
            .then(function(dir) {
                return collectSuiviXlsx(dir).then(function(files) {
                    if (!files.length) return null;
                    files.sort(function(a, b) { return a.name < b.name ? 1 : -1; }); // plus récent (date dans le nom) d'abord
                    var best = files[0];
                    return best.getFile()
                        .then(function(f) { return f.arrayBuffer(); })
                        .then(function(ab) { return sx.readSheetRows(ab, SUIVI_SHEET); })
                        .then(function(rows) { _suiviIndex = buildSuiviIndex(rows, best.name); return _suiviIndex; });
                });
            })
            .catch(function() { return null; });
    }

    function readChannelCodes(campaignName, idx) {
        var folder = getChannelFolder(idx);
        return Promise.all([
            readDepotFile(campaignName, folder, 'depotdata.json').catch(function() { return null; }),
            readDepotFile(campaignName, folder, 'depotebf.json').catch(function() { return null; })
        ]).then(function(res) {
            var d = res[0] || {}, e = res[1] || {};
            // Plusieurs codes possibles par canal (saisis « A / B / C »).
            return { codeActions: splitCodes(d.codeAction), codeComs: splitCodes(e.codeCom) };
        });
    }

    function matchSuiviRows(idx, codes) {
        var set = [];
        function add(r) { if (set.indexOf(r) === -1) set.push(r); }
        codes.codeActions.forEach(function(a) { (idx.byAction[a] || []).forEach(add); });
        codes.codeComs.forEach(function(c) { (idx.byComm[c] || []).forEach(add); });
        return set;
    }

    function loadBilan(campaignName) {
        var loading = document.getElementById('bilan-loading'), content = document.getElementById('bilan-content'), fileEl = document.getElementById('bilan-file');
        if (!loading || !content) return;
        loadSuiviFile().then(function(idx) {
            loading.style.display = 'none'; content.style.display = 'block';
            if (!idx) {
                content.innerHTML = '<p style="color:var(--muted-2);font-size:13px;margin:0;">Aucun fichier de suivi trouvé. Déposez le dernier « Suivi MDC-MKD_12mois_*.xlsx » dans le dossier <strong>Suivi</strong> de l\'espace de travail.</p>';
                return;
            }
            if (fileEl) fileEl.textContent = 'Source : ' + (idx.label || 'suivi') + ' (12 mois glissants)';
            var channels = currentCampaignData.channels || [];
            if (!channels.length) { content.innerHTML = '<p style="color:var(--muted-2);font-size:13px;margin:0;">Aucun canal sur cette campagne.</p>'; return; }
            Promise.all(channels.map(function(ch, i) { return readChannelCodes(campaignName, i); }))
                .then(function(codesList) { renderBilan(channels, codesList, idx); });
        });
    }

    function renderBilan(channels, codesList, idx) {
        var content = document.getElementById('bilan-content');
        if (!content) return;
        var col = idx.col;
        var html = '';
        channels.forEach(function(ch, i) {
            var codes = codesList[i];
            var rows = matchSuiviRows(idx, codes);
            html += '<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;">';
            html += '<div style="font-weight:600;font-size:13px;margin-bottom:6px;">📡 ' + security.escapeHtml(ch.deliverableName || ('Canal ' + (i + 1))) + '</div>';
            if (!rows.length) {
                var hasCodes = codes.codeActions.length || codes.codeComs.length;
                var why = !hasCodes
                    ? 'code action / communication non renseigné dans les dépôts'
                    : 'aucune ligne correspondante dans le suivi (codes : ' + (codes.codeActions.join(', ') || '—') + ' / ' + (codes.codeComs.join(', ') || '—') + ')';
                html += '<div style="font-size:12px;color:var(--muted-2);">— ' + security.escapeHtml(why) + '</div>';
            } else {
                html += '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr>';
                html += '<th style="text-align:left;padding:4px 6px;color:var(--muted-2);font-weight:600;">Canal (suivi)</th>';
                BILAN_KPIS.forEach(function(kp) { html += '<th style="text-align:right;padding:4px 6px;color:var(--muted-2);font-weight:600;white-space:nowrap;">' + kp.label + '</th>'; });
                html += '</tr></thead><tbody>';
                rows.forEach(function(r) {
                    var canal = String(r[col['Canal']] || '').replace(/\s+/g, ' ').trim();
                    html += '<tr><td style="padding:4px 6px;border-top:1px solid var(--line);">' + security.escapeHtml(canal) + '</td>';
                    BILAN_KPIS.forEach(function(kp) {
                        var raw = (col[kp.k] != null) ? r[col[kp.k]] : '';
                        var v = kp.pct ? bilanPct(raw) : bilanNum(raw);
                        html += '<td style="text-align:right;padding:4px 6px;border-top:1px solid var(--line);white-space:nowrap;">' + security.escapeHtml(v) + '</td>';
                    });
                    html += '</tr>';
                });
                html += '</tbody></table></div>';
            }
            html += '</div>';
        });
        content.innerHTML = html;
    }

    // ── Documents (Item 21) ─────────────────────────────────
    function loadDocuments(campaignName) {
        var loadingEl = document.getElementById('documents-loading');
        var contentEl = document.getElementById('documents-content');
        if (!loadingEl || !contentEl) return;
        currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(campDir) {
                return campDir.getDirectoryHandle('documents', { create: false })
                    .then(function(docsDir) { return readDocTree(docsDir); })
                    .catch(function() { return null; })
                    .then(function(tree) { renderDocuments(campDir, tree, campaignName); });
            })
            .catch(function() { renderDocuments(null, null, campaignName); });
    }

    function readDocTree(docsDir) {
        var result = { folders: [], files: [] };
        var promises = [];
        return new Promise(function(resolve) {
            var entries = [];
            function next(it) {
                it.next().then(function(r) {
                    if (r.done) {
                        Promise.all(promises).then(function() { resolve(result); });
                        return;
                    }
                    var entry = r.value;
                    if (entry.kind === 'file') {
                        result.files.push(entry.name);
                    } else if (entry.kind === 'directory') {
                        var folder = { name: entry.name, files: [] };
                        result.folders.push(folder);
                        promises.push(new Promise(function(res) {
                            var subFiles = [];
                            function nextSub(sit) {
                                sit.next().then(function(sr) {
                                    if (sr.done) { folder.files = subFiles; res(); return; }
                                    if (sr.value.kind === 'file') subFiles.push(sr.value.name);
                                    nextSub(sit);
                                }).catch(function() { folder.files = subFiles; res(); });
                            }
                            nextSub(entry.values());
                        }));
                    }
                    next(it);
                }).catch(function() { resolve(result); });
            }
            next(docsDir.values());
        });
    }

    function renderDocuments(campDir, tree, campaignName) {
        var loadingEl = document.getElementById('documents-loading');
        var contentEl = document.getElementById('documents-content');
        if (!loadingEl || !contentEl) return;
        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';

        var html = '';
        var isEmpty = !tree || (tree.folders.length === 0 && tree.files.length === 0);

        // Rendu d'un fichier cliquable (ouverture dans un nouvel onglet).
        function fileLine(name, folderName, indent) {
            return '<a href="#" class="doc-file-link" data-folder="' + (folderName ? security.escapeHtml(folderName) : '')
                + '" data-name="' + security.escapeHtml(name) + '" title="Ouvrir"'
                + ' style="display:flex;align-items:center;gap:8px;padding:' + (indent ? '2px 0 2px 16px' : '4px 0')
                + ';font-size:' + (indent ? '12px' : '13px') + ';color:var(--primary);text-decoration:none;">📄 '
                + security.escapeHtml(name) + '</a>';
        }

        if (isEmpty) {
            html += '<p style="color:var(--muted-2);font-size:13px;margin:0 0 12px;">Aucun document pour l\'instant.</p>';
        } else {
            // Fichiers à la racine de documents/
            if (tree.files.length > 0) {
                html += '<div style="margin-bottom:10px;">';
                tree.files.forEach(function(f) { html += fileLine(f, null, false); });
                html += '</div>';
            }
            // Sous-dossiers
            tree.folders.forEach(function(folder) {
                html += '<div class="doc-folder-card" data-folder="' + security.escapeHtml(folder.name) + '" style="background:var(--line-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;">';
                html += '<div style="font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">📂 ' + security.escapeHtml(folder.name) + ' <span style="font-weight:400;color:var(--muted-2);font-size:12px;">(' + folder.files.length + ' fichier' + (folder.files.length !== 1 ? 's' : '') + ')</span></div>';
                folder.files.forEach(function(f) { html += fileLine(f, folder.name, true); });
                // Bouton upload dans ce dossier
                html += '<label style="margin-top:6px;display:inline-flex;align-items:center;gap:6px;background:#e0f2fe;color:#0369a1;border:1px solid #7dd3fc;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;">📎 Ajouter un fichier<input type="file" style="display:none;" data-folder="' + security.escapeHtml(folder.name) + '" class="doc-file-input" multiple></label>';
                html += '</div>';
            });
        }

        // Actions globales : créer un dossier et ajouter des fichiers à la racine
        // (toujours disponibles, même quand l'espace est vide).
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">';
        html += '<button id="btn-new-doc-folder" style="background:var(--line-2);color:var(--gray-700);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;">📁 Nouveau dossier</button>';
        html += '<label style="background:var(--line-2);color:var(--gray-700);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;">📎 Ajouter des fichiers<input type="file" id="doc-root-file-input" style="display:none;" multiple></label>';
        html += '</div>';

        // Zone de glisser-déposer (racine). On peut aussi déposer directement sur un dossier.
        html += '<div id="doc-dropzone" style="margin-top:10px;border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--muted-2);font-size:13px;transition:background .15s,border-color .15s;">⬇️ Glissez-déposez des fichiers ici (PDF, image, Excel…)<br><span style="font-size:11px;">déposez sur un dossier ci-dessus pour l\'y ranger</span></div>';
        contentEl.innerHTML = html;

        // Glisser-déposer : zone racine + chaque dossier comme cible.
        function setupDrop(el, folderName) {
            if (!el || !campDir) return;
            el.addEventListener('dragover', function(e) { e.preventDefault(); el.style.borderColor = 'var(--primary)'; el.style.background = '#eff6ff'; });
            el.addEventListener('dragleave', function() { el.style.borderColor = ''; el.style.background = ''; });
            el.addEventListener('drop', function(e) {
                e.preventDefault();
                el.style.borderColor = ''; el.style.background = '';
                var files = (e.dataTransfer && e.dataTransfer.files) ? Array.prototype.slice.call(e.dataTransfer.files) : [];
                if (files.length) uploadFiles(campDir, campaignName, files, folderName);
            });
        }
        setupDrop(document.getElementById('doc-dropzone'), null);
        contentEl.querySelectorAll('.doc-folder-card').forEach(function(card) {
            setupDrop(card, card.getAttribute('data-folder'));
        });

        // Event : ouvrir un fichier
        contentEl.querySelectorAll('.doc-file-link').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                openDocFile(campaignName, link.getAttribute('data-folder') || null, link.getAttribute('data-name'));
            });
        });

        // Event : nouveau dossier
        var btnNewFolder = document.getElementById('btn-new-doc-folder');
        if (btnNewFolder && campDir) {
            btnNewFolder.addEventListener('click', function() {
                showPromptModal({
                    title: 'Nouveau dossier',
                    label: 'Nom du dossier à créer dans cette campagne :',
                    placeholder: 'Ex : Maquettes',
                    confirmText: 'Créer',
                    onConfirm: function(folderName) {
                        var safe = folderName.replace(/[<>:"|?*\\/]/g, '_');
                        campDir.getDirectoryHandle('documents', { create: true })
                            .then(function(docsDir) { return docsDir.getDirectoryHandle(safe, { create: true }); })
                            .then(function() { notify('Dossier « ' + safe + ' » créé.', 'success'); logActivity(campaignName, 'document', 'Dossier créé : ' + safe); loadDocuments(campaignName); })
                            .catch(function(e) { notify('Erreur : ' + e.message, 'error'); });
                    }
                });
            });
        }

        // Event : upload fichiers dans un sous-dossier
        contentEl.querySelectorAll('.doc-file-input').forEach(function(input) {
            input.addEventListener('change', function() {
                var subFolder = input.getAttribute('data-folder');
                uploadFiles(campDir, campaignName, Array.from(input.files), subFolder);
                input.value = '';
            });
        });

        // Event : upload à la racine
        var rootInput = document.getElementById('doc-root-file-input');
        if (rootInput && campDir) {
            rootInput.addEventListener('change', function() {
                uploadFiles(campDir, campaignName, Array.from(rootInput.files), null);
                rootInput.value = '';
            });
        }
    }

    function uploadFiles(campDir, campaignName, files, subFolderName) {
        if (!files || files.length === 0) return;
        var n = files.length;
        var label = n + ' fichier' + (n > 1 ? 's' : '');
        var dest = subFolderName ? ' dans « ' + subFolderName + ' »' : '';

        // Retour visuel pendant l'écriture : bannière dans la zone documents.
        var contentEl = document.getElementById('documents-content');
        var banner = null;
        if (contentEl) {
            banner = document.createElement('div');
            banner.textContent = '⏳ Envoi de ' + label + dest + ' en cours…';
            banner.style.cssText = 'background:#e0f2fe;color:#0369a1;border:1px solid #7dd3fc;border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:10px;';
            contentEl.insertBefore(banner, contentEl.firstChild);
        }

        campDir.getDirectoryHandle('documents', { create: true })
            .then(function(docsDir) {
                var targetDir = subFolderName
                    ? docsDir.getDirectoryHandle(subFolderName, { create: true })
                    : Promise.resolve(docsDir);
                return targetDir.then(function(dir) {
                    return Promise.all(files.map(function(file) {
                        return dir.getFileHandle(file.name, { create: true })
                            .then(function(fh) { return fh.createWritable(); })
                            .then(function(w) { return w.write(file).then(function() { return w.close(); }); });
                    }));
                });
            })
            .then(function() {
                notify(label + dest + ' ajouté' + (n > 1 ? 's' : '') + ' ✓', 'success');
                logActivity(campaignName, 'document', label + ' déposé' + (n > 1 ? 's' : '') + dest);
                loadDocuments(campaignName); // re-render (retire la bannière)
            })
            .catch(function(e) {
                if (banner) banner.remove();
                notify('Erreur upload : ' + e.message, 'error');
            });
    }

    function openDocFile(campaignName, subFolderName, fileName) {
        currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(d) { return d.getDirectoryHandle('documents'); })
            .then(function(docsDir) {
                return subFolderName ? docsDir.getDirectoryHandle(subFolderName) : docsDir;
            })
            .then(function(dir) { return dir.getFileHandle(fileName); })
            .then(function(fh) { return fh.getFile(); })
            .then(function(file) {
                var url = URL.createObjectURL(file);
                window.open(url, '_blank');
                setTimeout(function() { URL.revokeObjectURL(url); }, 60000);
            })
            .catch(function(e) { notify('Impossible d\'ouvrir le fichier : ' + e.message, 'error'); });
    }

    // ── Discussion ──────────────────────────────────────────
    function loadDiscussion(campaignName) {
        currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })

    function saveDiscussion(campaignName, messages) {
        return currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(d) { return d.getFileHandle('discussion.json', { create: true }); })
            .then(function(fh) { return fh.createWritable(); })
            .then(function(w) {
                return w.write(JSON.stringify({ messages: messages }, null, 2)).then(function() { return w.close(); });
            });

    // ── @mentions : notifie les personnes citées dans un message (@Nom Complet) ──
    function notifyMentions(text, campaignName, authorName) {
        var U = (users && users.USERS) ? users.USERS : [];
        var mentioned = U.filter(function(u) { return u.name !== authorName && text.indexOf('@' + u.name) !== -1; })
                         .map(function(u) { return u.name; });
        if (!mentioned.length) return Promise.resolve();
        return currentRootHandle.getFileHandle('_notifications.json', { create: true })
            .then(function(fh) {
                return fh.getFile().then(function(f) { return f.text(); })
                    .then(function(t) { return { fh: fh, notifs: JSON.parse(t) }; })
                    .catch(function() { return { fh: fh, notifs: [] }; });
            })
            .then(function(res) {
                var now = new Date().toISOString();
                mentioned.forEach(function(dest) {
                    res.notifs.push({
                        id: 'notif-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                        type: 'mention', destinataire: dest,
                        campagneId: campaignName, campagneTitre: campaignName,
                        auteur: authorName, dateCreation: now, lu: false
                    });
                });
                return res.fh.createWritable().then(function(w) {
                    return w.write(JSON.stringify(res.notifs, null, 2)).then(function() { return w.close(); });
                });
            })
            .then(function() {
                notify(mentioned.length + ' personne' + (mentioned.length > 1 ? 's' : '') + ' notifiée' + (mentioned.length > 1 ? 's' : '') + ' (mention).', 'success');
            })
            .catch(function(e) { console.warn('notifyMentions:', e && e.message); });
    }

    // ── Autocomplétion @ : propose les membres quand on tape « @ » dans un message ──
    function setupMentionAutocomplete(input) {
        if (!input || input._mentionBound) return;
        input._mentionBound = true;
        var U = (users && users.USERS) ? users.USERS.slice().sort(function(a, b) { return a.name.localeCompare(b.name); }) : [];
        if (input.parentNode && getComputedStyle(input.parentNode).position === 'static') input.parentNode.style.position = 'relative';

        var dd = document.createElement('div');
        dd.style.cssText = 'position:absolute;z-index:50;background:#fff;border:1px solid var(--line,#eaefec);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:200px;overflow-y:auto;display:none;min-width:220px;';
        input.parentNode.appendChild(dd);

        var anchor = -1; // position du « @ » courant

        function hide() { dd.style.display = 'none'; anchor = -1; }
        function pick(name) {
            var val = input.value, pos = input.selectionStart;
            input.value = val.slice(0, anchor) + '@' + name + ' ' + val.slice(pos);
            var caret = anchor + name.length + 2;
            input.focus(); input.setSelectionRange(caret, caret);
            hide();
        }
        function refresh() {
            var val = input.value, pos = input.selectionStart;
            var at = val.lastIndexOf('@', pos - 1);
            if (at === -1) { hide(); return; }
            var query = val.slice(at + 1, pos);
            if (/[\n@]/.test(query) || query.length > 30) { hide(); return; }
            var q = query.toLowerCase();
            var matches = U.filter(function(u) { return u.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 6);
            if (!matches.length) { hide(); return; }
            anchor = at;
            dd.innerHTML = matches.map(function(u) {
                return '<div class="mention-opt" data-name="' + security.escapeHtml(u.name) + '" style="padding:7px 12px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:10px;">'
                    + '<span>' + security.escapeHtml(u.name) + '</span>'
                    + '<span style="color:var(--muted,#8b988f);font-size:11px;">' + security.escapeHtml(u.roleLabel || u.role || '') + '</span></div>';
            }).join('');
            dd.querySelectorAll('.mention-opt').forEach(function(opt) {
                opt.addEventListener('mousedown', function(e) { e.preventDefault(); pick(opt.getAttribute('data-name')); });
                opt.addEventListener('mouseover', function() { opt.style.background = '#f1f5f9'; });
                opt.addEventListener('mouseout', function() { opt.style.background = ''; });
            });
            dd.style.left = '0px';
            dd.style.top = (input.offsetTop + input.offsetHeight + 4) + 'px';
            dd.style.display = 'block';
        }
        input.addEventListener('input', refresh);
        input.addEventListener('keyup', function(e) { if (e.key === 'Escape') hide(); else if (e.key !== 'Enter') refresh(); });
        input.addEventListener('blur', function() { setTimeout(hide, 150); });
    }

    function renderDiscussionMessages(messages) {
        var loading = document.getElementById('discussion-loading');
        var list    = document.getElementById('discussion-list');
        var form    = document.getElementById('discussion-form');
        var noUser  = document.getElementById('discussion-no-user');
        if (!list) return;

        var currentUser = users.getCurrentUser();

        if (loading) loading.style.display = 'none';

        // Rendu des messages
        if (messages.length === 0) {
            list.innerHTML = '<p style="color:var(--muted-2);font-size:13px;margin:0;">Aucun message pour l\'instant. Soyez le premier à commenter !</p>';
        } else {
            list.innerHTML = messages.map(function(msg, idx) {
                var parts    = (msg.author || '?').trim().split(/\s+/);
                var initials = parts.map(function(p) { return p[0]; }).join('').toUpperCase().slice(0, 2);
                var dt       = new Date(msg.date);
                var dateStr  = dt.toLocaleDateString('fr-FR') + ' · ' + dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                var likes    = msg.likes || [];
                var hasLiked = currentUser && likes.indexOf(currentUser.name) >= 0;
                var avatarColors = ['var(--primary)','#3b82f6','#f97316','#8b5cf6','#ec4899','#0891b2'];
                var colorIdx = (msg.author || '').split('').reduce(function(a, c) { return a + c.charCodeAt(0); }, 0) % avatarColors.length;
                return '<div class="discussion-msg">'
                    + '<div class="discussion-msg-header">'
                    + '<div class="discussion-msg-avatar" style="background:' + avatarColors[colorIdx] + '">' + security.escapeHtml(initials) + '</div>'
                    + '<span class="discussion-msg-author">' + security.escapeHtml(msg.author || 'Anonyme') + '</span>'
                    + '<span class="discussion-msg-date">' + security.escapeHtml(dateStr) + '</span>'
                    + '</div>'
                    + '<div class="discussion-msg-text">' + security.escapeHtml(msg.text) + '</div>'
                    + '<div class="discussion-msg-footer">'
                    + '<button class="discussion-like-btn' + (hasLiked ? ' liked' : '') + '" data-idx="' + idx + '">👍 ' + likes.length + '</button>'
                    + '</div>'
                    + '</div>';
            }).join('');
        }
        list.style.display = 'flex';

        if (currentUser) {
            if (form)   form.style.display = 'block';
            if (noUser) noUser.style.display = 'none';

            // Bouton publier
            var submitBtn = document.getElementById('discussion-submit');
            var input     = document.getElementById('discussion-input');
            if (submitBtn && input) {
                submitBtn.onclick = function() {
                    var text = input.value.trim();
                    if (!text) return;
                    var msg = { id: Date.now(), author: currentUser.name, date: new Date().toISOString(), text: text, likes: [] };
                    messages.push(msg);
                    submitBtn.disabled = true;
                    saveDiscussion(currentCampaignName, messages).then(function() {
                        input.value = '';
                        renderDiscussionMessages(messages);
                        notifyMentions(text, currentCampaignName, currentUser.name);
                    });
                };
                setupMentionAutocomplete(input);
            }

            // Boutons like
            list.querySelectorAll('.discussion-like-btn').forEach(function(btn) {
                btn.onclick = function() {
                    var idx  = parseInt(btn.getAttribute('data-idx'), 10);
                    var msg  = messages[idx];
                    if (!msg) return;
                    var likes = msg.likes || [];
                    var pos   = likes.indexOf(currentUser.name);
                    if (pos >= 0) { likes.splice(pos, 1); } else { likes.push(currentUser.name); }
                    msg.likes = likes;
                    saveDiscussion(currentCampaignName, messages).then(function() {
                        renderDiscussionMessages(messages);
                    });
                };
            });
        } else {
            if (form)   form.style.display = 'none';
            if (noUser) noUser.style.display = 'block';
        }
    }

    function disableBtn(btn, label) { btn.disabled = true; btn.textContent = label; }
    function enableBtn(btn, label)  { btn.disabled = false; btn.textContent = label; }
</script>
