    <link rel="stylesheet" href="../css/dashboard-layout.css">
    <style>
        /* ── Infos campagne : sections & grilles ── */
        .detail-section {
            background: var(--bg-card, #fff);
            border: 1px solid var(--line, #eaefec);
            border-left: 4px solid var(--primary, #00875A);
            border-radius: 16px;
            padding: 20px 22px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-xs);
        }
        .detail-section h3 {
            margin: 0 0 14px 0;
            color: var(--muted, #56655e);
            font-size: 0.72rem;
            font-weight: 700;
            border-bottom: 1px solid var(--line-2, #f0f4f1);
            padding-bottom: 9px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .detail-item { display: flex; flex-direction: column; gap: 4px; }
        .detail-label { font-weight: 700; color: var(--muted-2, #8b988f); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.7px; }
        .detail-value { color: var(--ink, #0c1a14); font-size: 0.875rem; padding: 7px 11px; background: var(--line-2, #f0f4f1); border-radius: 9px; border: 1px solid var(--line, #eaefec); }
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag { display: inline-block; padding: 4px 11px; background: var(--green-50, #e8f6ef); color: var(--green-600, #00734C); border-radius: 999px; font-size: 0.68rem; font-weight: 700; border: 1px solid var(--green-100, #ccebdd); }
        .channel-card { background: var(--bg-card, #fff); border: 1px solid var(--line, #eaefec); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow-xs); }
        .channel-card h4 { margin: 0 0 10px 0; color: var(--ink, #0c1a14); font-size: 0.9375rem; font-weight: 700; letter-spacing: -0.2px; }
        .error-message { background: var(--red-50, #fdeaec); border: 1px solid #fecaca; color: #991b1b; padding: 18px; border-radius: 14px; text-align: center; margin: 32px 0; font-size: 0.875rem; }
        .loading-container { text-align: center; padding: 48px 20px; }
        .spinner { border: 3px solid var(--line, #eaefec); border-top: 3px solid var(--primary, #00875A); border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .back-button { display: inline-flex; align-items: center; gap: 6px; }

        /* ── Actor sections ── */
        .actor-section { background: var(--bg-card, #fff); border: 1px solid var(--line, #eaefec); border-left: 4px solid var(--gray-300, #d6ddd8); border-radius: 16px; padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow-xs); }
        .actor-section--com { border-left-color: var(--blue, #2563EB); }
        .actor-section--ebf { border-left-color: var(--amber, #E8A100); }
        .actor-section--data { border-left-color: var(--primary, #00875A); }
        .actor-section--mep { border-left-color: var(--violet, #7C3AED); }
        .actor-section--revision { border-left-color: var(--red, #E2001A); }
        .actor-section--revision h3 { color: var(--red, #E2001A); }
        .badge-revision { display: inline-block; background: var(--red-50, #fdeaec); color: var(--red, #E2001A); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; vertical-align: middle; margin-left: 8px; text-transform: none; letter-spacing: 0; border: 1px solid #fecaca; }
        .revision-alert { background: var(--red-50, #fdeaec); border: 1px solid #fecaca; border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; font-size: 13px; color: var(--red, #E2001A); }

        /* ── Actor section header ── */
        .actor-section h3 {
            margin: 0 0 14px 0;
            color: var(--muted, #56655e);
            font-size: 0.72rem;
            font-weight: 700;
            border-bottom: 1px solid var(--line-2, #f0f4f1);
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Actor form ── */
        .actor-form { margin-bottom: 4px; }
        .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .form-row label { font-size: 11px; font-weight: 700; color: var(--muted, #56655e); text-transform: uppercase; letter-spacing: 0.6px; }
        .form-control { padding: 10px 12px; border: 1px solid var(--line, #eaefec); border-radius: 10px; font-size: 13.5px; font-family: inherit; color: var(--ink, #0c1a14); background: #fff; width: 100%; box-sizing: border-box; transition: border-color 0.15s, box-shadow 0.15s; }
        .form-control:focus { outline: none; border-color: var(--primary, #00875A); box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.14); }
        .form-control:disabled, .form-control[readonly] { background: var(--line-2, #f0f4f1); color: var(--muted-2, #8b988f); cursor: not-allowed; border-color: var(--line, #eaefec); }
        .radio-group { display: flex; gap: 20px; padding: 6px 0; }
        .radio-group label { display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 13.5px; text-transform: none; letter-spacing: 0; color: var(--ink, #0c1a14); cursor: pointer; }
        .btn-actor-save { background: #fff; border: 1px solid var(--line, #eaefec); border-radius: 10px; padding: 8px 16px; font-size: 13px; font-weight: 650; cursor: pointer; color: var(--gray-700, #33403a); transition: all 0.15s; margin-top: 4px; }
        .btn-actor-save:hover { background: var(--green-50, #e8f6ef); border-color: var(--primary, #00875A); color: var(--green-600, #00734C); }
        .btn-actor-save:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-actor-submit { background: var(--primary, #00875A); color: #fff; border: none; border-radius: 10px; padding: 10px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: background 0.15s, box-shadow 0.15s; box-shadow: 0 2px 6px rgba(0,135,90,0.22); }
        .btn-actor-submit:hover { background: var(--primary-hover, #00734C); box-shadow: 0 6px 16px rgba(0,135,90,0.3); }
        .btn-actor-submit:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
        .btn-actor-submit--mep { background: var(--violet, #7C3AED); box-shadow: 0 2px 6px rgba(124,58,237,0.22); }
        .btn-actor-submit--mep:hover { background: #6d28d9; box-shadow: 0 6px 16px rgba(124,58,237,0.3); }
        .actor-submit-row { margin-top: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .actor-submit-note { font-size: 12px; color: var(--muted-2, #8b988f); }

        /* ── Read-only depot view ── */
        .depot-readonly { background: var(--line-2, #f0f4f1); border: 1px solid var(--line, #eaefec); border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; }
        .depot-readonly-title { font-size: 12px; font-weight: 700; color: var(--gray-700, #33403a); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .depot-readonly-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 9px; }
        .depot-readonly-item { font-size: 12px; color: var(--gray-700, #33403a); }
        .depot-readonly-item strong { display: block; color: var(--muted-2, #8b988f); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .depot-status-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .depot-status-badge--submitted { background: var(--blue-50, #e8f0fe); color: #1d4ed8; }
        .depot-status-badge--saved { background: var(--line-2, #f0f4f1); color: var(--muted, #56655e); }

        /* ── Onglets de navigation horizontaux ── */
        .details-shell {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        .details-sidenav {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 0;
            background: #ffffff;
            border-bottom: 1px solid var(--line, #eaefec);
            padding: 0 28px;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .details-sidenav-label { display: none; }
        .details-nav-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 550;
            color: var(--muted-2, #8b988f);
            cursor: pointer;
            border: none;
            background: none;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s, border-color 0.15s;
            border-radius: 0;
            letter-spacing: -0.1px;
        }
        .details-nav-item:hover { color: var(--ink, #0c1a14); }
        .details-nav-item.active {
            color: var(--primary, #00875A);
            font-weight: 700;
            border-bottom-color: var(--primary, #00875A);
        }
        .details-nav-separator { display: none; }
        .details-panel {
            flex: 1;
            overflow-y: auto;
            padding: 26px 28px;
            min-width: 0;
            background: var(--bg, #f4f7f5);
        }
        /* ── Mise en page de l'onglet Infos ── */
        .info-layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; align-items: start; }
        .info-main, .info-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        .info-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .info-layout .detail-section, .info-cards .detail-section { margin-bottom: 0; }
        @media (max-width: 1100px) { .info-layout { grid-template-columns: 1fr; } }

        /* ── Stepper du workflow ── */
        .wf-block { margin-bottom: 8px; }
        .wf-block + .wf-block { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-2, #f0f4f1); }
        .wf-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .wf-head .wf-title { font-size: 13px; font-weight: 750; color: var(--ink, #0c1a14); display: flex; align-items: center; gap: 8px; }
        .wf-badge { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: var(--green-50, #e8f6ef); color: var(--green-600, #00734C); white-space: nowrap; }
        .wf-badge.done { background: var(--green-50); color: var(--green-700); }
        .wf-badge.wait { background: var(--amber-50); color: #9a6b00; }
        .wf-badge.val  { background: var(--blue-50); color: #1d4ed8; }
        .wf-badge.rev  { background: var(--red-50); color: var(--red); }
        .wf-stepper { display: flex; align-items: flex-start; overflow-x: auto; padding: 2px 0 4px; }
        .wf-step { display: flex; flex-direction: column; align-items: center; flex: 1 1 0; min-width: 78px; position: relative; }
        .wf-step::before { content: ""; position: absolute; top: 16px; left: -50%; width: 100%; height: 2px; background: var(--line, #eaefec); z-index: 0; }
        .wf-step:first-child::before { display: none; }
        .wf-step.done::before, .wf-step.submitted::before, .wf-step.current::before, .wf-step.revision::before { background: var(--primary, #00875A); }
        .wf-node { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; z-index: 1; border: 2px solid var(--line, #eaefec); background: #fff; color: var(--muted-2, #8b988f); }
        .wf-step.done .wf-node { background: var(--primary, #00875A); border-color: var(--primary, #00875A); color: #fff; }
        .wf-step.current .wf-node { border-color: var(--amber, #E8A100); color: var(--amber, #E8A100); box-shadow: 0 0 0 4px var(--amber-50, #fdf3e2); }
        .wf-step.submitted .wf-node { border-color: var(--blue, #2563EB); color: var(--blue, #2563EB); box-shadow: 0 0 0 4px var(--blue-50, #e8f0fe); }
        .wf-step.revision .wf-node { border-color: var(--red, #E2001A); color: var(--red, #E2001A); box-shadow: 0 0 0 4px var(--red-50, #fdeaec); }
        .wf-label { font-size: 10.5px; font-weight: 600; color: var(--muted-2, #8b988f); margin-top: 8px; text-align: center; line-height: 1.25; max-width: 86px; }
        .wf-step.done .wf-label, .wf-step.current .wf-label, .wf-step.submitted .wf-label, .wf-step.revision .wf-label { color: var(--ink, #0c1a14); }
        .wf-step.current .wf-label { font-weight: 700; }
        .wf-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 11px; color: var(--muted, #56655e); }
        .wf-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .wf-legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        /* ── Lightbox ── */
        #lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        #lightbox-overlay.open { display: flex; }
        #lightbox-overlay img {
            max-width: 92vw;
            max-height: 92vh;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
            cursor: zoom-in;
            transform-origin: center center;
            transition: transform 0.06s ease-out;
        }
        #lightbox-overlay iframe {
            width: 92vw;
            height: 92vh;
            border: none;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        #lightbox-close {
            position: fixed;
            top: 18px;
            right: 24px;
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            line-height: 1;
            opacity: 0.8;
            background: none;
            border: none;
            padding: 0;
        }
        #lightbox-close:hover { opacity: 1; }

        /* ── Discussion ── */
        .discussion-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .discussion-msg { background: var(--line-2, #f0f4f1); border: 1px solid var(--line, #eaefec); border-radius: 12px; padding: 13px 15px; }
        .discussion-msg-header { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
        .discussion-msg-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary, #00875A); color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; letter-spacing: 0; }
        .discussion-msg-author { font-size: 13px; font-weight: 650; color: var(--ink, #0c1a14); }
        .discussion-msg-date { font-size: 11px; color: var(--muted-2, #8b988f); margin-left: auto; white-space: nowrap; }
        .discussion-msg-text { font-size: 13.5px; color: var(--gray-700, #33403a); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
        .discussion-msg-footer { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
        .discussion-like-btn { background: none; border: 1px solid var(--line, #eaefec); border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer; color: var(--muted, #56655e); display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s; font-family: inherit; }
        .discussion-like-btn:hover { border-color: var(--primary, #00875A); color: var(--primary, #00875A); background: var(--green-50, #e8f6ef); }
        .discussion-like-btn.liked { background: var(--green-50, #e8f6ef); border-color: var(--primary, #00875A); color: var(--primary, #00875A); font-weight: 700; }
        .discussion-form { margin-top: 4px; }
        .discussion-form textarea { width: 100%; padding: 11px 13px; border: 1px solid var(--line, #eaefec); border-radius: 12px; font-family: inherit; font-size: 13.5px; color: var(--ink, #0c1a14); resize: vertical; min-height: 80px; box-sizing: border-box; transition: border-color 0.15s, box-shadow 0.15s; }
        .discussion-form textarea:focus { outline: none; border-color: var(--primary, #00875A); box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.14); }
        .discussion-form-row { display: flex; justify-content: flex-end; margin-top: 8px; }
    </style>
</head>

<script>
    var directoryStorage = window.ImpulsionMarketing.directoryStorage;
    var security         = window.ImpulsionMarketing.security;
    var errors           = window.ImpulsionMarketing.errors;
    var help             = window.ImpulsionMarketing.help;
    var users            = window.ImpulsionMarketing.users;

    // Petite modale de saisie texte (remplace prompt). Appelle onConfirm(valeur) à la validation.
    function showPromptModal(opts) {
        opts = opts || {};
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10001;display:flex;align-items:center;justify-content:center;';
        var box = document.createElement('div');
        box.style.cssText = 'background:#fff;border-radius:10px;padding:22px;width:min(420px,90vw);box-shadow:0 10px 40px rgba(0,0,0,.25);';
        box.innerHTML =
            '<h3 style="margin:0 0 6px;font-size:16px;color:var(--gray-700);">' + security.escapeHtml(opts.title || 'Saisie') + '</h3>'
            + (opts.label ? '<p style="margin:0 0 12px;font-size:13px;color:var(--muted-2);">' + security.escapeHtml(opts.label) + '</p>' : '')
            + '<input type="text" class="form-control" placeholder="' + security.escapeHtml(opts.placeholder || '') + '" style="width:100%;box-sizing:border-box;margin-bottom:16px;">'
            + '<div style="display:flex;gap:8px;justify-content:flex-end;">'
            + '<button data-act="cancel" style="background:var(--line-2);color:var(--gray-700);border:1px solid var(--line);border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px;">Annuler</button>'
            + '<button data-act="ok" style="background:var(--primary);color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px;">' + security.escapeHtml(opts.confirmText || 'Valider') + '</button>'
            + '</div>';
        overlay.appendChild(box);
        document.body.appendChild(overlay);
        var input = box.querySelector('input');
        input.focus();
        function close() { overlay.remove(); }
        function submit() {
            var v = input.value.trim();
            if (!v) { input.style.borderColor = 'var(--red)'; input.focus(); return; }
            close();
            if (opts.onConfirm) opts.onConfirm(v);
        }
        box.querySelector('[data-act="cancel"]').addEventListener('click', close);
        box.querySelector('[data-act="ok"]').addEventListener('click', submit);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submit();
            else if (e.key === 'Escape') close();
        });
    }

    function pushNotifDebrancher(campagneName, campaignData) {
        if (!currentRootHandle) return;
        var assignments = (campaignData.workflow && campaignData.workflow.assignments) || {};

        function resolveAssignees(role) {
            var list = assignments[role] || [];
            if (typeof list === 'string') list = list ? [list] : [];
            if (!list.length) {
                list = users.USERS.filter(function(u) { return u.role === role && u.isManager; }).map(function(u) { return u.name; });
            }
            return list;
        }

        var destinataires = resolveAssignees('data').concat(resolveAssignees('ebf'));
        // Dédoublonnage
        var seen = {};
        destinataires = destinataires.filter(function(d) { return seen[d] ? false : (seen[d] = true); });
        if (!destinataires.length) return;

        currentRootHandle.getFileHandle('_notifications.json', { create: true })
            .then(function(fh) {
                return fh.getFile().then(function(f) { return f.text(); })
                    .then(function(txt) { return { fh: fh, notifs: JSON.parse(txt) }; })
                    .catch(function() { return { fh: fh, notifs: [] }; });
            })
            .then(function(res) {
                var now = new Date().toISOString();
                destinataires.forEach(function(dest) {
                    res.notifs.push({
                        id: 'notif-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                        type: 'campagne_inactive',
                        destinataire: dest,
                        campagneId: campagneName,
                        campagneTitre: campagneName,
                        dateCreation: now,
                        lu: false
                    });
                });
                return res.fh.createWritable().then(function(w) {
                    return w.write(JSON.stringify(res.notifs, null, 2)).then(function() { return w.close(); });
                });
            })
            .catch(function(e) { console.warn('Notif débrancher failed:', e); });
    }

    function toggleCampaignActif() {
        if (!currentCampaignName || !currentCampaignData) return;
        var isActif = currentCampaignData.actif !== false;
        var nouvelEtat = !isActif;
        var label = nouvelEtat ? 'réactiver' : 'rendre inactif';
        if (!confirm('Voulez-vous ' + label + ' cette campagne ?')) return;
        currentCampaignData.actif = nouvelEtat;
        if (!nouvelEtat) pushNotifDebrancher(currentCampaignName, currentCampaignData);
        workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData)
            .then(function() {
                var toggleActifBtn = document.getElementById('toggleActifButton');
                if (toggleActifBtn) {
                    toggleActifBtn.textContent = nouvelEtat ? '⏸️ Rendre inactif' : '▶️ Réactiver';
                    toggleActifBtn.style.color = nouvelEtat ? 'var(--red)' : 'var(--primary)';
                }
                var msg = nouvelEtat ? 'Campagne réactivée.' : 'Campagne rendue inactive.';
                errors.showNotification(msg, 'success', 2000);
                logActivity(currentCampaignName, 'statut', nouvelEtat ? 'Campagne réactivée' : 'Campagne rendue inactive');
            })
            .catch(function(err) {
                errors.showNotification('Erreur : ' + err.message, 'error');
            });
    }
    // ─────────────────────────────────────────────
    // SUPPRESSION CAMPAGNE (Item 14)
    // ─────────────────────────────────────────────
    function deleteCampaign() {
        if (!currentCampaignName || !currentRootHandle) return;
        if (!confirm('Supprimer définitivement la campagne "' + currentCampaignName + '" ?\n\nCette action est irréversible.')) return;
        currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(campDir) {
                // Supprimer le dossier de la campagne (récursif)
                return campDir.removeEntry(currentCampaignName, { recursive: true })
                    .then(function() { return campDir; });
            })
            .then(function(campDir) {
                // Retirer la campagne de _index.json
                return campDir.getFileHandle('_index.json', { create: false })
                    .then(function(fh) { return fh.getFile(); })
                    .then(function(f) { return f.text(); })
                    .then(function(text) {
                        var idx = JSON.parse(text);
                        if (idx.campaigns) delete idx.campaigns[currentCampaignName];
                        return campDir.getFileHandle('_index.json', { create: true })
                            .then(function(fh) { return fh.createWritable(); })
                            .then(function(w) { return w.write(JSON.stringify(idx, null, 2)).then(function() { return w.close(); }); });
                    });
            })
            .then(function() {
                // Invalider le cache IndexedDB
                try {
                    var ic = window.ImpulsionMarketing.performance.IndexCache;
                    if (ic && currentRootHandle) ic.set(currentRootHandle.name, null);
                } catch(e) {}
                errors.showNotification('Campagne supprimée.', 'success', 1500);
                setTimeout(function() { window.location.href = '../Impulsion-Marketing.html'; }, 1600);
            })
            .catch(function(err) {
                errors.showNotification('Erreur lors de la suppression : ' + err.message, 'error');
            });
    }

    // ─────────────────────────────────────────────
    // SUPPRESSION D'UN CANAL (Item 13)
    // ─────────────────────────────────────────────
    function deleteChannel(idx) {
        if (!currentCampaignName || !currentCampaignData) return;
        var ch = (currentCampaignData.channels || [])[idx];
        var label = ch ? (ch.deliverableName || ('Canal ' + (idx + 1))) : ('Canal ' + (idx + 1));
        if (!confirm('Supprimer le canal "' + label + '" de cette campagne ?')) return;
        currentCampaignData.channels.splice(idx, 1);
        workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData)
            .then(function() {
                errors.showNotification('Canal supprimé.', 'success', 2000);
                buildSideNav(currentCampaignName, currentCampaignData);
                navigateTo('info');
            })
            .catch(function(err) {
                // Annuler le splice si la sauvegarde échoue
                currentCampaignData.channels.splice(idx, 0, ch);
                errors.showNotification('Erreur : ' + err.message, 'error');
            });
    }

    function showError(message) {
        document.getElementById('loading').style.display = 'none';
        var el = document.getElementById('error');
        el.style.display = 'block';
        errors.showErrorInContainer(el, message, { showHomeButton: false });

    }

    // ─────────────────────────────────────────────
    // LOAD
    // ─────────────────────────────────────────────
    function checkPublicationEndDates(campaignName, data) {
        if (!currentRootHandle || !data.channels) return;
        var today = new Date(); today.setHours(0,0,0,0);
        var toNotify = [];
        data.channels.forEach(function(ch, idx) {
            if (!ch.siteWeb || !ch.siteWeb.dateFin) return;
            var fin = new Date(ch.siteWeb.dateFin); fin.setHours(0,0,0,0);
            if (fin > today) return;
            // Destinataire : webmaster EBF affecté ou manager EBF
            var assignments = (data.workflow && data.workflow.assignments) || {};
            var ebfAssignees = assignments.ebf || [];
            if (typeof ebfAssignees === 'string') ebfAssignees = ebfAssignees ? [ebfAssignees] : [];
            if (!ebfAssignees.length) {
                ebfAssignees = users.USERS.filter(function(u) { return u.role === 'ebf' && u.isManager; }).map(function(u) { return u.name; });
            }
            toNotify.push({ idx: idx, dateFin: ch.siteWeb.dateFin, dest: ebfAssignees, canal: ch.deliverableName || ('Canal ' + (idx + 1)) });
        });
        if (!toNotify.length) return;
        // Lire _notifications.json pour antidoublonnage
        currentRootHandle.getFileHandle('_notifications.json', { create: true })
            .then(function(fh) {
                return fh.getFile().then(function(f) { return f.text(); })
                    .then(function(txt) { return { fh: fh, notifs: JSON.parse(txt) }; })
                    .catch(function() { return { fh: fh, notifs: [] }; });
            })
            .then(function(res) {
                var notifs = res.notifs;
                var added = false;
                var now = new Date().toISOString();
                toNotify.forEach(function(item) {
                    item.dest.forEach(function(dest) {
                        var alreadySent = notifs.some(function(n) {
                            return n.type === 'publication_fin' && n.campagneId === campaignName && n.canalIdx === item.idx && n.destinataire === dest;
                        });
                        if (alreadySent) return;
                        notifs.push({
                            id: 'notif-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                            type: 'publication_fin',
                            destinataire: dest,
                            campagneId: campaignName,
                            campagneTitre: campaignName,
                            canalIdx: item.idx,
                            zone: item.canal,
                            dateFin: item.dateFin,
                            dateCreation: now,
                            lu: false
                        });
                        added = true;
                    });
                });
                if (!added) return;
                return res.fh.createWritable().then(function(w) {
                    return w.write(JSON.stringify(notifs, null, 2)).then(function() { return w.close(); });
                });
            })
            .catch(function(e) { console.warn('checkPublicationEndDates failed:', e); });
    }

    function loadCampaignDetails() {
        var campaignName = getUrlParameter('name');
        if (!campaignName) { showError('Aucune campagne spécifiée'); return; }

        directoryStorage.getRootHandleWithCheck()
            .then(function(result) {
                if (result.status !== 'success') {
                    showError(result.message + '<br><a href="../login.html" class="btn primary" style="margin-top:16px;">Se reconnecter</a>');
                    return;
                }
                currentRootHandle = result.handle;
                return result.handle.getDirectoryHandle('Campagnes')
                    .then(function(d) { return d.getDirectoryHandle(campaignName); })
                    .then(function(d) { return d.getFileHandle('campagne.json'); })
                    .then(function(fh) { return fh.getFile(); })
                    .then(function(f) { return f.text(); })
                    .then(function(text) {
                        var data = JSON.parse(text);
                        if (workflow) workflow.initWorkflow(data);
                        currentCampaignData = data;
                        initDetailsUI(campaignName, data);
                        checkPublicationEndDates(campaignName, data);
                    });
            })
            .catch(function(err) {
                showError('Impossible de charger la campagne : ' + err.message);
            });
    }

    function initDetailsUI(name, data) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('campaign-subtitle').textContent = name;

        var editBtn        = document.getElementById('editButton');

    // ─────────────────────────────────────────────
    // NAVIGATION SECONDAIRE
    // ─────────────────────────────────────────────
    function buildSideNav(name, data) {
        var nav = document.getElementById('details-sidenav');
        var channels = data.channels || [];
        var h = '<span class="details-sidenav-label">Navigation</span>';
        h += '<button class="details-nav-item" id="nav-item-info" data-page="info">📋 Infos campagne</button>';
        if (channels.length > 0) {
            h += '<div class="details-nav-separator"></div>';
            h += '<span class="details-sidenav-label">Canaux</span>';
            channels.forEach(function(ch, idx) {
                var label = ch.deliverableName || ('Canal ' + (idx + 1));
                h += '<button class="details-nav-item" id="nav-item-' + idx + '" data-page="' + idx + '" title="' + security.escapeHtml(label) + '">📡 ' + security.escapeHtml(label) + '</button>';
            });
        }
        nav.innerHTML = h;
        nav.querySelectorAll('.details-nav-item').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var p = btn.getAttribute('data-page');
                navigateTo(p === 'info' ? 'info' : parseInt(p, 10));
            });
        });
    }

    function navigateTo(pageKey) {
        currentPage = pageKey;
        document.querySelectorAll('.details-nav-item').forEach(function(b) { b.classList.remove('active'); });
        var navId = (pageKey === 'info') ? 'nav-item-info' : ('nav-item-' + pageKey);
        var navBtn = document.getElementById(navId);
        if (navBtn) navBtn.classList.add('active');

        var panel = document.getElementById('details-panel');
        if (pageKey === 'info') {
            panel.innerHTML = renderInfoPage(currentCampaignName, currentCampaignData);
            setupGlobalEvents(currentCampaignName, currentCampaignData);
        } else {
            var idx = pageKey;
            panel.innerHTML = renderChannelPage(idx, currentCampaignData);
            setupChannelPageEvents(idx);
            loadDepotForChannel(currentCampaignName, idx, currentCampaignData.channels[idx]);
        }
        panel.scrollTop = 0;
    }

    // ─────────────────────────────────────────────
    // HELPERS : assignations multi-membres (item 20)
    // assignments[role] peut être une string (legacy) ou un tableau de noms
    // ─────────────────────────────────────────────
    function getAssignees(assignments, role) {
        var val = (assignments || {})[role];
        if (!val) return [];
        return Array.isArray(val) ? val : [val];
    }
    function assigneesDisplay(assignments, role) {
        var arr = getAssignees(assignments, role);
        return arr.length ? arr.map(function(n){ return security.escapeHtml(n); }).join(', ') : '';
    }

    // Vérifie si une équipe est requise (délègue au module workflow)
    function isTeamRequired(data, team) {
        return workflow.isTeamRequired(data.requiredTeams, team);

    // ─────────────────────────────────────────────
    // PAGE : CANAL
    // ─────────────────────────────────────────────
    function renderChannelPage(idx, data) {
        var ch = (data.channels || [])[idx];
        if (!ch) return '<p class="error-message">Canal introuvable.</p>';

        // Étapes de CE canal (v2 : channelSteps par canal)
        var cs          = (data.workflow && data.workflow.channelSteps && data.workflow.channelSteps[idx]) || {};
        var assignments = data.workflow ? data.workflow.assignments : {};
        var currentUser = users && users.getCurrentUser();
        var html = '';

        var isPO = currentUser && currentUser.name === data.po;

        // En-tête canal
        html += '<div class="detail-section">';
        html += '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px;">';
        html += '<h3 style="margin:0;">📡 ' + security.escapeHtml(ch.deliverableName || ('Canal ' + (idx + 1))) + '</h3>';
        if (isPO) {
            html += '<button onclick="deleteChannel(' + idx + ')" style="background:none;border:1px solid var(--red);color:var(--red);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;">🗑️ Supprimer ce canal</button>';
        }
        html += '</div>';
        html += '<div class="detail-grid">';
        html += '<div class="detail-item"><span class="detail-label">Canal contenu</span><span class="detail-value">' + security.escapeHtml(ch.content || '-') + '</span></div>';
        html += '<div class="detail-item"><span class="detail-label">Date de réception client</span><span class="detail-value">' + security.escapeHtml(ch.sendDate || '-') + '</span></div>';
        html += '<div class="detail-item"><span class="detail-label">Type de Com</span><span class="detail-value">' + security.escapeHtml(ch.comType || '-') + '</span></div>';
        html += '<div class="detail-item"><span class="detail-label">Critère ciblage</span><span class="detail-value">' + security.escapeHtml(ch.targetingCriteria || '-') + '</span></div>';
        if (ch.emailObject) html += '<div class="detail-item"><span class="detail-label">Objet de l\'email</span><span class="detail-value">' + security.escapeHtml(ch.emailObject) + '</span></div>';
        if (ch.volumeCible) html += '<div class="detail-item"><span class="detail-label">Volume cible</span><span class="detail-value">' + ch.volumeCible.toLocaleString('fr-FR') + (ch.volumeCible > 100000 ? ' ⚠️' : '') + '</span></div>';
        if (ch.comTypology) html += '<div class="detail-item"><span class="detail-label">Typologie Com</span><span class="detail-value">' + security.escapeHtml(ch.comTypology) + '</span></div>';
        if (ch.urlTicTac)   html += '<div class="detail-item"><span class="detail-label">URL TicTac</span><span class="detail-value"><a href="' + security.escapeHtml(ch.urlTicTac) + '" target="_blank">Ouvrir</a></span></div>';
        if (ch.urlLccx)     html += '<div class="detail-item"><span class="detail-label">Lien LCCX</span><span class="detail-value"><a href="' + security.escapeHtml(ch.urlLccx) + '" target="_blank">Ouvrir</a></span></div>';
        var comStoreUrls = (ch.urlsComStore && ch.urlsComStore.length) ? ch.urlsComStore : (ch.urlComStore ? [ch.urlComStore] : []);
        if (comStoreUrls.length > 0) {
            html += '<div class="detail-item"><span class="detail-label">URL ComStore</span><span class="detail-value">';
            comStoreUrls.forEach(function(u, ui) {
                html += '<a href="' + security.escapeHtml(u) + '" target="_blank" style="display:block;">Ouvrir' + (comStoreUrls.length > 1 ? ' ' + (ui + 1) : '') + '</a>';
            });
            html += '</span></div>';

        html += '</div></div>';

        var _isSuperAdmin  = currentUser && currentUser.isSuperAdmin;
        var isAssignedCom  = _isSuperAdmin || (currentUser && getAssignees(assignments, 'com').indexOf(currentUser.name)  !== -1);
        var isAssignedEbf  = _isSuperAdmin || (currentUser && getAssignees(assignments, 'ebf').indexOf(currentUser.name)  !== -1);
        var isAssignedData = _isSuperAdmin || (currentUser && getAssignees(assignments, 'data').indexOf(currentUser.name) !== -1);

        var reqCom  = isTeamRequired(data, 'Com');
        var reqEbf  = isTeamRequired(data, 'EBF');
        var reqData = isTeamRequired(data, 'Data');
        var isLP    = ch.type === 'LP';

        // Zone 1 : Maquette Com — visible seulement si Com requis
        if (reqCom) {
            var comActive = cs.com_maquette === 'pending' || cs.com_maquette === 'revision_requested';
            html += buildComChannelSection(data, ch, idx, cs, isAssignedCom && comActive);
        }

        // Zone 2 : BAT EBF — visible seulement si EBF requis
        if (reqEbf) {
            var ebfBatActive = cs.ebf_bat === 'pending' || cs.ebf_bat === 'revision_requested';
            html += buildEbfBatChannelSection(data, ch, idx, cs, isAssignedEbf && ebfBatActive);
        }

        // Zone 3 : Ciblage Data — non visible pour canal LP
        if (reqData && !isLP) {
            var dataActive = cs.data_ciblage === 'pending' || cs.data_ciblage === 'revision_requested';
            html += buildDataChannelSection(data, ch, idx, cs, 'data_ciblage', 'Ciblage Data', isAssignedData && dataActive);
        }

        // Zone 4 : Lancement test — non visible pour canal LP
        if (reqData && reqEbf && !isLP && cs.data_lancement_test !== 'locked') {
            var ltActive = cs.data_lancement_test === 'pending' || cs.data_lancement_test === 'revision_requested';
            html += buildDataLancementTestSection(data, ch, idx, cs, isAssignedData && ltActive);
        }

        // Zone 5 : Test en prod EBF — visible si EBF+Data requis, OU si canal LP+EBF
        if (reqEbf && (reqData || isLP)) {
            var ebfTpActive = cs.ebf_test_prod === 'pending' || cs.ebf_test_prod === 'revision_requested';
            html += buildEbfTestProdChannelSection(data, ch, idx, cs, isAssignedEbf && ebfTpActive);
        }

        // Zone 6 : MEP Data — non visible pour canal LP
        if (reqData && !isLP && cs.data_mise_en_prod !== 'locked') {
            var mepActive = cs.data_mise_en_prod === 'pending';
            html += buildDataMepSection(data, ch, idx, cs, isAssignedData && mepActive);
        }

        // Zone 6 LP : MEP EBF — uniquement pour canal LP
        if (isLP && reqEbf && cs.ebf_mise_en_prod !== 'locked') {
            var ebfMepActive = cs.ebf_mise_en_prod === 'pending';
            html += buildEbfMepSection(data, ch, idx, cs, isAssignedEbf && ebfMepActive);
        }

        return html;
    }

    // ─────────────────────────────────────────────
    // WORKFLOW SECTION (timeline + manager + PO)
    // ─────────────────────────────────────────────
    function buildWorkflowSection(name, data) {
        var currentUser = users && users.getCurrentUser();
        var steps = data.workflow.steps;
        var assignments = data.workflow.assignments;
        var isCompleted = workflow.isCompleted(data);

        var statusColors = {
            locked:             { bg: '#e0e0e0', color: '#9e9e9e', icon: '🔒' },
            pending:            { bg: 'var(--amber-50)', color: 'var(--amber)', icon: '⏳' },
            submitted:          { bg: 'var(--blue-50)', color: 'var(--blue)', icon: '📤' },
            validated:          { bg: 'var(--green-50)', color: 'var(--green-600)', icon: '✅' },
            completed:          { bg: '#c8e6c9', color: 'var(--green-700)', icon: '🏁' },
            revision_requested: { bg: 'var(--amber-50)', color: 'var(--amber)', icon: '🔄' }
        };

        var globalSteps = data.workflow.steps || {};
        var channelSteps = data.workflow.channelSteps || {};
        var channels = data.channels || [];
        var numCh = channels.length;

        var html = '<div class="detail-section" id="workflow-section">';
        html += '<h3>🔄 Workflow</h3>';

        // ── Helpers stepper ──
        function wfStateClass(s) {
            if (s === 'validated' || s === 'completed') return 'done';
            if (s === 'submitted') return 'submitted';
            if (s === 'revision_requested') return 'revision';
            if (s === 'pending') return 'current';
            return 'locked';
        }
        function wfStepper(stepDefs, getStatus) {
            var h = '<div class="wf-stepper">';
            stepDefs.forEach(function(step, i) {
                var st = getStatus(step, i);
                var cls = wfStateClass(st);
                var content = (cls === 'done') ? '✓' : String(i + 1);
                h += '<div class="wf-step ' + cls + '"><div class="wf-node" title="' + security.escapeHtml(step.label) + '">' + content + '</div><div class="wf-label">' + security.escapeHtml(step.label) + '</div></div>';
            });
            h += '</div>';
            return h;
        }

        // ── Étapes globales (stepper) ──
        html += '<div class="wf-block"><div class="wf-head"><span class="wf-title">🚀 Préparation</span></div>';
        html += wfStepper(workflow.STEPS.slice(0, 3), function(step) { var s = globalSteps[step.id] || 'locked'; if (isCompleted) s = 'completed'; return s; });
        html += '</div>';

        // ── Étapes par canal (v2) ──
        var reqCom  = isTeamRequired(data, 'Com');
        var reqEbf  = isTeamRequired(data, 'EBF');
        var reqData = isTeamRequired(data, 'Data');
        var channelStepDefs = workflow.STEPS.slice(3).filter(function(step) {
            if (step.id === 'com_maquette' || step.id === 'po_validation_maquette') return reqCom;
            if (step.id === 'ebf_bat' || step.id === 'po_validation_bat') return reqEbf;
            if (step.id === 'data_ciblage' || step.id === 'po_validation_ciblage') return reqData;
            if (step.id === 'data_lancement_test' || step.id === 'ebf_test_prod' || step.id === 'po_validation_test_prod') return reqEbf && reqData;
            if (step.id === 'data_mise_en_prod') return reqData;
            return true;
        });

        if (numCh > 0 && channelStepDefs.length > 0) {
            channels.forEach(function(ch, ci) {
                var cs = channelSteps[ci] || {};
                var chCompleted = isCompleted || workflow.isChannelCompleted(cs, data.requiredTeams, ch.type);
                // Badge d'état courant du canal
                var badge = 'En cours', badgeCls = '';
                if (chCompleted) { badge = '🏁 Terminé'; badgeCls = 'done'; }
                else {
                    for (var i = 0; i < channelStepDefs.length; i++) {
                        var st = cs[channelStepDefs[i].id];
                        if (st === 'pending')            { badge = channelStepDefs[i].label; badgeCls = 'wait'; break; }
                        if (st === 'submitted')          { badge = 'En validation : ' + channelStepDefs[i].label; badgeCls = 'val'; break; }
                        if (st === 'revision_requested') { badge = 'Révision : ' + channelStepDefs[i].label; badgeCls = 'rev'; break; }
                    }
                }
                html += '<div class="wf-block"><div class="wf-head"><span class="wf-title">📡 ' + security.escapeHtml(ch.deliverableName || ('Canal ' + (ci + 1))) + '</span><span class="wf-badge ' + badgeCls + '">' + security.escapeHtml(badge) + '</span></div>';
                html += wfStepper(channelStepDefs, function(step) { return chCompleted ? 'completed' : (cs[step.id] || 'locked'); });
                html += '</div>';
            });
        }

        // Légende
        html += '<div class="wf-legend"><span><i style="background:var(--primary)"></i> Fait</span><span><i style="background:var(--amber)"></i> En cours</span><span><i style="background:var(--blue)"></i> En validation</span><span><i style="background:var(--red)"></i> Révision</span><span><i style="background:#fff;border:1px solid var(--muted-2)"></i> À venir</span></div>';

        if (isCompleted) {
            html += '<div style="background:#c8e6c9;color:var(--green-700);border-radius:8px;padding:12px 16px;font-weight:700;margin-bottom:12px;">🏁 Campagne terminée !</div>';
            html += '</div>';
            return html;
        }

        var hasAssignments = getAssignees(assignments, 'com').length || getAssignees(assignments, 'ebf').length || getAssignees(assignments, 'data').length;
        if (hasAssignments) {

            }
            // Helper local : génère un groupe de checkboxes pour une équipe
            function buildTeamCheckboxes(role, label, teamUsers, currentAssignments) {

        if (isPOKickoff && steps.po_kickoff === 'pending') {
            var teamsSubject = encodeURIComponent('Kick-off \u2014 ' + (name || ''));
            var teamsUrl = 'https://teams.microsoft.com/l/meeting/new?subject=' + teamsSubject + '&tenantId=fb3baf17-c313-474c-8d5d-577a3ec97a32';
            var kfParticipants = [];

            getAssignees(assignments, 'com').forEach(function(n) { kfParticipants.push({ role: 'Com', name: n }); });

                    html += '</div>';
                });
                html += '</div>';
                html += '</div>';
            }
            html += '<button id="btn-validate-kickoff" style="margin-top:14px;background:var(--blue);color:#fff;border:none;border-radius:6px;padding:8px 20px;font-weight:600;cursor:pointer;">✅ Kick-off réalisé</button>';
            html += '</div>';
        }

        // ── Bannières d'alerte : PO (validation) + acteurs (action à réaliser) ──
        var alertChannels = data.channels || [];
        var userName = currentUser ? currentUser.name : null;

        function renderAlertBanner(label, isRevision, style) {
            var h = '<div style="background:' + style.bg + ';border:1px solid ' + style.border + ';border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">';

        var poStyle    = { bg:'#fff8e1', border:'var(--amber)', color:'var(--amber)', icon:'⚠️', btnBg:'var(--amber)' };
        var actStyle   = { bg:'var(--blue-50)', border:'var(--blue)', color:'var(--blue)', icon:'⚡', btnBg:'var(--blue)' };
        var revStyle   = { bg:'var(--amber-50)', border:'var(--amber)', color:'var(--amber)', icon:'🔄', btnBg:'var(--amber)' };

        // PO : validations en attente
        var isPO = users.isCurrentUserPO(data);
        if (isPO) {
            if (steps.po_kickoff === 'pending')
                html += '<div style="background:var(--blue-50);border:1px solid var(--blue);border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--blue);">🚀 Kick-off à organiser avec les équipes affectées</div>';
            [
                { id: 'po_validation_maquette',  label: 'Validation requise : <strong>Maquette Com</strong>' },
                { id: 'po_validation_bat',       label: 'Validation requise : <strong>Réalisation BAT</strong>' },
                { id: 'po_validation_ciblage',   label: 'Validation requise : <strong>Ciblage Data</strong>' },
                { id: 'po_validation_test_prod', label: 'Validation requise : <strong>Test en production</strong>' }
            ].forEach(function(vs) {
                if (steps[vs.id] === 'pending') html += renderAlertBanner(vs.label, false, poStyle);
            });
        }

        // COM : dépôt maquette
        if (userName && getAssignees(assignments, 'com').indexOf(userName) !== -1) {
            if (steps.com_maquette === 'pending')
                html += renderAlertBanner('Action requise : <strong>Déposer la maquette Com</strong>', false, actStyle);

        // EBF : BAT + Test en prod
        if (userName && getAssignees(assignments, 'ebf').indexOf(userName) !== -1) {
            if (steps.ebf_bat === 'pending')
                html += renderAlertBanner('Action requise : <strong>Déposer le BAT</strong>', false, actStyle);
            else if (steps.ebf_bat === 'revision_requested')
                html += renderAlertBanner('Modification demandée : <strong>Réalisation BAT</strong>', true, revStyle);
            if (steps.ebf_test_prod === 'pending')
                html += renderAlertBanner('Action requise : <strong>Déposer le test en production</strong>', false, actStyle);
            else if (steps.ebf_test_prod === 'revision_requested')
                html += renderAlertBanner('Modification demandée : <strong>Test en production</strong>', true, revStyle);
        }

        // DATA : ciblage + lancement test + MEP
        if (userName && getAssignees(assignments, 'data').indexOf(userName) !== -1) {
            if (steps.data_ciblage === 'pending')
                html += renderAlertBanner('Action requise : <strong>Déposer le ciblage Data</strong>', false, actStyle);
            else if (steps.data_ciblage === 'revision_requested')
                html += renderAlertBanner('Modification demandée : <strong>Ciblage Data</strong>', true, revStyle);
            if (steps.data_lancement_test === 'pending')
                html += renderAlertBanner('Action requise : <strong>Lancer le test en production</strong>', false, actStyle);
            if (steps.data_mise_en_prod === 'pending')
                html += renderAlertBanner('Action requise : <strong>Confirmer la mise en production</strong>', false, actStyle);
        }

        html += '</div>';
        return html;
    }

    function sanitizeName(name) {
        return (name || '').replace(/[^a-zA-Z0-9\u00C0-\u017E \-_]/g, '_').trim();
    }
    function setVal(id, val) {
        var el = document.getElementById(id);
        if (el && val !== undefined && val !== null) el.value = val;
    }
    function getChannelFolder(idx) {
        var ch = (currentCampaignData.channels || [])[idx];
        return sanitizeName(ch ? ch.deliverableName : ('canal_' + idx));
    }

    function updateChannelStatusUI(prefix, idx, status) {
        var el = document.getElementById(prefix + '-status-' + idx);
        if (!el) return;
        if (status === 'submitted') {
            el.textContent = '📤 Soumis';
            el.className = 'ch-save-status ch-save-status--submitted';
        } else if (status === 'saved') {
            el.textContent = '✅ Enregistré';
            el.className = 'ch-save-status ch-save-status--saved';
        } else {
            el.textContent = '⏳ Non enregistré';
            el.className = 'ch-save-status';
        }
    }

    function saveDepotFile(campaignName, channelFolder, fileName, depotData) {
        return currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(d) { return d.getDirectoryHandle(channelFolder, { create: true }); })
            .then(function(chDir) { return chDir.getFileHandle(fileName, { create: true }); })
            .then(function(fh) { return fh.createWritable(); })
            .then(function(w) { return w.write(JSON.stringify(depotData, null, 2)).then(function() { return w.close(); }); });
    }

    function readDepotFile(campaignName, channelFolder, fileName) {
        return currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(d) { return d.getDirectoryHandle(channelFolder); })
            .then(function(chDir) { return chDir.getFileHandle(fileName); })
            .then(function(fh) { return fh.getFile(); })
            .then(function(f) { return f.text(); })
            .then(function(t) { return JSON.parse(t); });
    }

    // v2 : chaque canal avance indépendamment — plus de submittedSet global
    function tryAdvanceWorkflow(stepId, submittedSet, beforeAdvanceFn) {
        // Conservé pour rétrocompat mais ne devrait plus être appelé pour les étapes canal
        var s = currentCampaignData.workflow.steps;
        if (!s[stepId]) return; // étape globale absente → étape canal, géré autrement
        if (s[stepId] !== 'pending' && s[stepId] !== 'revision_requested') return;
        var totalCh = (currentCampaignData.channels || []).length;
        if (submittedSet.size >= totalCh) {
            if (beforeAdvanceFn) beforeAdvanceFn();
            workflow.advanceStep(currentCampaignData, stepId, 'submitted');
            workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData)
                .then(function() { refreshCurrentPage(); });
        }
    }

    // ── Lightbox ──
    // État de zoom/pan de l'image en plein écran.
    var _lbScale = 1, _lbTx = 0, _lbTy = 0, _lbDrag = null;
    function _lbApply() {
        var img = document.getElementById('lightbox-img');
        if (!img) return;
        img.style.transform = 'translate(' + _lbTx + 'px,' + _lbTy + 'px) scale(' + _lbScale + ')';
        img.style.cursor = _lbScale > 1 ? 'grab' : 'zoom-in';
    }
    function _lbReset() { _lbScale = 1; _lbTx = 0; _lbTy = 0; _lbApply(); }

    (function() {
        var overlay = document.createElement('div');
        overlay.id = 'lightbox-overlay';
        overlay.innerHTML = '<button id="lightbox-close">✕</button>'
            + '<div id="lightbox-hint" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;opacity:.65;font-size:12px;pointer-events:none;">Molette : zoom · double-clic : zoom/dézoom · glisser : déplacer</div>'
            + '<img id="lightbox-img" src="" alt=""><iframe id="lightbox-frame" style="display:none;"></iframe>';
        document.body.appendChild(overlay);
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay || e.target === document.getElementById('lightbox-close')) closeLightbox();
        });
        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

        var img = document.getElementById('lightbox-img');
        img.addEventListener('wheel', function(e) {
            e.preventDefault();
            _lbScale = Math.min(8, Math.max(1, _lbScale * (e.deltaY < 0 ? 1.2 : 1 / 1.2)));
            if (_lbScale === 1) { _lbTx = 0; _lbTy = 0; }
            _lbApply();
        }, { passive: false });
        img.addEventListener('dblclick', function(e) {
            e.preventDefault();
            if (_lbScale > 1) _lbReset(); else { _lbScale = 2.5; _lbApply(); }
        });
        img.addEventListener('mousedown', function(e) {
            if (_lbScale <= 1) return;
            e.preventDefault();
            _lbDrag = { x: e.clientX - _lbTx, y: e.clientY - _lbTy };
            img.style.cursor = 'grabbing';
        });
        document.addEventListener('mousemove', function(e) {
            if (!_lbDrag) return;
            _lbTx = e.clientX - _lbDrag.x; _lbTy = e.clientY - _lbDrag.y; _lbApply();
        });
        document.addEventListener('mouseup', function() { if (_lbDrag) { _lbDrag = null; _lbApply(); } });
    })();

    function openLightbox(url) {
        var img = document.getElementById('lightbox-img'), fr = document.getElementById('lightbox-frame');
        fr.style.display = 'none'; fr.src = '';
        document.getElementById('lightbox-hint').style.display = '';
        img.style.display = ''; img.src = url; _lbReset();
        document.getElementById('lightbox-overlay').classList.add('open');
    }
    function openLightboxPdf(url) {
        var img = document.getElementById('lightbox-img'), fr = document.getElementById('lightbox-frame');
        img.style.display = 'none'; img.src = '';
        document.getElementById('lightbox-hint').style.display = 'none';
        fr.style.display = ''; fr.src = url;
        document.getElementById('lightbox-overlay').classList.add('open');
    }
    function closeLightbox() {
        var img = document.getElementById('lightbox-img'), fr = document.getElementById('lightbox-frame');
        document.getElementById('lightbox-overlay').classList.remove('open');
        if (img) img.src = '';
        if (fr) fr.src = '';
        _lbReset();
    }

    // Aperçu d'un fichier déposé (maquette / BAT / test prod) : image cliquable (zoom),
    // PDF en aperçu inline + bouton plein écran, sinon lien d'ouverture.
    function renderDepotPreview(el, file, label) {
        if (!el) return;
        var url = URL.createObjectURL(file);
        var isImg = (file.type || '').indexOf('image/') === 0;
        var isPdf = (file.type === 'application/pdf') || /\.pdf$/i.test(file.name || '');
        if (isImg) {
            el.innerHTML = '<img src="' + url + '" alt="Aperçu ' + label + '" title="Cliquer pour agrandir" onclick="openLightbox(this.src)" style="max-width:100%;max-height:340px;border-radius:6px;border:1px solid var(--line);margin-top:4px;cursor:zoom-in;">';
        } else if (isPdf) {
            el.innerHTML =
                '<div style="margin-top:4px;border:1px solid var(--line);border-radius:6px;overflow:hidden;">'
                + '<iframe src="' + url + '#toolbar=1" style="width:100%;height:380px;border:none;display:block;"></iframe></div>'
                + '<div style="margin-top:6px;display:flex;gap:10px;align-items:center;">'
                + '<button type="button" onclick="openLightboxPdf(\'' + url + '\')" style="background:var(--primary);color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px;">⛶ Agrandir</button>'
                + '<a href="' + url + '" target="_blank" style="color:var(--primary);font-size:12px;">↗ Ouvrir dans un onglet</a></div>';
        } else {
            el.innerHTML = '<a href="' + url + '" target="_blank" style="color:var(--primary);font-size:13px;display:inline-block;margin-top:4px;">📄 Ouvrir le fichier ' + label + '</a>';
        }
    }

    function loadDepotForChannel(campaignName, idx, ch) {
        if (!currentRootHandle || !ch) return;
        var folder = sanitizeName(ch.deliverableName || ('canal_' + idx));

        if (loadedDepots[idx]) {
            var cache = loadedDepots[idx];
            if (cache.com)     { fillComForm(idx, cache.com); renderComReadonly(idx, cache.com); if (cache.com.pdfComSavedName) loadComFilePreview(idx, folder, cache.com.pdfComSavedName); }
            else { var ce = document.getElementById('com-empty-' + idx);  if (ce) ce.style.display = 'block'; }
            if (cache.ebf)     { fillEbfForm(idx, cache.ebf); renderEbfReadonly(idx, cache.ebf); if (cache.ebf.pdfBatSavedName) loadBatImagePreview(idx, folder, cache.ebf.pdfBatSavedName); }
            else { var ee = document.getElementById('ebf-empty-' + idx);  if (ee) ee.style.display = 'block'; }
            if (cache.data)    { fillDataForm(idx, cache.data); renderDataReadonly(idx, cache.data); }
            else { var de = document.getElementById('data-empty-' + idx); if (de) de.style.display = 'block'; }
            if (cache.datamep) { renderDataMepReadonly(idx, cache.datamep); }
            else { var dme = document.getElementById('data-mep-empty-' + idx); if (dme) dme.style.display = 'block'; }
            if (cache.ebftest) { renderEbfTestProdReadonly(idx, cache.ebftest); if (cache.ebftest.pdfTestProdSavedName) loadTestProdImagePreview(idx, folder, cache.ebftest.pdfTestProdSavedName); }
            else { var ete = document.getElementById('ebf-testprod-empty-' + idx); if (ete) ete.style.display = 'block'; }
            if (cache.datatest) { renderDataLancementTestReadonly(idx, cache.datatest); }
            else { var dte = document.getElementById('data-testlaunch-empty-' + idx); if (dte) dte.style.display = 'block'; }
            return;
        }

        loadedDepots[idx] = {};

        readDepotFile(campaignName, folder, 'depotcom.json')
            .then(function(d) {
                loadedDepots[idx].com = d;
                fillComForm(idx, d);
                renderComReadonly(idx, d);
                if (d.pdfComSavedName) loadComFilePreview(idx, folder, d.pdfComSavedName);
            })
            .catch(function() {
                var el = document.getElementById('com-empty-' + idx);
                if (el) el.style.display = 'block';
            });

        readDepotFile(campaignName, folder, 'depotebf.json')
            .then(function(d) {
                loadedDepots[idx].ebf = d;
                fillEbfForm(idx, d);
                renderEbfReadonly(idx, d);
                if (d.pdfBatSavedName) loadBatImagePreview(idx, folder, d.pdfBatSavedName);
            })
            .catch(function() {
                var el = document.getElementById('ebf-empty-' + idx);
                if (el) el.style.display = 'block';
            });

        readDepotFile(campaignName, folder, 'depotdata.json')
            .then(function(d) {
                loadedDepots[idx].data = d;
                fillDataForm(idx, d);
                renderDataReadonly(idx, d);
            })
            .catch(function() {
                var el = document.getElementById('data-empty-' + idx);
                if (el) el.style.display = 'block';
            });

        readDepotFile(campaignName, folder, 'depotebf_test.json')
            .then(function(d) {
                loadedDepots[idx].ebftest = d;
                renderEbfTestProdReadonly(idx, d);
                if (d.pdfTestProdSavedName) loadTestProdImagePreview(idx, folder, d.pdfTestProdSavedName);
            })
            .catch(function() {
                var el = document.getElementById('ebf-testprod-empty-' + idx);
                if (el) el.style.display = 'block';
            });

        readDepotFile(campaignName, folder, 'depotdata_mep.json')
            .then(function(d) {
                loadedDepots[idx].datamep = d;
                renderDataMepReadonly(idx, d);
            })
            .catch(function() {
                var el = document.getElementById('data-mep-empty-' + idx);
                if (el) el.style.display = 'block';
            });

        readDepotFile(campaignName, folder, 'depotdata_test.json')
            .then(function(d) {
                loadedDepots[idx].datatest = d;
                renderDataLancementTestReadonly(idx, d);
            })
            .catch(function() {
                var el = document.getElementById('data-testlaunch-empty-' + idx);
                if (el) el.style.display = 'block';
            });
    }

    // ─────────────────────────────────────────────
    // EVENTS : PAGE CANAL (par canal)

    function setupChannelPageEvents(idx) {
        // COM : numImages → dynamic URL inputs
        var numImgInput = document.getElementById('com-numimages-' + idx);
        if (numImgInput) {
            numImgInput.addEventListener('input', function() {

        var numCtaInput = document.getElementById('ebf-numcta-' + idx);
        if (numCtaInput) {
            numCtaInput.addEventListener('input', function() {
                updateEbfCtaUrls(idx, parseInt(numCtaInput.value) || 0, []);
            });
        }

        // ── Save COM ──
        var btnSaveCom = document.querySelector('.btn-save-com[data-ch="' + idx + '"]');
        if (btnSaveCom) {
            btnSaveCom.addEventListener('click', function() {
                var folder = getChannelFolder(idx);
                var depot  = collectComDepot(idx);
                depot.status = 'pending';
                // Persister la date de dépôt maquette dans campagne.json
                if (depot.depotMaquetteDate) {
                    currentCampaignData.workflow.channelDates = currentCampaignData.workflow.channelDates || {};
                    currentCampaignData.workflow.channelDates[idx] = currentCampaignData.workflow.channelDates[idx] || {};
                    currentCampaignData.workflow.channelDates[idx].depotMaquetteDate = depot.depotMaquetteDate;
                    workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData)
                        .catch(function(err) {
                            console.error('Échec de la sauvegarde de la date de dépôt maquette :', err);
                            errors.showNotification('La date de dépôt n\'a pas pu être enregistrée : ' + err.message, 'error');
                        });
                }
                disableBtn(btnSaveCom, 'Enregistrement...');
                saveDepotFile(currentCampaignName, folder, 'depotcom.json', depot)
                    .then(function() {
                        loadedDepots[idx] = loadedDepots[idx] || {};
                        loadedDepots[idx].com = depot;
                        enableBtn(btnSaveCom, '💾 Enregistrer');
                        errors.showNotification('Canal enregistré !', 'success', 2000);
                    })
                    .catch(function(err) { enableBtn(btnSaveCom, '💾 Enregistrer'); errors.showNotification('Erreur : ' + err.message, 'error'); });
            });
        }

        // ── Submit COM ──
        var btnSubmitCom = document.querySelector('.btn-submit-canal-com[data-ch="' + idx + '"]');
        if (btnSubmitCom) {
            btnSubmitCom.addEventListener('click', function() {
                var folder = getChannelFolder(idx);
                var depot  = collectComDepot(idx);
                depot.status = 'submitted';
                var comFileEl = document.getElementById('com-pdf-' + idx);
                var comFileToSave = comFileEl && comFileEl.files[0];
                if (comFileToSave) {
                    var comExt = comFileToSave.name.split('.').pop().toLowerCase();
                    depot.pdfComSavedName = 'maquette_canal_' + idx + '.' + comExt;
                }
                disableBtn(btnSubmitCom, 'Envoi...');
                saveDepotFile(currentCampaignName, folder, 'depotcom.json', depot)
                    .then(function() {
                        loadedDepots[idx] = loadedDepots[idx] || {};
                        loadedDepots[idx].com = depot;
                        if (comFileToSave && depot.pdfComSavedName) {
                            currentRootHandle.getDirectoryHandle('Campagnes')
                                .then(function(d) { return d.getDirectoryHandle(currentCampaignName); })
                                .then(function(d) { return d.getDirectoryHandle(folder, {create:true}); })
                                .then(function(d) { return d.getFileHandle(depot.pdfComSavedName, {create:true}); })
                                .then(function(fh) { return fh.createWritable(); })
                                .then(function(w) { return comFileToSave.arrayBuffer().then(function(buf) { return w.write(buf).then(function() { return w.close(); }); }); })
                                .catch(function(err) {
                                    console.error('Échec de l\'enregistrement du fichier maquette :', err);
                                    errors.showNotification('Le fichier maquette n\'a pas pu être enregistré : ' + err.message, 'error');
                                });
                        }
                        // v2 : avancement direct du canal
                        workflow.advanceChannelStep(currentCampaignData, idx, 'com_maquette', 'submitted');
                        workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData)
                            .then(function() { refreshCurrentPage(); });
                        enableBtn(btnSubmitCom, '📤 Soumettre ce canal');
                        errors.showNotification('Canal soumis !', 'success', 2000);
                    })
                    .catch(function(err) { enableBtn(btnSubmitCom, '📤 Soumettre ce canal'); errors.showNotification('Erreur : ' + err.message, 'error'); });
            });
        }

        // ── Submit EBF (BAT ou Test Prod) ──
        document.querySelectorAll('.btn-submit-canal-ebf[data-ch="' + idx + '"]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var stepId      = btn.getAttribute('data-step') || 'ebf_bat';
                var isTestProd  = stepId === 'ebf_test_prod';
                var folder      = getChannelFolder(idx);
                var depotFile   = isTestProd ? 'depotebf_test.json' : 'depotebf.json';
                var btnLabel    = '📤 Soumettre ce canal';
                var depot;
                var batFileToSave = null;
                var testProdFileToSave = null;
                if (isTestProd) {
                    depot = collectEbfTestProdDepot(idx);
                    depot.status = 'submitted';
                    var pdfTpEl = document.getElementById('ebf-pdf-testprod-' + idx);
                    testProdFileToSave = pdfTpEl && pdfTpEl.files[0];
                    if (testProdFileToSave) {
                        var tpExt = testProdFileToSave.name.split('.').pop().toLowerCase();
                        depot.pdfTestProdSavedName = 'testprod_canal_' + idx + '.' + tpExt;
                    }
                } else {
                    depot = collectEbfDepot(idx);
