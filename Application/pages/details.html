        // ── PO : lien vers canal à valider ──

    // ── Journal d'activité ──────────────────────────────────
    // Historique « qui a fait quoi, quand » par campagne, dans activity.json
    // (dossier de la campagne). Les discussions ne sont volontairement PAS tracées.
    var ACT_STEP_LABELS = {
        po_saisie: 'Saisie projet', manager_affectation: 'Affectation', po_kickoff: 'Kick-off',
        com_maquette: 'Maquette Com', po_validation_maquette: 'Validation maquette',
        ebf_bat: 'Réalisation BAT', po_validation_bat: 'Validation BAT',
        data_ciblage: 'Ciblage Data', po_validation_ciblage: 'Validation ciblage',
        data_lancement_test: 'Lancement test', ebf_test_prod: 'Test en prod',
        po_validation_test_prod: 'Validation test', data_mise_en_prod: 'Mise en prod',
        ebf_mise_en_prod: 'Mise en prod LP'
    };
    var ACT_STATUS_LABELS = { submitted: 'soumis', validated: 'validé', completed: 'terminé', revision_requested: 'révision demandée' };
    var ACT_ICONS = { workflow: '🔄', document: '📁', statut: '🔌', campagne: '📝', affectation: '👥' };
    var _activityCache = [];

    function logActivity(campaignName, type, detail) {
        var u = users && users.getCurrentUser();
        var actor = u ? u.name : '?';
        if (!currentRootHandle || !campaignName) return Promise.resolve();
        return currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(dir) {
                return dir.getFileHandle('activity.json', { create: true }).then(function(fh) {
                    return fh.getFile().then(function(f) { return f.text(); })
                        .then(function(t) { var a; try { a = JSON.parse(t); } catch (e) { a = []; } return { fh: fh, list: Array.isArray(a) ? a : [] }; })
                        .catch(function() { return { fh: fh, list: [] }; });
                }).then(function(res) {
                    res.list.push({ id: 'act-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4), date: new Date().toISOString(), type: type, acteur: actor, detail: detail });
                    return res.fh.createWritable().then(function(w) { return w.write(JSON.stringify(res.list, null, 2)).then(function() { return w.close(); }); });
                });
            })
            .then(function() { if (campaignName === currentCampaignName) loadActivity(campaignName); })
            .catch(function(e) { console.warn('logActivity:', e && e.message); });
    }

    function readActivity(campaignName) {
        return currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(d) { return d.getFileHandle('activity.json'); })
            .then(function(fh) { return fh.getFile(); }).then(function(f) { return f.text(); })
            .then(function(t) { var a = JSON.parse(t); return Array.isArray(a) ? a : []; })
            .catch(function() { return []; });
    }

    function loadActivity(campaignName) {
        var loading = document.getElementById('activity-loading'), content = document.getElementById('activity-content');
        if (!loading || !content) return;
        readActivity(campaignName).then(function(list) { _activityCache = list; renderActivity(); });
        var filter = document.getElementById('activity-filter');
        if (filter && !filter._actBound) { filter._actBound = true; filter.addEventListener('change', renderActivity); }
    }

    function renderActivity() {
        var loading = document.getElementById('activity-loading'), content = document.getElementById('activity-content');
        if (!loading || !content) return;
        loading.style.display = 'none'; content.style.display = 'block';
        var filter = (document.getElementById('activity-filter') || {}).value || '';
        var list = _activityCache.slice().sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
        if (filter) list = list.filter(function(e) { return e.type === filter; });
        if (!list.length) { content.innerHTML = '<p style="color:var(--muted-2);font-size:13px;margin:0;">Aucune activité' + (filter ? ' pour ce filtre' : '') + '.</p>'; return; }
        var html = '';
        list.forEach(function(e) {
            var when = e.date ? new Date(e.date).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
            html += '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);">'
                + '<span style="flex:none;">' + (ACT_ICONS[e.type] || '•') + '</span>'
                + '<div style="flex:1;min-width:0;"><div style="font-size:13px;color:var(--ink,#0c1a14);">' + security.escapeHtml(e.detail || '') + '</div>'
                + '<div style="font-size:11px;color:var(--muted-2,#8b988f);">' + security.escapeHtml(e.acteur || '?') + ' · ' + when + '</div></div></div>';
        });
        content.innerHTML = html;
    }

    // ─────────────────────────────────────────────────────────
    // NOTIFICATIONS DE WORKFLOW
    // Générées automatiquement aux transitions d'étapes (dépôt → PO à valider,
    // validation PO → équipe suivante, révision → équipe concernée, MEP → info).
    // Branchées sur le même wrapper que le journal d'activité (couvre tous les handlers).
    // ─────────────────────────────────────────────────────────
    function _assigneesForRole(assignments, role) {
        var list = assignments[role] || [];
        if (typeof list === 'string') list = list ? [list] : [];
        if (!list.length) {
            list = users.USERS.filter(function(u) { return u.role === role && u.isManager; }).map(function(u) { return u.name; });
        }
        return list.slice();
    }
    // PO + co-PO (suppléance) : tous destinataires des notifications PO.
    function _poOf(data) {
        var list = data.po ? [data.po] : [];
        (Array.isArray(data.coPo) ? data.coPo : (data.coPo ? [data.coPo] : [])).forEach(function(n) {
            if (n && list.indexOf(n) === -1) list.push(n);
        });
        return list;
    }

    var _DEPOT_LABELS = { com_maquette: 'Maquette', ebf_bat: 'BAT', data_ciblage: 'Ciblage', ebf_test_prod: 'Test en production' };

    // Notif pour une transition d'étape de CANAL → { type, recipients, message, channel } | null
    function buildChannelNotif(data, idx, stepId, status) {
        var ch = (data.channels && data.channels[idx]) || {};
        var chName = ch.deliverableName || ch.content || ('Canal ' + (idx + 1));
        // Destinataires effectifs de CE canal (équipe campagne + renfort du canal).
        function mk(role) {
            var list = workflow.channelAssignees(data, idx, role);
            if (!list.length) list = users.USERS.filter(function(u) { return u.role === role && u.isManager && !u.inactive; }).map(function(u) { return u.name; });
            return list.slice();
        }
        // Dépôt soumis → le PO a quelque chose à valider
        if (status === 'submitted' && _DEPOT_LABELS[stepId]) {
            return { type: 'workflow_a_valider', recipients: _poOf(data), message: _DEPOT_LABELS[stepId] + ' déposé — à valider.', channel: chName };
        }
        // Data lance le test → l'EBF dépose le test en production
        if (status === 'submitted' && stepId === 'data_lancement_test') {
            return { type: 'workflow_a_faire', recipients: mk('ebf'), message: 'Test lancé — à toi de déposer le test en production.', channel: chName };
        }
        // Validation PO → c'est au tour de l'équipe suivante
        if (status === 'validated') {
            if (stepId === 'po_validation_maquette') return { type: 'workflow_a_faire', recipients: mk('ebf'),  message: 'Maquette validée — à toi de réaliser le BAT.', channel: chName };
            if (stepId === 'po_validation_bat')      return { type: 'workflow_a_faire', recipients: mk('data'), message: 'BAT validé — à toi de réaliser le ciblage.', channel: chName };
            if (stepId === 'po_validation_ciblage')  return { type: 'workflow_a_faire', recipients: mk('data'), message: 'Ciblage validé — à toi de lancer le test.', channel: chName };
            if (stepId === 'po_validation_test_prod')return { type: 'workflow_a_faire', recipients: mk('data'), message: 'Test validé — à toi de mettre en production.', channel: chName };
        }
        // MEP effectuée → info au PO + équipes
        if (status === 'completed' && (stepId === 'data_mise_en_prod' || stepId === 'ebf_mise_en_prod')) {
            var rec = _poOf(data).concat(mk('com'), mk('ebf'), mk('data'));
            return { type: 'workflow_info', recipients: rec, message: 'Mise en production effectuée 🚀', channel: chName };
        }
        // Révision demandée → l'équipe qui a produit le livrable
        if (status === 'revision_requested') {
            var roleByStep = { com_maquette: 'com', ebf_bat: 'ebf', data_ciblage: 'data', ebf_test_prod: 'ebf', data_lancement_test: 'data' };
            var r = roleByStep[stepId];
            if (r) return { type: 'workflow_revision', recipients: mk(r), message: 'Révision demandée sur « ' + (_DEPOT_LABELS[stepId] || stepId) + ' ».', channel: chName };
        }
        return null;
    }

    // Notif pour une transition d'étape GLOBALE → { type, recipients, message } | null
    function buildGlobalNotif(data, stepId, status) {
        var a = (data.workflow && data.workflow.assignments) || {};
        if (stepId === 'manager_affectation' && status === 'validated') {
            var rec = _poOf(data).concat(_assigneesForRole(a, 'com'), _assigneesForRole(a, 'ebf'), _assigneesForRole(a, 'data'));
            return { type: 'workflow_info', recipients: rec, message: 'Affectation réalisée — tu es sur cette campagne.' };
        }
        if (stepId === 'po_kickoff' && status === 'validated') {
            return { type: 'workflow_a_faire', recipients: _assigneesForRole(a, 'com'), message: 'Kick-off réalisé — la maquette peut démarrer.' };
        }
        return null;
    }

    // Écrit les notifications bufferisées dans _notifications.json (après la sauvegarde).
    function flushWorkflowNotifs(rootHandle, name, specs) {
        if (!rootHandle || !specs || !specs.length) return;
        var me = (users.getCurrentUser() || {}).name || '';
        rootHandle.getFileHandle('_notifications.json', { create: true })
            .then(function(fh) {
                return fh.getFile().then(function(f) { return f.text(); })
                    .then(function(t) { var arr; try { arr = JSON.parse(t); } catch (e) { arr = []; } return { fh: fh, notifs: Array.isArray(arr) ? arr : [] }; })
                    .catch(function() { return { fh: fh, notifs: [] }; });
            })
            .then(function(res) {
                var now = new Date().toISOString();
                specs.forEach(function(spec) {
                    var seen = {};
                    // Exclut l'auteur de l'action et dédoublonne les destinataires.
                    var recips = (spec.recipients || []).filter(function(n) {
                        if (!n || n === me || seen[n]) return false;
                        seen[n] = true;
                        return true;
                    });
                    recips.forEach(function(dest) {
                        res.notifs.push({
                            id: 'notif-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                            type: spec.type,
                            destinataire: dest,
                            campagneId: name,
                            campagneTitre: name + (spec.channel ? ' · ' + spec.channel : ''),
                            message: spec.message || '',
                            auteur: me,
                            dateCreation: now,
                            lu: false
                        });
                    });
                });
                return res.fh.createWritable().then(function(w) { return w.write(JSON.stringify(res.notifs, null, 2)).then(function() { return w.close(); }); });
            })
            .catch(function(e) { console.warn('Notifications de workflow non écrites :', e); });
    }

    // Journalise automatiquement les transitions de workflow en enveloppant le module
    // (couvre affectation, kick-off et toutes les actions de canaux, sans toucher aux handlers).
    var _pendingActivity = [];
    var _pendingNotifs = [];
    (function installWorkflowActivity() {
        if (!workflow || workflow._activityWrapped) return;
        workflow._activityWrapped = true;
        var origAdv = workflow.advanceStep;
        workflow.advanceStep = function(data, stepId, status) {
            if (ACT_STATUS_LABELS[status]) _pendingActivity.push({ type: 'workflow', detail: (ACT_STEP_LABELS[stepId] || stepId) + ' — ' + ACT_STATUS_LABELS[status] });
            try { var n = buildGlobalNotif(data, stepId, status); if (n) _pendingNotifs.push(n); } catch (e) {}
            return origAdv.apply(this, arguments);
        };
        var origAdvCh = workflow.advanceChannelStep;
        workflow.advanceChannelStep = function(data, idx, stepId, status) {
            if (ACT_STATUS_LABELS[status]) _pendingActivity.push({ type: 'workflow', detail: 'Canal ' + (idx + 1) + ' · ' + (ACT_STEP_LABELS[stepId] || stepId) + ' — ' + ACT_STATUS_LABELS[status] });
            try { var n = buildChannelNotif(data, idx, stepId, status); if (n) _pendingNotifs.push(n); } catch (e) {}
            return origAdvCh.apply(this, arguments);
        };
        // validateChannelStep appelle en interne le advanceChannelStep du module
        // (pas la version enveloppée) : on la capte donc ici pour journaliser les
        // VALIDATIONS PO (maquette, BAT, ciblage, test en prod) avec date/heure.
        if (workflow.validateChannelStep) {
            var origValCh = workflow.validateChannelStep;
            workflow.validateChannelStep = function(data, poStepId, channelIdx) {
                _pendingActivity.push({ type: 'workflow', detail: 'Canal ' + (channelIdx + 1) + ' · ' + (ACT_STEP_LABELS[poStepId] || poStepId) + ' — ' + ACT_STATUS_LABELS.validated });
                try { var n = buildChannelNotif(data, channelIdx, poStepId, 'validated'); if (n) _pendingNotifs.push(n); } catch (e) {}
                return origValCh.apply(this, arguments);
            };
        }
        // La demande de révision passe par requestChannelRevision (pas advanceChannelStep) :
        // on la capte ici pour notifier l'équipe concernée.
        if (workflow.requestChannelRevision) {
            var origRev = workflow.requestChannelRevision;
            workflow.requestChannelRevision = function(data, poStepId, sourceStepId, channelIdx, comment) {
                try { var n = buildChannelNotif(data, channelIdx, sourceStepId, 'revision_requested'); if (n) _pendingNotifs.push(n); } catch (e) {}
                return origRev.apply(this, arguments);
            };
        }
        // Retour à une étape antérieure : journalise l'action (avec l'acteur réel
        // via logActivity) et notifie l'acteur de l'étape rouverte.
        if (workflow.reopenChannelStep) {
            var origReopen = workflow.reopenChannelStep;
            workflow.reopenChannelStep = function(data, channelIdx, targetStepId, reason) {
                _pendingActivity.push({ type: 'workflow', detail: 'Canal ' + (channelIdx + 1) + ' · Retour à l\'étape « ' + (ACT_STEP_LABELS[targetStepId] || targetStepId) + ' » demandé' });
                try { var n = buildChannelNotif(data, channelIdx, targetStepId, 'revision_requested'); if (n) _pendingNotifs.push(n); } catch (e) {}
                return origReopen.apply(this, arguments);
            };
        }
        var origSave = workflow.saveCampaignWorkflow;
        workflow.saveCampaignWorkflow = function(root, name, data) {
            var p = origSave.apply(this, arguments);
            if (_pendingActivity.length) {
                var buf = _pendingActivity.splice(0);
                p.then(function() { buf.forEach(function(a) { logActivity(name, a.type, a.detail); }); });
            }
            if (_pendingNotifs.length) {
                var nbuf = _pendingNotifs.splice(0);
                p.then(function() { flushWorkflowNotifs(root, name, nbuf); });
            }
            return p;
        };
    })();

    // ── Bilan des campagnes : remontée du suivi hebdo (.xlsx) par canal ──────────
    // Le fichier « Suivi MDC-MKD_12mois_*.xlsx » le plus récent est lu dans le dossier
    // « Données/Suivi » de l'espace de travail. On relie chaque canal aux lignes du suivi
    // via codeAction (dépôt Data = ID_ACTION) et codeCom (dépôt EBF = code_communication).
    // Mapping du fichier de suivi (.xlsx) — piloté par _config.json (clé bilan),
    // avec repli sur les valeurs actuelles si la config n'est pas encore chargée.
    var _BILAN_CFG = (window.ImpulsionMarketing.config.BILAN && Object.keys(window.ImpulsionMarketing.config.BILAN).length) ? window.ImpulsionMarketing.config.BILAN : {};
    var SUIVI_FOLDER = _BILAN_CFG.suiviFolder || 'Suivi';
    var SUIVI_SHEET = _BILAN_CFG.suiviSheet || 'détail-tous';
    var _suiviIndex = null;
    var _bilanResults = null;   // résultats par canal (cache pour graphiques / comparaison)
    var _bilanState = null;     // { campaignName, channels, results, idx }
    var _bilanCompareSeries = null; // série de comparaison (autre campagne)
    var BILAN_IDENT = _BILAN_CFG.ident || ['Canal', 'ID_ACTION', 'code_communication', 'CAMPAGNE', 'ACTION'];
    // Chaque KPI porte désormais aussi son mode d'agrégation ('somme' ou 'moyenne',
    // piloté par _config.json bilan.kpis[].agg, éditable en Administration ▸ Bilan) —
    // utilisé par bilanAggregate() ci-dessous pour combiner les lignes d'un même canal.
    var BILAN_KPIS = _BILAN_CFG.kpis || [
        { k: 'Nb_Envois', label: 'Envois', pct: false, agg: 'moyenne' },
        { k: 'Nb_communications', label: 'Comm.', pct: false, agg: 'somme' },
        { k: 'Nb_MDC_Actifs', label: 'MDC actifs', pct: false, agg: 'moyenne' },
        { k: 'Tx_Ouvreurs', label: 'Tx ouv.', pct: true, agg: 'moyenne' },
        { k: 'Tx_Cliqueurs', label: 'Tx clic', pct: true, agg: 'moyenne' },
        { k: 'Tx_Desabonnement', label: 'Tx désab.', pct: true, agg: 'moyenne' },
        { k: 'Tx_Reussite', label: 'Tx réussite', pct: true, agg: 'moyenne' },
        { k: 'Nb_leads', label: 'Leads', pct: false, agg: 'somme' }
    ];
    // Indicateurs tracés en graphiques.
    var BILAN_CHART_RATES = _BILAN_CFG.chartRates || ['Tx_Ouvreurs', 'Tx_Cliqueurs', 'Tx_Desabonnement', 'Tx_Reussite'];

    function bilanClean(v) { v = (v == null ? '' : String(v)).trim(); return (v === '.' || v === '') ? '' : v; }
    // Un canal peut porter plusieurs codes saisis « A / B / C » (ou , ; retour-ligne).
    function splitCodes(s) { return bilanClean(s).split(/[\/,;\n]+/).map(function (x) { return x.trim(); }).filter(Boolean); }
    function bilanNum(v) { v = bilanClean(v); if (v === '') return '—'; var n = Number(v.replace(',', '.')); return isNaN(n) ? v : n.toLocaleString('fr-FR'); }
    function bilanPct(v) { v = bilanClean(v); if (v === '') return '—'; var n = Number(v.replace(',', '.')); return isNaN(n) ? v : (Math.round(n * 10) / 10).toLocaleString('fr-FR') + ' %'; }
    function bilanToNumber(v) { v = bilanClean(v); if (v === '') return null; var n = Number(v.replace(',', '.')); return isNaN(n) ? null : n; }
    function bilanDateShort(iso) { try { return new Date(iso).toLocaleDateString('fr-FR'); } catch (e) { return ''; } }

    function collectSuiviXlsx(dir) {
        var files = [];
        return new Promise(function(resolve) {
            var it = dir.values();
            function next() {
                it.next().then(function(r) {
                    if (r.done) { resolve(files); return; }
                    var e = r.value;
                    if (e.kind === 'file' && /\.xlsx$/i.test(e.name) && /suivi/i.test(e.name)) files.push(e);
                    next();
                }).catch(function() { resolve(files); });
            }
            next();
        });
    }

    function buildSuiviIndex(rows, label) {
        var header = rows[2] || [];
        var col = {}; header.forEach(function(h, i) { col[String(h).trim()] = i; });
        var byAction = {}, byComm = {};
        rows.slice(3).forEach(function(r) {
            if (!r) return;
            var a = bilanClean(r[col['ID_ACTION']]);
            var c = bilanClean(r[col['code_communication']]);
            if (a) { (byAction[a] = byAction[a] || []).push(r); }
            if (c) { (byComm[c] = byComm[c] || []).push(r); }
        });
        var m = /(\d{4}-\d{2}-\d{2})/.exec(label || '');
        return { byAction: byAction, byComm: byComm, label: (m ? m[1] : label), col: col };
    }

    function loadSuiviFile() {
        if (_suiviIndex) return Promise.resolve(_suiviIndex);
        var sx = window.ImpulsionMarketing && window.ImpulsionMarketing.suiviXlsx;
        if (!currentRootHandle || !sx) return Promise.resolve(null);
        return currentRootHandle.getDirectoryHandle('Données')
            .then(function(d) { return d.getDirectoryHandle(SUIVI_FOLDER); })
            .then(function(dir) {
                return collectSuiviXlsx(dir).then(function(files) {
                    if (!files.length) return null;
                    files.sort(function(a, b) { return a.name < b.name ? 1 : -1; }); // plus récent (date dans le nom) d'abord
                    var best = files[0];
                    return best.getFile()
                        .then(function(f) { return f.arrayBuffer(); })
                        .then(function(ab) { return sx.readSheetRows(ab, SUIVI_SHEET); })
                        .then(function(rows) { _suiviIndex = buildSuiviIndex(rows, best.name); return _suiviIndex; });
                });
            })
            .catch(function() { return null; });
    }

    function readChannelCodes(campaignName, idx) {
        var folder = getChannelFolder(idx);
        return Promise.all([
            readDepotFile(campaignName, folder, 'depotdata.json').catch(function() { return null; }),
            readDepotFile(campaignName, folder, 'depotebf.json').catch(function() { return null; })
        ]).then(function(res) {
            var d = res[0] || {}, e = res[1] || {};
            // Plusieurs codes possibles par canal (saisis « A / B / C »).
            return { codeActions: splitCodes(d.codeAction), codeComs: splitCodes(e.codeCom) };
        });
    }

    function matchSuiviRows(idx, codes) {
        var set = [];
        function add(r) { if (set.indexOf(r) === -1) set.push(r); }
        codes.codeActions.forEach(function(a) { (idx.byAction[a] || []).forEach(add); });
        codes.codeComs.forEach(function(c) { (idx.byComm[c] || []).forEach(add); });
        return set;
    }

    // Normalise une ligne du suivi en objet {colonne: valeur} (robuste aux réordonnancements
    // de colonnes, et stockable tel quel dans l'archive bilan.json).
    function normalizeRow(row, col) {
        var o = {};
        BILAN_IDENT.forEach(function (k) { o[k] = (col[k] != null) ? bilanClean(row[col[k]]) : ''; });
        BILAN_KPIS.forEach(function (kp) { o[kp.k] = (col[kp.k] != null) ? bilanClean(row[col[kp.k]]) : ''; });
        return o;
    }

    function readBilanSnapshot(campaignName) {
        return currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function (d) { return d.getDirectoryHandle(campaignName); })
            .then(function (d) { return d.getFileHandle('bilan.json'); })
            .then(function (fh) { return fh.getFile(); }).then(function (f) { return f.text(); })
            .then(function (t) { var o = JSON.parse(t); return (o && o.channels) ? o : { channels: {} }; })
            .catch(function () { return { channels: {} }; });
    }
    function writeBilanSnapshot(campaignName, snap) {
        return currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function (d) { return d.getDirectoryHandle(campaignName); })
            .then(function (d) { return d.getFileHandle('bilan.json', { create: true }); })
            .then(function (fh) { return fh.createWritable(); })
            .then(function (w) { return w.write(JSON.stringify(snap, null, 2)).then(function () { return w.close(); }); })
            .catch(function (e) { console.warn('writeBilanSnapshot:', e && e.message); });
    }

    function renderBilanPage() {
        var h = '<div class="detail-section">';
        h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">';
        h += '<h3 style="margin:0;">📊 Bilan par canal</h3>';
        h += '<span id="bilan-file" style="font-size:12px;color:var(--muted-2,#8b988f);"></span></div>';
        h += '<div id="bilan-loading" style="color:var(--muted-2);font-size:13px;margin-top:10px;">Chargement…</div>';
        h += '<div id="bilan-content" style="display:none;margin-top:10px;"></div>';
        h += '</div>';
        return h;
    }

    function loadBilanPage(campaignName) {
        var loading = document.getElementById('bilan-loading'), content = document.getElementById('bilan-content');
        if (!loading || !content) return;
        var channels = currentCampaignData.channels || [];
        Promise.all([loadSuiviFile(), readBilanSnapshot(campaignName)]).then(function (r) {
            var idx = r[0], snap = r[1] || { channels: {} };
            Promise.all(channels.map(function (ch, i) { return readChannelCodes(campaignName, i); }))
                .then(function (codesList) {
                    var results = [], snapChanged = false;
                    channels.forEach(function (ch, i) {
                        var codes = codesList[i];
                        var liveRows = idx ? matchSuiviRows(idx, codes).map(function (row) { return normalizeRow(row, idx.col); }) : [];
                        var key = String(i);
                        if (liveRows.length) {
                            results.push({ source: 'live', label: idx.label, rows: liveRows, codes: codes });
                            snap.channels[key] = { fileLabel: idx.label, savedAt: new Date().toISOString(), codeActions: codes.codeActions, codeComs: codes.codeComs, rows: liveRows };
                            snapChanged = true;
                        } else if (snap.channels[key] && snap.channels[key].rows && snap.channels[key].rows.length) {
                            var s = snap.channels[key];
                            results.push({ source: 'archive', label: s.fileLabel, savedAt: s.savedAt, rows: s.rows, codes: codes });
                        } else {
                            results.push({ source: 'none', rows: [], codes: codes });
                        }
                    });
                    if (snapChanged) writeBilanSnapshot(campaignName, snap);
                    _bilanResults = results;
                    _bilanState = { campaignName: campaignName, channels: channels, results: results, idx: idx };
                    _bilanCompareSeries = null;
                    loading.style.display = 'none'; content.style.display = 'block';
                    renderBilanContent(channels, results, idx);
                });
        });
    }

    function bilanTable(rows) {
        var html = '<div class="bilan-detail" style="overflow-x:auto;"><table><thead><tr><th>Canal (suivi)</th>';
        BILAN_KPIS.forEach(function (kp) { html += '<th>' + kp.label + '</th>'; });
        html += '</tr></thead><tbody>';
        rows.forEach(function (o) {
            var canal = String(o.Canal || '').replace(/\s+/g, ' ').trim();
            html += '<tr><td>' + security.escapeHtml(canal) + '</td>';
            BILAN_KPIS.forEach(function (kp) { var v = kp.pct ? bilanPct(o[kp.k]) : bilanNum(o[kp.k]); html += '<td>' + security.escapeHtml(v) + '</td>'; });
            html += '</tr>';
        });
        html += '</tbody></table></div>';
        return html;
    }

    function tnum(n) { return (n == null) ? '—' : Math.round(n).toLocaleString('fr-FR'); }
    function tpct(n) { return (n == null) ? '—' : (Math.round(n * 10) / 10).toLocaleString('fr-FR') + ' %'; }
    function bilanTile(lbl, val, cls) {
        return '<div class="bilan-tile ' + cls + '"><div class="lbl">' + lbl + '</div><div class="val">' + security.escapeHtml(val) + '</div></div>';
    }
    function bilanTiles(agg) {
        // Principaux : envois + taux clés (on masque un taux absent).
        var prim = [bilanTile('Envois', tnum(agg.Nb_Envois), 'primary')];
        if (agg.Tx_Ouvreurs != null) prim.push(bilanTile('Tx ouverture', tpct(agg.Tx_Ouvreurs), 'primary accent'));
        if (agg.Tx_Cliqueurs != null) prim.push(bilanTile('Tx clic', tpct(agg.Tx_Cliqueurs), 'primary accent'));
        if (agg.Tx_Reussite != null) prim.push(bilanTile('Tx réussite', tpct(agg.Tx_Reussite), 'primary accent'));
        // Secondaires : on masque les valeurs vides, et les zéros peu informatifs.
        var sec = [];
        if (agg.Nb_communications != null) sec.push(bilanTile('Comm.', tnum(agg.Nb_communications), 'sec'));
        if (agg.Nb_MDC_Actifs != null && agg.Nb_MDC_Actifs !== 0) sec.push(bilanTile('MDC actifs', tnum(agg.Nb_MDC_Actifs), 'sec'));
        if (agg.Tx_Desabonnement != null) sec.push(bilanTile('Tx désab.', tpct(agg.Tx_Desabonnement), 'sec'));
        if (agg.Nb_leads != null && agg.Nb_leads !== 0) sec.push(bilanTile('Leads', tnum(agg.Nb_leads), 'sec'));
        var h = '<div class="bilan-tiles primary">' + prim.join('') + '</div>';
        if (sec.length) h += '<div class="bilan-tiles sec">' + sec.join('') + '</div>';
        return h;
    }

    var BILAN_COLORS = ['#00875A', '#2563EB', '#E8A100', '#7C3AED', '#E2001A', '#0891b2', '#65a30d', '#db2777'];

    // Agrège les lignes d'un canal : pour chaque KPI de BILAN_KPIS (piloté par
    // _config.json / Administration ▸ Bilan), on additionne ('somme') ou on fait une
    // moyenne simple ('moyenne' — valeur par défaut si non précisé) selon kp.agg.
    function bilanAggregate(rows) {
        var agg = {};
        BILAN_KPIS.forEach(function (kp) {
            var k = kp.k;
            if (kp.agg === 'somme') {
                var s = 0, any = false;
                rows.forEach(function (o) { var n = bilanToNumber(o[k]); if (n != null) { s += n; any = true; } });
                agg[k] = any ? s : null;
            } else {
                var s2 = 0, c = 0;
                rows.forEach(function (o) { var n = bilanToNumber(o[k]); if (n != null) { s2 += n; c++; } });
                agg[k] = c > 0 ? (s2 / c) : null;
            }
        });
        return agg;
    }

    function buildBilanSeries(channels, results) {
        var series = [];
        channels.forEach(function (ch, i) {
            var res = results[i];
            if (res && res.rows && res.rows.length) {
                series.push({ name: ch.deliverableName || ('Canal ' + (i + 1)), color: BILAN_COLORS[i % BILAN_COLORS.length], agg: bilanAggregate(res.rows) });
            }
        });
        return series;
    }

    // Graphe en barres groupées (SVG autonome). groups: libellés X ; series: [{name,color,values[]}].
    function svgGroupedBars(groups, series, opts) {
        opts = opts || {};
        var unit = opts.unit || '';
        var W = 460, H = opts.height || 170;
        var padL = 30, padR = 8, padT = 12, padB = 32;
        var plotW = W - padL - padR, plotH = H - padT - padB;
        var maxV = 0;
        series.forEach(function (s) { s.values.forEach(function (v) { if (v != null && v > maxV) maxV = v; }); });
        if (maxV <= 0) maxV = 1;
        var esc = security.escapeHtml;
        var g = groups.length || 1, n = series.length || 1;
        var groupW = plotW / g, barGap = 3;
        var barW = Math.max(5, Math.min(46, (groupW * 0.72) / n));
        var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;font-family:inherit;">';
        [0, 0.5, 1].forEach(function (t) {
            var y = padT + plotH - t * plotH;
            svg += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="#eaefec"/>';
            svg += '<text x="' + (padL - 4) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end" font-size="9" fill="#8b988f">' + (Math.round(maxV * t * 10) / 10) + '</text>';
        });
        groups.forEach(function (gl, gi) {
            var gx = padL + gi * groupW;
            var clusterW = n * barW + (n - 1) * barGap;
            var startX = gx + (groupW - clusterW) / 2;
            series.forEach(function (s, si) {
                var v = s.values[gi];
                var x = startX + si * (barW + barGap);
                if (v != null) {
                    var hh = (v / maxV) * plotH, y = padT + plotH - hh;
                    svg += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(0, hh).toFixed(1) + '" rx="2" fill="' + s.color + '"><title>' + esc(s.name + ' — ' + gl + ' : ' + (Math.round(v * 10) / 10) + unit) + '</title></rect>';
                    if (barW >= 16) svg += '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (y - 3).toFixed(1) + '" text-anchor="middle" font-size="9" fill="#33403a">' + (Math.round(v * 10) / 10) + '</text>';
                }
            });
            svg += '<text x="' + (gx + groupW / 2).toFixed(1) + '" y="' + (padT + plotH + 14) + '" text-anchor="middle" font-size="10" fill="#33403a">' + esc(gl) + '</text>';
        });
        svg += '</svg>';
        var legend = '<div style="display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 2px;">';
        series.forEach(function (s) { legend += '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#33403a;"><span style="width:10px;height:10px;border-radius:2px;background:' + s.color + ';display:inline-block;"></span>' + esc(s.name) + '</span>'; });
        legend += '</div>';
        return legend + svg;
    }

    // Un graphe de taux pour un sous-ensemble d'indicateurs (échelle propre), si données.
    function bilanRateChart(all, keys, labels, title) {
        var groups = keys.map(function (k) { return labels[k]; });
        var ser = all.map(function (s) { return { name: s.name, color: s.color, values: keys.map(function (k) { return s.agg[k]; }) }; });
        var has = ser.some(function (s) { return s.values.some(function (v) { return v != null; }); });
        if (!has) return '';
        return '<div class="bilan-chart-card"><h5>' + title + '</h5>' + svgGroupedBars(groups, ser, { unit: '%' }) + '</div>';
    }

    // Bloc graphiques : on sépare les gros taux (ouverture/réussite) des petits (clic/désab)
    // pour des échelles lisibles, + leads si renseignés. `extra` = série de comparaison.
    function renderBilanCharts(series, extra) {
        var all = series.slice(); if (extra) all.push(extra);
        if (!all.length) return '';
        var L = { Tx_Ouvreurs: 'Ouverture', Tx_Reussite: 'Réussite', Tx_Cliqueurs: 'Clic', Tx_Desabonnement: 'Désab.' };
        var cards = '';
        cards += bilanRateChart(all, ['Tx_Ouvreurs', 'Tx_Reussite'], L, 'Ouverture & réussite (%)');
        cards += bilanRateChart(all, ['Tx_Cliqueurs', 'Tx_Desabonnement'], L, 'Clic & désabonnement (%)');
        var hasLeads = all.some(function (s) { return s.agg.Nb_leads != null && s.agg.Nb_leads !== 0; });
        if (hasLeads) {
            cards += '<div class="bilan-chart-card"><h5>Leads</h5>'
                + svgGroupedBars(all.map(function (s) { return s.name; }), [{ name: 'Leads', color: '#7C3AED', values: all.map(function (s) { return s.agg.Nb_leads; }) }], { unit: '' })
                + '</div>';
        }
        if (!cards) return '<div style="font-size:12px;color:var(--muted-2);">Pas encore de données chiffrées à représenter' + (extra ? '' : ' (choisissez une comparaison ci-dessus)') + '.</div>';
        return '<div class="bilan-charts-grid">' + cards + '</div>';
    }

    // ── Comparaison avec une communication d'une autre campagne ──
    function listCampaignsForCompare() {
        return currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function (d) { return d.getFileHandle('_index.json'); })
            .then(function (fh) { return fh.getFile(); }).then(function (f) { return f.text(); })
            .then(function (t) { var idx = JSON.parse(t); return Object.keys(idx.campaigns || {}); })
            .catch(function () { return []; });
    }
    function loadCampaignChannels(name) {
        return currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function (d) { return d.getDirectoryHandle(name); })
            .then(function (d) { return d.getFileHandle('campagne.json'); })
            .then(function (fh) { return fh.getFile(); }).then(function (f) { return f.text(); })
            .then(function (t) { var data = JSON.parse(t); return data.channels || []; })
            .catch(function () { return []; });
    }
    // Lignes (normalisées) d'un canal de campagne quelconque : live depuis le fichier,
    // sinon repli sur l'archive bilan.json de cette campagne.
    function resolveChannelRows(campName, ch, chIdx) {
        var folder = sanitizeName(ch.deliverableName || ('canal_' + chIdx));
        return Promise.all([
            readDepotFile(campName, folder, 'depotdata.json').catch(function () { return null; }),
            readDepotFile(campName, folder, 'depotebf.json').catch(function () { return null; })
        ]).then(function (res) {
            var codes = { codeActions: splitCodes((res[0] || {}).codeAction), codeComs: splitCodes((res[1] || {}).codeCom) };
            var liveRows = _suiviIndex ? matchSuiviRows(_suiviIndex, codes).map(function (row) { return normalizeRow(row, _suiviIndex.col); }) : [];
            if (liveRows.length) return liveRows;
            return readBilanSnapshot(campName).then(function (snap) { var s = snap.channels[String(chIdx)]; return (s && s.rows) ? s.rows : []; });
        });
    }
    function resolveExternalChannelBilan(campName, chIdx) {
        return loadCampaignChannels(campName).then(function (channels) {
            var ch = channels[chIdx]; if (!ch) return null;
            return resolveChannelRows(campName, ch, chIdx).then(function (rows) {
                if (!rows.length) return null;
                return { name: campName + ' · ' + (ch.deliverableName || ('Canal ' + (chIdx + 1))), color: '#111827', agg: bilanAggregate(rows), rows: rows };
            });
        });
    }

    function refreshBilanCharts() {
        var el = document.getElementById('bilan-charts');
        if (!el || !_bilanState) return;
        var series = buildBilanSeries(_bilanState.channels, _bilanState.results);
        el.innerHTML = series.length ? renderBilanCharts(series, _bilanCompareSeries) : '<div style="font-size:12px;color:var(--muted-2);">Aucune donnée chiffrée à représenter.</div>';

    function setupBilanCompare() {

    // ── Documents (Item 21) ─────────────────────────────────
    function loadDocuments(campaignName) {
        var loadingEl = document.getElementById('documents-loading');
        var contentEl = document.getElementById('documents-content');
        if (!loadingEl || !contentEl) return;
        currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(campDir) {
                return campDir.getDirectoryHandle('documents', { create: false })
                    .then(function(docsDir) { return readDocTree(docsDir); })
                    .catch(function() { return null; })
                    .then(function(tree) { renderDocuments(campDir, tree, campaignName); });
            })
            .catch(function() { renderDocuments(null, null, campaignName); });
    }

    function readDocTree(docsDir) {
        var result = { folders: [], files: [] };
        var promises = [];
        return new Promise(function(resolve) {
            var entries = [];
            function next(it) {
                it.next().then(function(r) {
                    if (r.done) {
                        Promise.all(promises).then(function() { resolve(result); });
                        return;
                    }
                    var entry = r.value;
                    if (entry.kind === 'file') {
                        result.files.push(entry.name);
                    } else if (entry.kind === 'directory') {
                        var folder = { name: entry.name, files: [] };
                        result.folders.push(folder);
                        promises.push(new Promise(function(res) {
                            var subFiles = [];
                            function nextSub(sit) {
                                sit.next().then(function(sr) {
                                    if (sr.done) { folder.files = subFiles; res(); return; }
                                    if (sr.value.kind === 'file') subFiles.push(sr.value.name);
                                    nextSub(sit);
                                }).catch(function() { folder.files = subFiles; res(); });
                            }
                            nextSub(entry.values());
                        }));
                    }
                    next(it);
                }).catch(function() { resolve(result); });
            }
            next(docsDir.values());
        });
    }

    function renderDocuments(campDir, tree, campaignName) {
        var loadingEl = document.getElementById('documents-loading');
        var contentEl = document.getElementById('documents-content');
        if (!loadingEl || !contentEl) return;
        loadingEl.style.display = 'none';
        contentEl.style.display = 'block';

        var html = '';
        var isEmpty = !tree || (tree.folders.length === 0 && tree.files.length === 0);

        // Rendu d'un fichier cliquable (ouverture dans un nouvel onglet).
        function fileLine(name, folderName, indent) {
            return '<a href="#" class="doc-file-link" data-folder="' + (folderName ? security.escapeHtml(folderName) : '')
                + '" data-name="' + security.escapeHtml(name) + '" title="Ouvrir"'
                + ' style="display:flex;align-items:center;gap:8px;padding:' + (indent ? '2px 0 2px 16px' : '4px 0')
                + ';font-size:' + (indent ? '12px' : '13px') + ';color:var(--primary);text-decoration:none;">📄 '
                + security.escapeHtml(name) + '</a>';
        }

        if (isEmpty) {
            html += '<p style="color:var(--muted-2);font-size:13px;margin:0 0 12px;">Aucun document pour l\'instant.</p>';
        } else {
            // Fichiers à la racine de documents/
            if (tree.files.length > 0) {
                html += '<div style="margin-bottom:10px;">';
                tree.files.forEach(function(f) { html += fileLine(f, null, false); });
                html += '</div>';
            }
            // Sous-dossiers
            tree.folders.forEach(function(folder) {
                html += '<div class="doc-folder-card" data-folder="' + security.escapeHtml(folder.name) + '" style="background:var(--line-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;">';
                html += '<div style="font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;">📂 ' + security.escapeHtml(folder.name) + ' <span style="font-weight:400;color:var(--muted-2);font-size:12px;">(' + folder.files.length + ' fichier' + (folder.files.length !== 1 ? 's' : '') + ')</span></div>';
                folder.files.forEach(function(f) { html += fileLine(f, folder.name, true); });
                // Bouton upload dans ce dossier
                html += '<label style="margin-top:6px;display:inline-flex;align-items:center;gap:6px;background:#e0f2fe;color:#0369a1;border:1px solid #7dd3fc;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;">📎 Ajouter un fichier<input type="file" style="display:none;" data-folder="' + security.escapeHtml(folder.name) + '" class="doc-file-input" multiple></label>';
                html += '</div>';
            });
        }

        // Actions globales : créer un dossier et ajouter des fichiers à la racine
        // (toujours disponibles, même quand l'espace est vide).
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">';
        html += '<button id="btn-new-doc-folder" style="background:var(--line-2);color:var(--gray-700);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;">📁 Nouveau dossier</button>';
        html += '<label style="background:var(--line-2);color:var(--gray-700);border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;">📎 Ajouter des fichiers<input type="file" id="doc-root-file-input" style="display:none;" multiple></label>';
        html += '</div>';

        // Zone de glisser-déposer (racine). On peut aussi déposer directement sur un dossier.
        html += '<div id="doc-dropzone" style="margin-top:10px;border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--muted-2);font-size:13px;transition:background .15s,border-color .15s;">⬇️ Glissez-déposez des fichiers ici (PDF, image, Excel…)<br><span style="font-size:11px;">déposez sur un dossier ci-dessus pour l\'y ranger</span></div>';
        contentEl.innerHTML = html;

        // Glisser-déposer : zone racine + chaque dossier comme cible.
        function setupDrop(el, folderName) {
            if (!el || !campDir) return;
            el.addEventListener('dragover', function(e) { e.preventDefault(); el.style.borderColor = 'var(--primary)'; el.style.background = '#eff6ff'; });
            el.addEventListener('dragleave', function() { el.style.borderColor = ''; el.style.background = ''; });
            el.addEventListener('drop', function(e) {
                e.preventDefault();
                el.style.borderColor = ''; el.style.background = '';
                var files = (e.dataTransfer && e.dataTransfer.files) ? Array.prototype.slice.call(e.dataTransfer.files) : [];
                if (files.length) uploadFiles(campDir, campaignName, files, folderName);
            });
        }
        setupDrop(document.getElementById('doc-dropzone'), null);
        contentEl.querySelectorAll('.doc-folder-card').forEach(function(card) {
            setupDrop(card, card.getAttribute('data-folder'));
        });

        // Event : ouvrir un fichier
        contentEl.querySelectorAll('.doc-file-link').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                openDocFile(campaignName, link.getAttribute('data-folder') || null, link.getAttribute('data-name'));
            });
        });

        // Event : nouveau dossier
        var btnNewFolder = document.getElementById('btn-new-doc-folder');
        if (btnNewFolder && campDir) {
            btnNewFolder.addEventListener('click', function() {
                showPromptModal({
                    title: 'Nouveau dossier',
                    label: 'Nom du dossier à créer dans cette campagne :',
                    placeholder: 'Ex : Maquettes',
                    confirmText: 'Créer',
                    onConfirm: function(folderName) {
                        var safe = folderName.replace(/[<>:"|?*\\/]/g, '_');
                        campDir.getDirectoryHandle('documents', { create: true })
                            .then(function(docsDir) { return docsDir.getDirectoryHandle(safe, { create: true }); })
                            .then(function() { notify('Dossier « ' + safe + ' » créé.', 'success'); logActivity(campaignName, 'document', 'Dossier créé : ' + safe); loadDocuments(campaignName); })
                            .catch(function(e) { notify('Erreur : ' + errors.getErrorMessage(e), 'error'); });
                    }
                });
            });
        }

        // Event : upload fichiers dans un sous-dossier
        contentEl.querySelectorAll('.doc-file-input').forEach(function(input) {
            input.addEventListener('change', function() {
                var subFolder = input.getAttribute('data-folder');
                uploadFiles(campDir, campaignName, Array.from(input.files), subFolder);
                input.value = '';
            });
        });

        // Event : upload à la racine
        var rootInput = document.getElementById('doc-root-file-input');
        if (rootInput && campDir) {
            rootInput.addEventListener('change', function() {
                uploadFiles(campDir, campaignName, Array.from(rootInput.files), null);
                rootInput.value = '';
            });
        }
    }

    function uploadFiles(campDir, campaignName, files, subFolderName) {
        if (!files || files.length === 0) return;
        var n = files.length;
        var label = n + ' fichier' + (n > 1 ? 's' : '');
        var dest = subFolderName ? ' dans « ' + subFolderName + ' »' : '';

        // Retour visuel pendant l'écriture : bannière dans la zone documents.
        var contentEl = document.getElementById('documents-content');
        var banner = null;
        if (contentEl) {
            banner = document.createElement('div');
            banner.textContent = '⏳ Envoi de ' + label + dest + ' en cours…';
            banner.style.cssText = 'background:#e0f2fe;color:#0369a1;border:1px solid #7dd3fc;border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:10px;';
            contentEl.insertBefore(banner, contentEl.firstChild);
        }

        campDir.getDirectoryHandle('documents', { create: true })
            .then(function(docsDir) {
                var targetDir = subFolderName
                    ? docsDir.getDirectoryHandle(subFolderName, { create: true })
                    : Promise.resolve(docsDir);
                return targetDir.then(function(dir) {
                    return Promise.all(files.map(function(file) {
                        return dir.getFileHandle(file.name, { create: true })
                            .then(function(fh) { return fh.createWritable(); })
                            .then(function(w) { return w.write(file).then(function() { return w.close(); }); });
                    }));
                });
            })
            .then(function() {
                notify(label + dest + ' ajouté' + (n > 1 ? 's' : '') + ' ✓', 'success');
                logActivity(campaignName, 'document', label + ' déposé' + (n > 1 ? 's' : '') + dest);
                loadDocuments(campaignName); // re-render (retire la bannière)
            })
            .catch(function(e) {
                if (banner) banner.remove();
                notify('Erreur upload : ' + errors.getErrorMessage(e), 'error');
            });
    }

    // Type MIME déduit de l'extension : les fichiers lus via File System Access
    // ont souvent un type vide, ce qui empêche le navigateur de lire vidéos,
    // audios, PDF… On le reconstitue pour pouvoir les ouvrir/jouer correctement.
    function _mimeFromName(name) {
        var ext = (String(name).split('.').pop() || '').toLowerCase();
        var map = {
            mp4: 'video/mp4', webm: 'video/webm', mov: 'video/quicktime', m4v: 'video/mp4',
            mp3: 'audio/mpeg', wav: 'audio/wav', m4a: 'audio/mp4', ogg: 'audio/ogg', aac: 'audio/aac',
            xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', xls: 'application/vnd.ms-excel', csv: 'text/csv',
            doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
            ppt: 'application/vnd.ms-powerpoint', pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
            pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml',
            html: 'text/html', htm: 'text/html', txt: 'text/plain', zip: 'application/zip'
        };
        return map[ext] || '';
    }
    function openDocFile(campaignName, subFolderName, fileName) {
        currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(d) { return d.getDirectoryHandle('documents'); })
            .then(function(docsDir) {
                return subFolderName ? docsDir.getDirectoryHandle(subFolderName) : docsDir;
            })
            .then(function(dir) { return dir.getFileHandle(fileName); })
            .then(function(fh) { return fh.getFile(); })
            .then(function(file) {
                var mime = file.type || _mimeFromName(fileName);
                var blob = mime ? new Blob([file], { type: mime }) : file;
                var url = URL.createObjectURL(blob);
                // Vidéo / audio / image / PDF / texte / HTML → lecture dans un onglet.
                // Excel / Word / PowerPoint / zip → téléchargement (non affichables
                // par le navigateur), pour ouverture dans l'application dédiée.
                var previewable = /^(video|audio|image)\//.test(mime) || mime === 'application/pdf' || mime === 'text/plain' || mime === 'text/html' || mime === 'image/svg+xml';
                if (previewable) {
                    window.open(url, '_blank');
                } else {
                    var a = document.createElement('a');
                    a.href = url; a.download = fileName;
                    document.body.appendChild(a); a.click(); a.remove();
                }
                setTimeout(function() { URL.revokeObjectURL(url); }, 60000);
            })
            .catch(function(e) { notify('Impossible d\'ouvrir le fichier : ' + errors.getErrorMessage(e), 'error'); });
    }

    // ── Discussion ──────────────────────────────────────────
    function loadDiscussion(campaignName) {
        currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(d) { return d.getFileHandle('discussion.json'); })
            .then(function(fh) { return fh.getFile(); })
            .then(function(f) { return f.text(); })
            .then(function(t) { renderDiscussionMessages(JSON.parse(t).messages || []); })
            .catch(function() { renderDiscussionMessages([]); });
    }

    // Fusion par id : le dossier est partagé, deux personnes peuvent commenter
    // en parallèle. On réunit les messages locaux et ceux du disque (clé = id)
    // pour ne perdre aucun commentaire. Les « likes » sont fusionnés par union.
    function mergeDiscussion(localMsgs, diskMsgs) {
        var byId = {}, order = [];
        function add(m) {
            if (!m) return;
            var key = (m.id != null) ? m.id : ('_noid_' + order.length);
            if (byId[key]) {
                var likes = (byId[key].likes || []).slice();
                (m.likes || []).forEach(function(n) { if (likes.indexOf(n) < 0) likes.push(n); });
                byId[key].likes = likes;
            } else {
                byId[key] = JSON.parse(JSON.stringify(m));
                order.push(key);
            }
        }
        (diskMsgs || []).forEach(add);
        (localMsgs || []).forEach(add);
        var merged = order.map(function(k) { return byId[k]; });
        merged.sort(function(a, b) { return (a.id || 0) - (b.id || 0); }); // ordre chronologique (id = Date.now)
        return merged;
    }

    // Renvoie la liste fusionnée effectivement écrite (à ré-afficher par l'appelant).
    function saveDiscussion(campaignName, messages) {
        var dirRef;
        return currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(d) { return d.getDirectoryHandle(campaignName); })
            .then(function(d) { dirRef = d; return d.getFileHandle('discussion.json', { create: true }); })
            .then(function(fh) {
                // Relit la version disque pour fusion concurrente (non bloquant)
                return fh.getFile().then(function(f) { return f.text(); })
                    .then(function(t) { try { return JSON.parse(t).messages || []; } catch (e) { return []; } })
                    .catch(function() { return []; });
            })
            .then(function(diskMsgs) {
                var merged = mergeDiscussion(messages, diskMsgs);
                return dirRef.getFileHandle('discussion.json', { create: true })
                    .then(function(fh) { return fh.createWritable(); })
                    .then(function(w) {
                        return w.write(JSON.stringify({ messages: merged }, null, 2)).then(function() { return w.close(); });
                    })
                    .then(function() { return merged; });
            });
    }

    // Consulter une campagne marque comme lues mes notifications « mention »
    // qui la concernent (le compteur de la cloche ne restait pas bloqué).
    function markCampaignMentionsRead(campaignName) {
        var me = (users && users.getCurrentUser()) ? users.getCurrentUser().name : null;
        if (!me || !currentRootHandle) return;
        var fhRef;
        currentRootHandle.getFileHandle('_notifications.json', { create: false })
            .then(function(fh) { fhRef = fh; return fh.getFile(); })
            .then(function(f) { return f.text(); })
            .then(function(t) {
                var arr; try { arr = JSON.parse(t); } catch (e) { arr = []; }
                if (!Array.isArray(arr)) return;
                var changed = false;
                arr.forEach(function(n) {
                    if (!n.lu && n.destinataire === me && n.type === 'mention' && n.campagneId === campaignName) {
                        n.lu = true; changed = true;
                    }
                });
                if (!changed) return;
                return fhRef.createWritable().then(function(w) {
                    return w.write(JSON.stringify(arr, null, 2)).then(function() { return w.close(); });
                });
            })
            .catch(function() { /* pas de fichier notifs : rien à faire */ });
    }

    // ── @mentions : notifie les personnes citées dans un message (@Nom Complet) ──
    function notifyMentions(text, campaignName, authorName) {
        var U = (users && users.USERS) ? users.USERS : [];
        var mentioned = U.filter(function(u) { return u.name !== authorName && !u.inactive && text.indexOf('@' + u.name) !== -1; })
                         .map(function(u) { return u.name; });
        if (!mentioned.length) return Promise.resolve();
        return currentRootHandle.getFileHandle('_notifications.json', { create: true })
            .then(function(fh) {
                return fh.getFile().then(function(f) { return f.text(); })
                    .then(function(t) { return { fh: fh, notifs: JSON.parse(t) }; })
                    .catch(function() { return { fh: fh, notifs: [] }; });
            })
            .then(function(res) {
                var now = new Date().toISOString();
                mentioned.forEach(function(dest) {
                    res.notifs.push({
                        id: 'notif-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                        type: 'mention', destinataire: dest,
                        campagneId: campaignName, campagneTitre: campaignName,
                        auteur: authorName, dateCreation: now, lu: false
                    });
                });
                return res.fh.createWritable().then(function(w) {
                    return w.write(JSON.stringify(res.notifs, null, 2)).then(function() { return w.close(); });
                });
            })
            .then(function() {
                notify(mentioned.length + ' personne' + (mentioned.length > 1 ? 's' : '') + ' notifiée' + (mentioned.length > 1 ? 's' : '') + ' (mention).', 'success');
            })
            .catch(function(e) { console.warn('notifyMentions:', e && e.message); });
    }

    // ── Autocomplétion @ : propose les membres quand on tape « @ » dans un message ──
    function setupMentionAutocomplete(input) {
        if (!input || input._mentionBound) return;
        input._mentionBound = true;
        var U = (users && users.USERS) ? users.USERS.filter(function(u) { return !u.inactive; }).sort(function(a, b) { return a.name.localeCompare(b.name); }) : [];
        if (input.parentNode && getComputedStyle(input.parentNode).position === 'static') input.parentNode.style.position = 'relative';

        var dd = document.createElement('div');
        dd.style.cssText = 'position:absolute;z-index:50;background:#fff;border:1px solid var(--line,#eaefec);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:200px;overflow-y:auto;display:none;min-width:220px;';
        input.parentNode.appendChild(dd);

        var anchor = -1; // position du « @ » courant

        function hide() { dd.style.display = 'none'; anchor = -1; }
        function pick(name) {
            var val = input.value, pos = input.selectionStart;
            input.value = val.slice(0, anchor) + '@' + name + ' ' + val.slice(pos);
            var caret = anchor + name.length + 2;
            input.focus(); input.setSelectionRange(caret, caret);
            hide();
        }
        function refresh() {
            var val = input.value, pos = input.selectionStart;
            var at = val.lastIndexOf('@', pos - 1);
            if (at === -1) { hide(); return; }
            var query = val.slice(at + 1, pos);
            if (/[\n@]/.test(query) || query.length > 30) { hide(); return; }
            var q = query.toLowerCase();
            var matches = U.filter(function(u) { return u.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 6);
            if (!matches.length) { hide(); return; }
            anchor = at;
            dd.innerHTML = matches.map(function(u) {
                return '<div class="mention-opt" data-name="' + security.escapeHtml(u.name) + '" style="padding:7px 12px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:10px;">'
                    + '<span>' + security.escapeHtml(u.name) + '</span>'
                    + '<span style="color:var(--muted,#8b988f);font-size:11px;">' + security.escapeHtml(u.roleLabel || u.role || '') + '</span></div>';
            }).join('');
            dd.querySelectorAll('.mention-opt').forEach(function(opt) {
                opt.addEventListener('mousedown', function(e) { e.preventDefault(); pick(opt.getAttribute('data-name')); });
                opt.addEventListener('mouseover', function() { opt.style.background = '#f1f5f9'; });
                opt.addEventListener('mouseout', function() { opt.style.background = ''; });
            });
            dd.style.left = '0px';
            dd.style.top = (input.offsetTop + input.offsetHeight + 4) + 'px';
            dd.style.display = 'block';
        }
        input.addEventListener('input', refresh);
        input.addEventListener('keyup', function(e) { if (e.key === 'Escape') hide(); else if (e.key !== 'Enter') refresh(); });
        input.addEventListener('blur', function() { setTimeout(hide, 150); });
    }

    function renderDiscussionMessages(messages) {
        var loading = document.getElementById('discussion-loading');
        var list    = document.getElementById('discussion-list');
        var form    = document.getElementById('discussion-form');
        var noUser  = document.getElementById('discussion-no-user');
        if (!list) return;

        var currentUser = users.getCurrentUser();

        if (loading) loading.style.display = 'none';

        // Rendu des messages (bulles façon Facebook : avatar + bulle, actions en
        // dessous à gauche comme un fil de commentaires — cf. maquette validée).
        if (messages.length === 0) {
            list.innerHTML = '<p style="color:var(--muted-2);font-size:13px;margin:0;">Aucun message pour l\'instant. Soyez le premier à commenter !</p>';
        } else {
            list.innerHTML = messages.map(function(msg, idx) {
                var parts    = (msg.author || '?').trim().split(/\s+/);
                var initials = parts.map(function(p) { return p[0]; }).join('').toUpperCase().slice(0, 2);
                var dt       = new Date(msg.date);
                var dateStr  = dt.toLocaleDateString('fr-FR') + ' · ' + dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                var likes    = msg.likes || [];
                var hasLiked = currentUser && likes.indexOf(currentUser.name) >= 0;
                var avatarColors = ['var(--primary)','#3b82f6','#f97316','#8b5cf6','#ec4899','#0891b2'];
                var colorIdx = (msg.author || '').split('').reduce(function(a, c) { return a + c.charCodeAt(0); }, 0) % avatarColors.length;
                return '<div class="discussion-msg">'
                    + '<div class="discussion-msg-avatar" style="background:' + avatarColors[colorIdx] + '">' + security.escapeHtml(initials) + '</div>'
                    + '<div class="discussion-msg-body">'
                    + '<div class="discussion-msg-bubble">'
                    + '<div class="discussion-msg-author">' + security.escapeHtml(msg.author || 'Anonyme') + '</div>'
                    + '<div class="discussion-msg-text">' + security.escapeHtml(msg.text) + '</div>'
                    + '</div>'
                    + '<div class="discussion-msg-footer">'
                    + '<button class="discussion-like-btn' + (hasLiked ? ' liked' : '') + '" data-idx="' + idx + '">👍 J\'aime' + (likes.length ? ' (' + likes.length + ')' : '') + '</button>'
                    + '<span class="discussion-msg-date">' + security.escapeHtml(dateStr) + '</span>'
                    + '</div>'
                    + '</div>'
                    + '</div>';
            }).join('');
        }
        list.style.display = 'flex';

        // Badge (nombre de messages) sur la bulle flottante.
        var chatBadge = document.getElementById('chat-bubble-badge');
        if (chatBadge) {
            if (messages.length) { chatBadge.textContent = messages.length > 99 ? '99+' : String(messages.length); chatBadge.style.display = 'flex'; }
            else { chatBadge.style.display = 'none'; }
        }

        if (currentUser) {
            if (form)   form.style.display = 'block';
            if (noUser) noUser.style.display = 'none';

            // Bouton publier
            var submitBtn = document.getElementById('discussion-submit');
            var input     = document.getElementById('discussion-input');
            if (submitBtn && input) {
                // Le bouton n'est jamais recréé (seul #discussion-list est remplacé à
                // chaque rendu) : sans ce reset, le « disabled = true » posé pendant
                // l'envoi restait figé après le succès — impossible de publier un
                // 2e commentaire sans recharger la page.
                submitBtn.disabled = false;
                submitBtn.onclick = function() {
                    var text = input.value.trim();
                    if (!text) return;
                    var msg = { id: Date.now(), author: currentUser.name, date: new Date().toISOString(), text: text, likes: [] };
                    messages.push(msg);
                    submitBtn.disabled = true;
                    saveDiscussion(currentCampaignName, messages).then(function(merged) {
                        input.value = '';
                        renderDiscussionMessages(merged || messages);
                        notifyMentions(text, currentCampaignName, currentUser.name);
                    }).catch(function(e) {
                        messages.pop(); // annule l'ajout local : la sauvegarde a échoué
                        submitBtn.disabled = false;
                        notify('Impossible de publier le commentaire : ' + errors.getErrorMessage(e), 'error');
                    });
                };
                setupMentionAutocomplete(input);
            }

            // Boutons like
            list.querySelectorAll('.discussion-like-btn').forEach(function(btn) {
                btn.onclick = function() {
                    var idx  = parseInt(btn.getAttribute('data-idx'), 10);
                    var msg  = messages[idx];
                    if (!msg) return;
                    var likes = msg.likes || [];
                    var pos   = likes.indexOf(currentUser.name);
                    if (pos >= 0) { likes.splice(pos, 1); } else { likes.push(currentUser.name); }
                    msg.likes = likes;
                    saveDiscussion(currentCampaignName, messages).then(function(merged) {
                        renderDiscussionMessages(merged || messages);
                    });
                };
            });
        } else {
            if (form)   form.style.display = 'none';
            if (noUser) noUser.style.display = 'block';
        }
    }

    function disableBtn(btn, label) { btn.disabled = true; btn.textContent = label; }
    function enableBtn(btn, label)  { btn.disabled = false; btn.textContent = label; }
</script>
