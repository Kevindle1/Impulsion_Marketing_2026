<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails de la campagne</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/dashboard-layout.css">
    <link rel="stylesheet" href="../css/topbar.css">
    <style>
        /* ── Infos campagne : sections & grilles ── */
        .detail-section {
            background: var(--bg-card, #fff);
            border: 1px solid var(--line, #eaefec);
            border-left: 4px solid var(--primary, #00875A);
            border-radius: 16px;
            padding: 20px 22px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-xs);
        }
        .detail-section h3 {
            margin: 0 0 14px 0;
            color: var(--muted, #56655e);
            font-size: 0.72rem;
            font-weight: 700;
            border-bottom: 1px solid var(--line-2, #f0f4f1);
            padding-bottom: 9px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        /* min-width:0 : une cellule de grille ne rétrécit pas sous son contenu par
           défaut — une URL longue élargissait la grille et rognait la page à droite. */
        .detail-item { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .detail-label { font-weight: 700; color: var(--muted-2, #8b988f); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.7px; }
        .detail-value { color: var(--ink, #0c1a14); font-size: 0.875rem; padding: 7px 11px; background: var(--line-2, #f0f4f1); border-radius: 9px; border: 1px solid var(--line, #eaefec); overflow-wrap: anywhere; word-break: break-word; }
        .detail-value a { overflow-wrap: anywhere; word-break: break-all; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag { display: inline-block; padding: 4px 11px; background: var(--green-50, #e8f6ef); color: var(--green-600, #00734C); border-radius: 999px; font-size: 0.68rem; font-weight: 700; border: 1px solid var(--green-100, #ccebdd); }
        .channel-card { background: var(--bg-card, #fff); border: 1px solid var(--line, #eaefec); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow-xs); }
        .channel-card h4 { margin: 0 0 10px 0; color: var(--ink, #0c1a14); font-size: 0.9375rem; font-weight: 700; letter-spacing: -0.2px; }
        .error-message { background: var(--red-50, #fdeaec); border: 1px solid #fecaca; color: #991b1b; padding: 18px; border-radius: 14px; text-align: center; margin: 32px 0; font-size: 0.875rem; }
        .loading-container { text-align: center; padding: 48px 20px; }
        .spinner { border: 3px solid var(--line, #eaefec); border-top: 3px solid var(--primary, #00875A); border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .back-button { display: inline-flex; align-items: center; gap: 6px; }

        /* ── Actor sections ── */
        .actor-section { background: var(--bg-card, #fff); border: 1px solid var(--line, #eaefec); border-left: 4px solid var(--gray-300, #d6ddd8); border-radius: 16px; padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow-xs); }
        .actor-section--com { border-left-color: var(--blue, #2563EB); }
        .actor-section--ebf { border-left-color: var(--amber, #E8A100); }
        .actor-section--data { border-left-color: var(--primary, #00875A); }
        .actor-section--mep { border-left-color: var(--violet, #7C3AED); }
        .actor-section--revision { border-left-color: var(--red, #E2001A); }
        .actor-section--revision h3 { color: var(--red, #E2001A); }
        .badge-revision { display: inline-block; background: var(--red-50, #fdeaec); color: var(--red, #E2001A); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; vertical-align: middle; margin-left: 8px; text-transform: none; letter-spacing: 0; border: 1px solid #fecaca; }
        .revision-alert { background: var(--red-50, #fdeaec); border: 1px solid #fecaca; border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; font-size: 13px; color: var(--red, #E2001A); white-space: pre-wrap; word-break: break-word; }

        /* ── Actor section header ── */
        .actor-section h3 {
            margin: 0 0 14px 0;
            color: var(--muted, #56655e);
            font-size: 0.72rem;
            font-weight: 700;
            border-bottom: 1px solid var(--line-2, #f0f4f1);
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── Actor form ── */
        .actor-form { margin-bottom: 4px; }
        .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .form-row label { font-size: 11px; font-weight: 700; color: var(--muted, #56655e); text-transform: uppercase; letter-spacing: 0.6px; }
        /* Champs personnalisés (déjà en place, migrés, ou ajoutés par un admin) :
           même langage typographique que .form-row label ci-dessus, pour qu'un
           champ historique et un champ migré ne se distinguent pas visuellement
           dans une même carte (ex. Réalisation BAT : Webmaster/Ref Paracom à
           côté d'Objet de l'email/Code Com). Règle propre à cette page — sur
           campaign.html/admin.html, .cf-label (css/components.css) reste déjà
           cohérente avec leur propre style de libellé. */
        .cf-fields-block .cf-label { font-size: 11px; font-weight: 700; color: var(--muted, #56655e); text-transform: uppercase; letter-spacing: 0.6px; }
        .form-control { padding: 10px 12px; border: 1px solid var(--line, #eaefec); border-radius: 10px; font-size: 13.5px; font-family: inherit; color: var(--ink, #0c1a14); background: #fff; width: 100%; box-sizing: border-box; transition: border-color 0.15s, box-shadow 0.15s; }
        .form-control:focus { outline: none; border-color: var(--primary, #00875A); box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.14); }
        .form-control:disabled, .form-control[readonly] { background: var(--line-2, #f0f4f1); color: var(--muted-2, #8b988f); cursor: not-allowed; border-color: var(--line, #eaefec); }
        .radio-group { display: flex; gap: 20px; padding: 6px 0; }
        .radio-group label { display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 13.5px; text-transform: none; letter-spacing: 0; color: var(--ink, #0c1a14); cursor: pointer; }
        .btn-actor-save { background: #fff; border: 1px solid var(--line, #eaefec); border-radius: 10px; padding: 8px 16px; font-size: 13px; font-weight: 650; cursor: pointer; color: var(--gray-700, #33403a); transition: all 0.15s; margin-top: 4px; }
        .btn-actor-save:hover { background: var(--green-50, #e8f6ef); border-color: var(--primary, #00875A); color: var(--green-600, #00734C); }
        .btn-actor-save:disabled { opacity: 0.5; cursor: not-allowed; }
        /* Dépôt enregistré (brouillon) mais pas encore soumis à validation. */
        .draft-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: #9a6b00; background: var(--amber-50, #fdf3e2); border: 1px solid var(--amber, #E8A100); border-radius: 999px; padding: 3px 10px; margin-bottom: 10px; cursor: help; }
        .btn-actor-submit { background: var(--primary, #00875A); color: #fff; border: none; border-radius: 10px; padding: 10px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: background 0.15s, box-shadow 0.15s; box-shadow: 0 2px 6px rgba(0,135,90,0.22); }
        .btn-actor-submit:hover { background: var(--primary-hover, #00734C); box-shadow: 0 6px 16px rgba(0,135,90,0.3); }
        .btn-actor-submit:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
        .btn-actor-submit--mep { background: var(--violet, #7C3AED); box-shadow: 0 2px 6px rgba(124,58,237,0.22); }
        .btn-actor-submit--mep:hover { background: #6d28d9; box-shadow: 0 6px 16px rgba(124,58,237,0.3); }
        .actor-submit-row { margin-top: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .actor-submit-note { font-size: 12px; color: var(--muted-2, #8b988f); }

        /* ── Read-only depot view ── */
        .depot-readonly { background: var(--line-2, #f0f4f1); border: 1px solid var(--line, #eaefec); border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; }
        .depot-readonly-title { font-size: 12px; font-weight: 700; color: var(--gray-700, #33403a); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .depot-readonly-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 9px; }
        .depot-readonly-item { font-size: 12px; color: var(--gray-700, #33403a); min-width: 0; overflow-wrap: anywhere; }
        .depot-readonly-item strong { display: block; color: var(--muted-2, #8b988f); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .depot-status-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
        .depot-status-badge--submitted { background: var(--blue-50, #e8f0fe); color: #1d4ed8; }
        .depot-status-badge--saved { background: var(--line-2, #f0f4f1); color: var(--muted, #56655e); }

        /* ── Onglets de navigation horizontaux ── */
        .details-shell {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            min-width: 0;
        }
        .details-panel > * { max-width: 100%; }
        .details-sidenav {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 0;
            background: #ffffff;
            border-bottom: 1px solid var(--line, #eaefec);
            padding: 0 28px;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .details-sidenav-label { display: none; }
        .details-nav-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 14px 16px;
            font-size: 13px;
            font-weight: 550;
            color: var(--muted-2, #8b988f);
            cursor: pointer;
            border: none;
            background: none;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s, border-color 0.15s;
            border-radius: 0;
            letter-spacing: -0.1px;
        }
        .details-nav-item:hover { color: var(--ink, #0c1a14); }
        .details-nav-item.active {
            color: var(--primary, #00875A);
            font-weight: 700;
            border-bottom-color: var(--primary, #00875A);
        }
        .details-nav-separator { display: none; }
        .details-panel {
            flex: 1;
            overflow-y: auto;
            padding: 26px 28px;
            min-width: 0;
            background: var(--bg, #f4f7f5);
        }
        /* ── Bandeau d'action sticky (haut de l'onglet Infos) : résume l'étape la
           plus ancienne encore bloquée, tous canaux confondus, avec raccourci. ── */
        .sticky-banner { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: linear-gradient(135deg, var(--amber-50, #fdf3e2), #fff); border: 1px solid var(--amber-50, #fdf3e2); border-bottom: 2px solid var(--amber, #E8A100); border-radius: 10px; padding: 11px 16px; margin-bottom: 16px; box-shadow: 0 6px 14px rgba(232,161,0,.10); }
        .sticky-banner-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: #9a6b00; background: var(--amber-50, #fdf3e2); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
        .sticky-banner-text { font-size: 13px; color: var(--ink, #0c1a14); flex: 1; min-width: 220px; }
        .sticky-banner-cta { background: var(--primary, #00875A); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12.5px; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: inherit; }
        .sticky-banner-cta:hover { background: var(--primary-hover, #00734C); }

        /* ── Bloc unifié : sous-onglets Infos générales / Documents / Activité ── */
        .subtab-strip { display: flex; gap: 2px; border-bottom: 1px solid var(--line, #eaefec); margin-bottom: 16px; }
        .subtab-btn { padding: 9px 15px; font-size: 12.5px; font-weight: 700; color: var(--muted, #56655e); border: none; background: none; border-bottom: 2px solid transparent; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; margin-bottom: -1px; }
        .subtab-btn:hover { color: var(--ink, #0c1a14); }
        .subtab-btn.active { color: var(--primary, #00875A); border-color: var(--primary, #00875A); }
        .subtab-count { background: var(--line-2, #f0f4f1); color: var(--muted, #56655e); font-size: 10px; font-weight: 800; border-radius: 999px; padding: 1px 6px; }
        .subtab-panel { display: none; }
        .subtab-panel.active { display: block; }

        /* ── Mise en page de l'onglet Infos ── */
        .info-layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; align-items: start; }
        .info-main, .info-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
        .info-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .info-layout .detail-section, .info-cards .detail-section { margin-bottom: 0; }
        @media (max-width: 1100px) { .info-layout { grid-template-columns: 1fr; } }
        /* Anti-débordement horizontal (petits écrans / campagnes à nombreux canaux) */
        .actor-section, .detail-section, .wf-block { max-width: 100%; overflow-wrap: anywhere; }
        .actor-section .actor-submit-row button, .actor-section button { max-width: 100%; white-space: normal; }
        @media (max-width: 640px) {
            .actor-section { padding: 14px; }
            .detail-section { padding: 14px; }
            /* Les boutons de validation passent en pleine largeur et restent accessibles */
            .actor-submit-row { flex-direction: column; align-items: stretch; }
            .actor-submit-row button { width: 100%; }
        }

        /* ── Stepper du workflow ── */
        .wf-block { margin-bottom: 8px; }
        .wf-block + .wf-block { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-2, #f0f4f1); }
        .wf-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .wf-head .wf-title { font-size: 13px; font-weight: 750; color: var(--ink, #0c1a14); display: flex; align-items: center; gap: 8px; }
        .wf-badge { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: var(--green-50, #e8f6ef); color: var(--green-600, #00734C); white-space: nowrap; }
        .wf-badge.done { background: var(--green-50); color: var(--green-700); }
        .wf-badge.wait { background: var(--amber-50); color: #9a6b00; }
        .wf-badge.val  { background: var(--blue-50); color: #1d4ed8; }
        .wf-badge.rev  { background: var(--red-50); color: var(--red); }
        .wf-stepper { display: flex; align-items: flex-start; overflow-x: auto; padding: 2px 0 4px; }
        .wf-step { display: flex; flex-direction: column; align-items: center; flex: 1 1 0; min-width: 78px; position: relative; }
        .wf-step::before { content: ""; position: absolute; top: 16px; left: -50%; width: 100%; height: 2px; background: var(--line, #eaefec); z-index: 0; }
        .wf-step:first-child::before { display: none; }
        .wf-step.done::before, .wf-step.submitted::before, .wf-step.current::before, .wf-step.revision::before { background: var(--primary, #00875A); }
        .wf-node { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; z-index: 1; border: 2px solid var(--line, #eaefec); background: #fff; color: var(--muted-2, #8b988f); }
        .wf-step.done .wf-node { background: var(--primary, #00875A); border-color: var(--primary, #00875A); color: #fff; }
        .wf-step.current .wf-node { border-color: var(--amber, #E8A100); color: var(--amber, #E8A100); box-shadow: 0 0 0 4px var(--amber-50, #fdf3e2); }
        .wf-step.submitted .wf-node { border-color: var(--blue, #2563EB); color: var(--blue, #2563EB); box-shadow: 0 0 0 4px var(--blue-50, #e8f0fe); }
        .wf-step.revision .wf-node { border-color: var(--red, #E2001A); color: var(--red, #E2001A); box-shadow: 0 0 0 4px var(--red-50, #fdeaec); }
        .wf-label { font-size: 10.5px; font-weight: 600; color: var(--muted-2, #8b988f); margin-top: 8px; text-align: center; line-height: 1.25; max-width: 86px; }
        .wf-step.done .wf-label, .wf-step.current .wf-label, .wf-step.submitted .wf-label, .wf-step.revision .wf-label { color: var(--ink, #0c1a14); }
        .wf-step.current .wf-label { font-weight: 700; }
        /* Étapes cliquables (timeline par canal) → ouvrent le bloc correspondant */
        .wf-step--link { cursor: pointer; }
        .wf-step--link:hover .wf-node { border-color: var(--primary, #00875A); color: var(--primary, #00875A); box-shadow: 0 0 0 4px var(--green-50, #e8f6ef); }
        .wf-step--link.done:hover .wf-node { color: #fff; }
        .wf-step--link:hover .wf-label { color: var(--primary, #00875A); text-decoration: underline; }
        .wf-step--link:hover .wf-cal { border-color: var(--primary, #00875A); }

        /* Pastille-date (timeline canal) : date du dépôt/de la validation
           directement dans la pastille — jour + mois pour une étape terminée,
           « Depuis Xj » pour une étape en cours ou en révision. Un rond simple
           (34px) reste utilisé quand aucune date n'est encore connue pour
           cette étape (donnée antérieure à l'introduction de ce suivi) — les
           deux formes sont donc alignées à 40px sur une même ligne.
           Cf. workflow.getChannelStepDate(). */
        .wf-stepper--cal .wf-node { width: 40px; height: 40px; }
        .wf-stepper--cal .wf-step::before { top: 20px; }
        .wf-cal { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; border: 2px solid var(--line, #eaefec); background: #fff; flex-shrink: 0; display: flex; flex-direction: column; z-index: 1; }
        .wf-cal-tag { font-size: 7.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; text-align: center; padding: 2.5px 0; background: var(--muted-2, #8b988f); color: #fff; }
        .wf-cal-num { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: var(--ink, #0c1a14); font-variant-numeric: tabular-nums; }
        .wf-step.done .wf-cal { border-color: var(--primary, #00875A); }
        .wf-step.done .wf-cal-tag { background: var(--primary, #00875A); }
        .wf-step.done .wf-cal-num { color: var(--primary-hover, #00734C); }
        .wf-step.current .wf-cal { border-color: var(--amber, #E8A100); box-shadow: 0 0 0 4px var(--amber-50, #fdf3e2); }
        .wf-step.current .wf-cal-tag { background: var(--amber, #E8A100); }
        .wf-step.current .wf-cal-num { color: #9a6b00; }
        .wf-step.submitted .wf-cal { border-color: var(--blue, #2563EB); box-shadow: 0 0 0 4px var(--blue-50, #e8f0fe); }
        .wf-step.submitted .wf-cal-tag { background: var(--blue, #2563EB); }
        .wf-step.submitted .wf-cal-num { color: var(--blue, #2563EB); }
        .wf-step.revision .wf-cal { border-color: var(--red, #E2001A); box-shadow: 0 0 0 4px var(--red-50, #fdeaec); }
        .wf-step.revision .wf-cal-tag { background: var(--red, #E2001A); }
        .wf-step.revision .wf-cal-num { color: var(--red, #E2001A); }
        @keyframes wfFlash { 0% { box-shadow: 0 0 0 0 rgba(0,135,90,0); } 25% { box-shadow: 0 0 0 4px rgba(0,135,90,.28); } 100% { box-shadow: 0 0 0 0 rgba(0,135,90,0); } }
        .wf-flash { animation: wfFlash 1.6s ease; }
        .wf-chan-date { font-size: 12px; color: var(--muted, #56655e); margin: -2px 0 12px; }
        .wf-chan-date strong { color: var(--ink, #0c1a14); font-weight: 700; }
        .wf-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 11px; color: var(--muted, #56655e); }
        .wf-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .wf-legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
        /* ── Lightbox ── */
        #lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        #lightbox-overlay.open { display: flex; }
        #lightbox-overlay img {
            max-width: 92vw;
            max-height: 92vh;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
            cursor: zoom-in;
            transform-origin: center center;
            transition: transform 0.06s ease-out;
        }
        #lightbox-overlay iframe {
            width: 92vw;
            height: 92vh;
            border: none;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        #lightbox-close {
            position: fixed;
            top: 18px;
            right: 24px;
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            line-height: 1;
            opacity: 0.8;
            background: none;
            border: none;
            padding: 0;
        }
        #lightbox-close:hover { opacity: 1; }

        /* ── Bilan ── */
        .bilan-meta { font-size: 12px; color: var(--muted-2, #8b988f); }
        .bilan-card { background: var(--bg-card, #fff); border: 1px solid var(--line, #eaefec); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow-xs); }
        .bilan-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .bilan-card-title { font-weight: 700; font-size: 0.9rem; color: var(--ink, #0c1a14); letter-spacing: -0.2px; }
        .bilan-badge { font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
        .bilan-badge.live { color: var(--green-600, #00734C); background: var(--green-50, #e8f6ef); border: 1px solid var(--green-100, #ccebdd); }
        .bilan-badge.arch { color: #92600a; background: #fdf3e2; border: 1px solid #f0d98a; }
        .bilan-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
        .bilan-tile { background: var(--line-2, #f0f4f1); border: 1px solid var(--line, #eaefec); border-radius: 10px; padding: 8px 10px; }
        .bilan-tile .lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted-2, #8b988f); }
        .bilan-tile .val { font-size: 1.05rem; font-weight: 750; color: var(--ink, #0c1a14); margin-top: 2px; line-height: 1.1; }
        .bilan-tile.accent .val { color: var(--primary, #00875A); }
        .bilan-tiles.primary { grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); margin-bottom: 8px; }
        .bilan-tiles.sec { grid-template-columns: repeat(auto-fit, minmax(86px, 1fr)); }
        .bilan-tile.primary { padding: 10px 12px; }
        .bilan-tile.primary .val { font-size: 1.4rem; }
        .bilan-tile.sec { background: transparent; }
        .bilan-tile.sec .val { font-size: 0.95rem; font-weight: 700; }
        .bilan-charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
        .bilan-chart-card { border: 1px solid var(--line, #eaefec); border-radius: 12px; padding: 10px 12px; background: var(--bg-card, #fff); }
        .bilan-chart-card h5 { margin: 0 0 6px; font-size: 0.8rem; font-weight: 700; color: var(--gray-700, #33403a); }
        .bilan-detail summary { cursor: pointer; font-size: 12px; color: var(--muted, #56655e); margin-top: 10px; }
        .bilan-detail table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 8px; }
        .bilan-detail th { text-align: right; padding: 4px 6px; color: var(--muted-2, #8b988f); font-weight: 600; white-space: nowrap; }
        .bilan-detail th:first-child, .bilan-detail td:first-child { text-align: left; }
        .bilan-detail td { text-align: right; padding: 4px 6px; border-top: 1px solid var(--line, #eaefec); white-space: nowrap; }
        .bilan-cmp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--gray-700, #33403a); }
        .bilan-cmp select { font-size: 12px; padding: 4px 8px; border: 1px solid var(--line, #eaefec); border-radius: 8px; background: #fff; font-family: inherit; }

        /* ── Discussion (façon Facebook — bulle flottante, cf. #chat-bubble-btn) ── */
        .discussion-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
        .discussion-msg { display: flex; gap: 10px; }
        .discussion-msg-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary, #00875A); color: #fff; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; letter-spacing: 0; }
        .discussion-msg-body { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; flex: 1; }
        .discussion-msg-bubble { background: var(--line-2, #f0f4f1); border-radius: 16px; padding: 9px 14px; max-width: 100%; }
        .discussion-msg-author { font-size: 12.5px; font-weight: 700; color: var(--ink, #0c1a14); }
        .discussion-msg-text { font-size: 13px; color: var(--ink, #0c1a14); line-height: 1.5; white-space: pre-wrap; word-break: break-word; margin-top: 1px; }
        .discussion-msg-footer { display: flex; align-items: center; gap: 12px; padding-left: 14px; }
        .discussion-msg-date { font-size: 11px; color: var(--muted-2, #8b988f); white-space: nowrap; }
        .discussion-like-btn { background: none; border: none; padding: 0; font-size: 11.5px; font-weight: 700; color: var(--muted-2, #8b988f); cursor: pointer; font-family: inherit; }
        .discussion-like-btn:hover { color: var(--ink, #0c1a14); text-decoration: underline; }
        .discussion-like-btn.liked { color: var(--primary, #00875A); }
        .discussion-form { display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line-2, #f0f4f1); margin-top: 4px; }
        .discussion-form textarea { flex: 1; resize: none; border: none; background: var(--line-2, #f0f4f1); border-radius: 999px; padding: 9px 16px; font-family: inherit; font-size: 13px; color: var(--ink, #0c1a14); max-height: 90px; box-sizing: border-box; }
        .discussion-form textarea:focus { outline: none; box-shadow: 0 0 0 2px var(--green-100, #ccebdd); }
        .discussion-form-row { display: contents; }
        #discussion-submit { width: 34px; height: 34px; border-radius: 50%; background: var(--green-50, #e8f6ef); color: var(--primary-hover, #00734C); border: none; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; cursor: pointer; padding: 0; font-family: inherit; }
        #discussion-submit:hover:not(:disabled) { background: var(--green-100, #ccebdd); }
        #discussion-submit:disabled { opacity: .5; cursor: not-allowed; }

        /* ── Discussion : bulle flottante (bas droite), on clique pour ouvrir.
           La bulle d'aide (?) de cette page a été retirée (elle chevauchait ce
           coin) : plus besoin d'empiler les deux. ── */
        .chat-bubble-btn { position: fixed; bottom: 24px; right: 24px; width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg, #12C386, #00734C); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 24px rgba(0,115,76,.38), 0 2px 5px rgba(12,30,22,.12); z-index: 50; border: 3px solid #fff; transition: transform .15s, box-shadow .15s; padding: 0; }
        .chat-bubble-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 14px 28px rgba(0,115,76,.42), 0 2px 5px rgba(12,30,22,.12); }
        .chat-bubble-btn svg { width: 24px; height: 24px; }
        .chat-bubble-badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--red, #E2001A); color: #fff; font-size: 11px; font-weight: 800; display: none; align-items: center; justify-content: center; border: 2.5px solid #fff; }
        .chat-panel { display: none; position: fixed; bottom: 90px; right: 24px; width: 340px; max-height: 65vh; background: #fff; border-radius: 16px; box-shadow: 0 16px 40px rgba(12,30,22,.22); border: 1px solid var(--line, #eaefec); overflow: hidden; flex-direction: column; z-index: 51; }
        .chat-panel.open { display: flex; }
        .chat-panel-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; background: linear-gradient(135deg, #12C386, #00734C); color: #fff; font-size: 13.5px; font-weight: 750; flex-shrink: 0; }
        .chat-panel-close { cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; opacity: .9; border: none; background: none; color: #fff; padding: 0; }
        .chat-panel-close:hover { background: rgba(255,255,255,.18); opacity: 1; }
        .chat-panel-body { padding: 14px; overflow-y: auto; flex: 1; }
        @media (max-width: 768px) {
            .chat-bubble-btn { width: 48px; height: 48px; bottom: 16px; right: 16px; }
            .chat-panel { width: calc(100vw - 24px); right: 12px; bottom: 74px; }
        }
        /* ── Éditeur de texte enrichi (demande de modification) ── */
        .rich-editor { border: 1px solid var(--amber, #E8A100); border-radius: 6px; overflow: hidden; background: #fff; }
        .rich-toolbar { display: flex; gap: 3px; padding: 4px 6px; background: var(--line-2, #f0f4f1); border-bottom: 1px solid var(--line, #eaefec); flex-wrap: wrap; }
        .rich-tb-btn { background: none; border: 1px solid transparent; border-radius: 4px; min-width: 27px; height: 24px; font-size: 13px; cursor: pointer; color: #444; line-height: 1; padding: 0 6px; }
        .rich-tb-btn:hover { background: #fff; border-color: var(--line, #eaefec); }
        .rich-input { min-height: 70px; padding: 8px 10px; font-size: 13px; font-family: inherit; color: var(--ink, #0c1a14); outline: none; line-height: 1.5; }
        .rich-input:empty:before { content: attr(data-placeholder); color: var(--muted-2, #8b988f); }
        .rich-input ul, .rich-input ol { margin: 4px 0; padding-left: 22px; }
        .revision-alert ul, .revision-alert ol { margin: 4px 0 4px 18px; padding-left: 0; }
    </style>
</head>

<script>
    // Garde de session : sans identité (choisie au login), retour à l'écran de connexion
    (function () {
        var u = window.ImpulsionMarketing && window.ImpulsionMarketing.users;
        if (!u || !u.getCurrentUser()) { window.location.replace('../login.html'); }
