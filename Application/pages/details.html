</script>

<script>
    var directoryStorage = window.ImpulsionMarketing.directoryStorage;
    var security         = window.ImpulsionMarketing.security;
    var errors           = window.ImpulsionMarketing.errors;
    var users            = window.ImpulsionMarketing.users;
    var workflow         = window.ImpulsionMarketing.workflow;
    var customFields     = window.ImpulsionMarketing.customFields;

    // Notification (remplace alert) — repli sur alert si le module n'est pas chargé.
    function notify(message, type) {
        if (errors && errors.showNotification) errors.showNotification(message, type || 'info');
        else alert(message);
    }

    // ── Champs personnalisés (Administration ▸ Champs personnalisés) : rendu +
    // câblage + collecte partagés par toutes les sections d'étape ci-dessous.
    // `values` doit refléter ce qui est déjà enregistré pour CETTE étape+canal
    // (dépôt JSON pour les étapes de dépôt, ch.customFieldValues pour les
    // étapes de validation PO / juridique — deux emplacements de stockage
    // différents selon l'étape, cf. renvoi de la fonction appelante).
    // `opts.idSuffix` : réservé aux champs déjà en place migrés vers le moteur
    // générique (même clé de stockage) — reconstitue l'id DOM exact déjà
    // référencé ailleurs par du code non générique (ex. collectDataMepDepot),
    // sans toucher aux champs perso ajoutés par un admin sur la même étape.
    function customFieldsSectionHtml(stepId, ch, values, opts) {
        if (!customFields) return '';
        return customFields.renderFields(stepId, values || {}, Object.assign({ canalType: ch && ch.content }, opts || {}));
    }
    function wireCustomFieldsSection(stepId, ch) {
        if (!customFields) return;
        customFields.wireFields(document, stepId, { canalType: ch && ch.content });
    }
    // Collecte + valide les champs perso saisis dans le DOM pour cette étape.
    // Renvoie { values, errors } — errors est un tableau de {fieldId, message}.
    function collectCustomFields(stepId, ch) {
        if (!customFields) return { values: {}, errors: [] };
        var values = customFields.collectValues(document, stepId, ch && ch.content);
        var errs = customFields.validateValues(stepId, values, ch && ch.content);
        return { values: values, errors: errs };
    }
    // Étapes de DÉPÔT (com/ebf/data) : attache les valeurs des champs perso à
    // l'objet `depot` avant sa sauvegarde (même fichier JSON que le reste du
    // dépôt). Renvoie les erreurs de validation (à vérifier avant une soumission
    // — un brouillon peut toujours être enregistré incomplet).
    function attachCustomFieldsToDepot(depot, stepId, idx) {
        var ch = currentCampaignData.channels[idx];
        var r = collectCustomFields(stepId, ch);
        depot.customFieldValues = r.values;
        return r.errors;
    }

    // Petite modale de saisie texte (remplace prompt). Appelle onConfirm(valeur) à la validation.
    function showPromptModal(opts) {
        opts = opts || {};
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10001;display:flex;align-items:center;justify-content:center;';
        var box = document.createElement('div');
        box.style.cssText = 'background:#fff;border-radius:10px;padding:22px;width:min(420px,90vw);box-shadow:0 10px 40px rgba(0,0,0,.25);';
        box.innerHTML =
            '<h3 style="margin:0 0 6px;font-size:16px;color:var(--gray-700);">' + security.escapeHtml(opts.title || 'Saisie') + '</h3>'
            + (opts.label ? '<p style="margin:0 0 12px;font-size:13px;color:var(--muted-2);">' + security.escapeHtml(opts.label) + '</p>' : '')
            + '<input type="text" class="form-control" placeholder="' + security.escapeHtml(opts.placeholder || '') + '" style="width:100%;box-sizing:border-box;margin-bottom:16px;">'
            + '<div style="display:flex;gap:8px;justify-content:flex-end;">'
            + '<button data-act="cancel" style="background:var(--line-2);color:var(--gray-700);border:1px solid var(--line);border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px;">Annuler</button>'
            + '<button data-act="ok" style="background:var(--primary);color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13px;">' + security.escapeHtml(opts.confirmText || 'Valider') + '</button>'
            + '</div>';
        overlay.appendChild(box);
        document.body.appendChild(overlay);
        var input = box.querySelector('input');
        input.focus();
        function close() { overlay.remove(); }
        function submit() {
            var v = input.value.trim();
            if (!v) { input.style.borderColor = 'var(--red)'; input.focus(); return; }
            close();
            if (opts.onConfirm) opts.onConfirm(v);
        }
        box.querySelector('[data-act="cancel"]').addEventListener('click', close);
        box.querySelector('[data-act="ok"]').addEventListener('click', submit);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submit();
            else if (e.key === 'Escape') close();
        });
    }

    var currentCampaignName = null;
    var currentRootHandle   = null;
    var currentCampaignData = null;

    // Navigation secondaire
    var currentPage        = 'info';
    var loadedDepots       = {};
    var submittedInSession = { com: new Set(), ebf: new Set(), data: new Set(), dataTest: new Set() };

    window.addEventListener('load', function() {
        // Bulle d'aide (?) retirée de cette page : elle chevauchait la bulle
        // de discussion, dans le même coin de l'écran (cf. #chat-bubble-btn).
        loadCampaignDetails();
    });

    /**
     * Rafraîchissement en place après une action workflow.
     * Évite un location.reload() complet (pas de rechargement des scripts depuis V://).
     * Les données en mémoire sont déjà à jour (advanceStep / requestRevision modifie currentCampaignData).
     */
    function refreshCurrentPage() {
        loadedDepots = {};  // vider le cache dépôts pour forcer un rechargement depuis V://
        buildSideNav(currentCampaignName, currentCampaignData);
        navigateTo(currentPage);
        if (errors && errors.showNotification) {
            errors.showNotification('Action enregistrée ✓', 'success', 2000);
        }
    }

    function getUrlParameter(name) {
        return new URLSearchParams(window.location.search).get(name);
    }
    function editCampaign() {
        if (currentCampaignName) window.location.href = 'campaign.html?edit=' + encodeURIComponent(currentCampaignName);
    }
    function duplicateCampaign() {
        if (currentCampaignName) window.location.href = 'campaign.html?duplicate=' + encodeURIComponent(currentCampaignName);
    }
    function pushNotifDebrancher(campagneName, campaignData) {
        if (!currentRootHandle) return;
        var assignments = (campaignData.workflow && campaignData.workflow.assignments) || {};

        function resolveAssignees(role) {
            var list = assignments[role] || [];
            if (typeof list === 'string') list = list ? [list] : [];
            if (!list.length) {
                list = users.USERS.filter(function(u) { return u.role === role && u.isManager && !u.inactive; }).map(function(u) { return u.name; });
            }
            return list;
        }

        var destinataires = resolveAssignees('data').concat(resolveAssignees('ebf'));
        // Dédoublonnage
        var seen = {};
        destinataires = destinataires.filter(function(d) { return seen[d] ? false : (seen[d] = true); });
        if (!destinataires.length) return;

        currentRootHandle.getFileHandle('_notifications.json', { create: true })
            .then(function(fh) {
                return fh.getFile().then(function(f) { return f.text(); })
                    .then(function(txt) { return { fh: fh, notifs: JSON.parse(txt) }; })
                    .catch(function() { return { fh: fh, notifs: [] }; });
            })
            .then(function(res) {
                var now = new Date().toISOString();
                destinataires.forEach(function(dest) {
                    res.notifs.push({
                        id: 'notif-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                        type: 'campagne_inactive',
                        destinataire: dest,
                        campagneId: campagneName,
                        campagneTitre: campagneName,
                        dateCreation: now,
                        lu: false
                    });
                });
                return res.fh.createWritable().then(function(w) {
                    return w.write(JSON.stringify(res.notifs, null, 2)).then(function() { return w.close(); });
                });
            })
            .catch(function(e) { console.warn('Notif débrancher failed:', e); });
    }

    function toggleCampaignActif() {
        if (!currentCampaignName || !currentCampaignData) return;
        // #13 : réservé à l'équipe Data (+ super-admin), avec motif obligatoire.
        var cu = users && users.getCurrentUser();
        if (!cu || !(cu.role === 'data' || cu.isSuperAdmin)) {
            notify('Seule l\'équipe Data peut activer ou désactiver une campagne.', 'warning');
            return;
        }
        var isActif = currentCampaignData.actif !== false;
        var nouvelEtat = !isActif;
        showPromptModal({
            title: nouvelEtat ? 'Réactiver la campagne' : 'Rendre la campagne inactive',
            label: nouvelEtat
                ? 'Indiquez le motif de réactivation. L\'action et son auteur sont enregistrés dans le journal.'
                : 'Indiquez le motif (la campagne ne tournera plus). L\'action et son auteur sont enregistrés dans le journal.',
            placeholder: 'Motif…',
            confirmText: nouvelEtat ? '▶️ Réactiver' : '⏸️ Rendre inactif',
            onConfirm: function(motif) {
                currentCampaignData.actif = nouvelEtat;
                if (!nouvelEtat) pushNotifDebrancher(currentCampaignName, currentCampaignData);
                workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData)
                    .then(function() {
                        var toggleActifBtn = document.getElementById('toggleActifButton');
                        if (toggleActifBtn) {
                            toggleActifBtn.textContent = nouvelEtat ? '⏸️ Rendre inactif' : '▶️ Réactiver';
                            toggleActifBtn.style.color = nouvelEtat ? 'var(--red)' : 'var(--primary)';
                        }
                        errors.showNotification(nouvelEtat ? 'Campagne réactivée.' : 'Campagne rendue inactive.', 'success', 2000);
                        logActivity(currentCampaignName, 'statut',
                            (nouvelEtat ? 'Campagne réactivée' : 'Campagne rendue inactive')
                            + ' par ' + cu.name + ' — motif : ' + motif);
                    })
                    .catch(function(err) {
                        errors.showNotification('Erreur : ' + errors.getErrorMessage(err), 'error');
                    });
            }
        });
    }
    // ─────────────────────────────────────────────
    // SUPPRESSION CAMPAGNE (Item 14)
    // ─────────────────────────────────────────────
    function deleteCampaign() {
        if (!currentCampaignName || !currentRootHandle) return;
        if (!confirm('Supprimer définitivement la campagne "' + currentCampaignName + '" ?\n\nCette action est irréversible.')) return;
        currentRootHandle.getDirectoryHandle('Campagnes')
            .then(function(campDir) {
                // Supprimer le dossier de la campagne (récursif)
                return campDir.removeEntry(currentCampaignName, { recursive: true })
                    .then(function() { return campDir; });
            })
            .then(function(campDir) {
                // Retirer la campagne de _index.json
                return campDir.getFileHandle('_index.json', { create: false })
                    .then(function(fh) { return fh.getFile(); })
                    .then(function(f) { return f.text(); })
                    .then(function(text) {
                        var idx = JSON.parse(text);
                        if (idx.campaigns) delete idx.campaigns[currentCampaignName];
                        return campDir.getFileHandle('_index.json', { create: true })
                            .then(function(fh) { return fh.createWritable(); })
                            .then(function(w) { return w.write(JSON.stringify(idx, null, 2)).then(function() { return w.close(); }); });
                    });
            })
            .then(function() {
                // Invalider le cache IndexedDB
                try {
                    var ic = window.ImpulsionMarketing.performance.IndexCache;
                    if (ic && currentRootHandle) ic.set(currentRootHandle.name, null);
                } catch(e) {}
                errors.showNotification('Campagne supprimée.', 'success', 1500);
                setTimeout(function() { window.location.href = '../Impulsion-Marketing.html'; }, 1600);
            })
            .catch(function(err) {
                errors.showNotification('Erreur lors de la suppression : ' + errors.getErrorMessage(err), 'error');
            });
    }

    // ─────────────────────────────────────────────
    // SUPPRESSION D'UN CANAL (Item 13)
    // ─────────────────────────────────────────────
    function deleteChannel(idx) {
        if (!currentCampaignName || !currentCampaignData) return;
        var ch = (currentCampaignData.channels || [])[idx];
        var label = ch ? (ch.deliverableName || ('Canal ' + (idx + 1))) : ('Canal ' + (idx + 1));
        if (!confirm('Supprimer le canal "' + label + '" de cette campagne ?')) return;
        currentCampaignData.channels.splice(idx, 1);
        workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData)
            .then(function() {
                errors.showNotification('Canal supprimé.', 'success', 2000);
                buildSideNav(currentCampaignName, currentCampaignData);
                navigateTo('info');
            })
            .catch(function(err) {
                // Annuler le splice si la sauvegarde échoue
                currentCampaignData.channels.splice(idx, 0, ch);
                errors.showNotification('Erreur : ' + errors.getErrorMessage(err), 'error');
            });
    }

    function showError(message) {
        document.getElementById('loading').style.display = 'none';
        var el = document.getElementById('error');
        el.style.display = 'block';
        errors.showErrorInContainer(el, message, { showHomeButton: false });
        el.innerHTML += '<a href="../Impulsion-Marketing.html" class="btn primary" style="margin-top:16px;display:inline-block;">Retour au tableau de bord</a>';
    }

    // ─────────────────────────────────────────────
    // LOAD
    // ─────────────────────────────────────────────
    function checkPublicationEndDates(campaignName, data) {
        if (!currentRootHandle || !data.channels) return;
        var today = new Date(); today.setHours(0,0,0,0);
        var toNotify = [];
        data.channels.forEach(function(ch, idx) {
            if (!ch.siteWeb || !ch.siteWeb.dateFin) return;
            var fin = new Date(ch.siteWeb.dateFin); fin.setHours(0,0,0,0);
            if (fin > today) return;
            // Destinataire : webmaster EBF affecté ou manager EBF
            var assignments = (data.workflow && data.workflow.assignments) || {};
            var ebfAssignees = assignments.ebf || [];
            if (typeof ebfAssignees === 'string') ebfAssignees = ebfAssignees ? [ebfAssignees] : [];
            if (!ebfAssignees.length) {
                ebfAssignees = users.USERS.filter(function(u) { return u.role === 'ebf' && u.isManager && !u.inactive; }).map(function(u) { return u.name; });
            }
            toNotify.push({ idx: idx, dateFin: ch.siteWeb.dateFin, dest: ebfAssignees, canal: ch.deliverableName || ('Canal ' + (idx + 1)) });
        });
        if (!toNotify.length) return;
        // Lire _notifications.json pour antidoublonnage
        currentRootHandle.getFileHandle('_notifications.json', { create: true })
            .then(function(fh) {
                return fh.getFile().then(function(f) { return f.text(); })
                    .then(function(txt) { return { fh: fh, notifs: JSON.parse(txt) }; })
                    .catch(function() { return { fh: fh, notifs: [] }; });
            })
            .then(function(res) {
                var notifs = res.notifs;
                var added = false;
                var now = new Date().toISOString();
                toNotify.forEach(function(item) {
                    item.dest.forEach(function(dest) {
                        var alreadySent = notifs.some(function(n) {
                            return n.type === 'publication_fin' && n.campagneId === campaignName && n.canalIdx === item.idx && n.destinataire === dest;
                        });
                        if (alreadySent) return;
                        notifs.push({
                            id: 'notif-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                            type: 'publication_fin',
                            destinataire: dest,
                            campagneId: campaignName,
                            campagneTitre: campaignName,
                            canalIdx: item.idx,
                            zone: item.canal,
                            dateFin: item.dateFin,
                            dateCreation: now,
                            lu: false
                        });
                        added = true;
                    });
                });
                if (!added) return;
                return res.fh.createWritable().then(function(w) {
                    return w.write(JSON.stringify(notifs, null, 2)).then(function() { return w.close(); });
                });
            })
            .catch(function(e) { console.warn('checkPublicationEndDates failed:', e); });
    }

    function loadCampaignDetails() {
        var campaignName = getUrlParameter('name');
        if (!campaignName) { showError('Aucune campagne spécifiée'); return; }

        directoryStorage.getRootHandleWithCheck()
            .then(function(result) {
                if (result.status !== 'success') {
                    showError(result.message + '<br><a href="../login.html" class="btn primary" style="margin-top:16px;">Se reconnecter</a>');
                    return;
                }
                currentRootHandle = result.handle;
                return result.handle.getDirectoryHandle('Campagnes')
                    .then(function(d) { return d.getDirectoryHandle(campaignName); })
                    .then(function(d) { return d.getFileHandle('campagne.json'); })
                    .then(function(fh) { return fh.getFile(); })
                    .then(function(f) { return f.text(); })
                    .then(function(text) {
                        var data = JSON.parse(text);
                        if (workflow) workflow.initWorkflow(data);
                        currentCampaignData = data;
                        // Mémorise l'état disque pour la fusion concurrente à la sauvegarde
                        if (workflow && workflow.captureBaseline) workflow.captureBaseline(data);
                        markCampaignMentionsRead(campaignName);
                        initDetailsUI(campaignName, data);
                        checkPublicationEndDates(campaignName, data);
                    });
            })
            .catch(function(err) {
                showError('Impossible de charger la campagne : ' + errors.getErrorMessage(err));
            });
    }

    // ─────────────────────────────────────────────
    // INITIALISATION UI
    // ─────────────────────────────────────────────
    function initDetailsUI(name, data) {
        document.getElementById('loading').style.display = 'none';
        var _title = document.getElementById('details-campaign-title');
        if (_title) _title.textContent = name;
        currentCampaignName = name;
        var editBtn        = document.getElementById('editButton');
        var dupBtn         = document.getElementById('duplicateButton');
        var toggleActifBtn = document.getElementById('toggleActifButton');
        // #11 : la modification d'une campagne est réservée au PO (et au super-admin).
        var canEdit = (users && users.isCurrentUserPO && users.isCurrentUserPO(data))
            || (users && users.isCurrentUserSuperAdmin && users.isCurrentUserSuperAdmin());
        if (editBtn) editBtn.style.display = canEdit ? 'inline-flex' : 'none';
        if (dupBtn)  dupBtn.style.display  = 'inline-flex';
        if (toggleActifBtn) {
            // #13 : l'activation/désactivation d'une campagne est réservée à l'équipe Data
            // (tout utilisateur de rôle Data) et au super-admin.
            var _cu = users && users.getCurrentUser();
            var canToggleActif = _cu && (_cu.role === 'data' || _cu.isSuperAdmin);
            if (canToggleActif) {
                toggleActifBtn.style.display = 'inline-flex';
                var isActif = data.actif !== false;
                toggleActifBtn.textContent = isActif ? '⏸️ Rendre inactif' : '▶️ Réactiver';
                toggleActifBtn.style.color = isActif ? 'var(--red)' : 'var(--primary)';
            } else {
                toggleActifBtn.style.display = 'none';
            }
        }
        var deleteBtn = document.getElementById('deleteCampaignButton');
        // La suppression d'une campagne est réservée au PO (et au super-admin), comme la modification.
        var canDelete = (users && users.isCurrentUserPO && users.isCurrentUserPO(data))
            || (users && users.isCurrentUserSuperAdmin && users.isCurrentUserSuperAdmin());
        if (deleteBtn) deleteBtn.style.display = canDelete ? 'inline-flex' : 'none';
        buildSideNav(name, data);
        navigateTo('info');
    }

    // ─────────────────────────────────────────────
    // NAVIGATION SECONDAIRE
    // ─────────────────────────────────────────────
    function buildSideNav(name, data) {
        var nav = document.getElementById('details-sidenav');
        var channels = data.channels || [];
        var h = '<span class="details-sidenav-label">Navigation</span>';
        h += '<button class="details-nav-item" id="nav-item-info" data-page="info">📋 Infos campagne</button>';
        if (channels.length > 0) {
            h += '<div class="details-nav-separator"></div>';
            h += '<span class="details-sidenav-label">Canaux</span>';
            channels.forEach(function(ch, idx) {
                var label = ch.deliverableName || ('Canal ' + (idx + 1));
                h += '<button class="details-nav-item" id="nav-item-' + idx + '" data-page="' + idx + '" title="' + security.escapeHtml(label) + '">📡 ' + security.escapeHtml(label) + '</button>';
            });
        }
        // Bilan : en dernier, après les onglets canal (cf. maquette validée).
        h += '<button class="details-nav-item" id="nav-item-bilan" data-page="bilan">📊 Bilan</button>';
        nav.innerHTML = h;
        nav.querySelectorAll('.details-nav-item').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var p = btn.getAttribute('data-page');
                navigateTo((p === 'info' || p === 'bilan') ? p : parseInt(p, 10));
            });
        });
    }

    function navigateTo(pageKey) {
        currentPage = pageKey;
        document.querySelectorAll('.details-nav-item').forEach(function(b) { b.classList.remove('active'); });
        var navId = (pageKey === 'info') ? 'nav-item-info' : ('nav-item-' + pageKey);
        var navBtn = document.getElementById(navId);
        if (navBtn) navBtn.classList.add('active');

        var panel = document.getElementById('details-panel');
        if (pageKey === 'info') {
            panel.innerHTML = renderInfoPage(currentCampaignName, currentCampaignData);
            setupGlobalEvents(currentCampaignName, currentCampaignData);
        } else if (pageKey === 'bilan') {
            panel.innerHTML = renderBilanPage();
            loadBilanPage(currentCampaignName);
        } else {
            var idx = pageKey;
            panel.innerHTML = renderChannelPage(idx, currentCampaignData);
            setupChannelPageEvents(idx);
            loadDepotForChannel(currentCampaignName, idx, currentCampaignData.channels[idx]);
        }
        panel.scrollTop = 0;
    }

    // Clic sur une étape de la timeline d'un canal → ouvre le canal et défile vers son bloc.
    // Les blocs de validation PO sont imbriqués dans la section de leur étape source ;
    // on cible donc l'ancre de cette section.
    var STEP_ANCHOR = {
        com_maquette:            'com-work-section',
        po_validation_maquette:  'com-work-section',
        com_juridique:           'com-juridique-section-',   // + index canal
        ebf_bat:                 'ebf-work-section',
        po_validation_bat:       'ebf-work-section',
        data_ciblage:            'data-work-section',
        po_validation_ciblage:   'data-work-section',
        data_lancement_test:     'data-testlaunch-section',
        ebf_test_prod:           'ebf-testprod-section',
        po_validation_test_prod: 'ebf-testprod-section',
        data_mise_en_prod:       'data-mep-section',
        ebf_mise_en_prod:        'ebf-mep-section-'           // + index canal
    };
    function stepAnchorId(stepId, ci) {
        var base = STEP_ANCHOR[stepId];
        if (!base) return null;
        return (stepId === 'com_juridique' || stepId === 'ebf_mise_en_prod') ? (base + ci) : base;
    }
    function gotoChannelStep(ci, stepId) {
        navigateTo(ci);
        var anchorId = stepAnchorId(stepId, ci);
        requestAnimationFrame(function() {
            var el = anchorId ? document.getElementById(anchorId) : null;
            if (!el) return;
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            el.classList.add('wf-flash');
            setTimeout(function() { el.classList.remove('wf-flash'); }, 1600);
        });
    }

    // Composition de l'équipe (Com/EBF/Data) + Co-PO (suppléance) : un seul
    // bloc, dans l'onglet Infos générales (déplacé depuis le haut du Workflow,
    // à la demande). Le Co-PO reste éditable ici pour le PO — mêmes ids
    // #btn-copo-toggle / #copo-form / #btn-copo-save / .copo-cb, wiring
    // inchangé dans setupGlobalEvents.
    function buildTeamInfoBlock(data) {
        var assignments = (data.workflow && data.workflow.assignments) || {};
        var currentUser = users && users.getCurrentUser && users.getCurrentUser();
        var teamParts = [];
        [['com', 'Com'], ['ebf', 'EBF'], ['data', 'Data']].forEach(function(t) {
            if (!isTeamRequired(data, t[1])) return;
            var disp = assigneesDisplay(assignments, t[0]);
            teamParts.push(t[1] + ' : ' + (disp || '<em style="color:var(--muted-2);font-style:italic;">en attente d\'affectation</em>'));
        });
        var showCoPo = currentUser && users.isCurrentUserPO(data);

        // Rôles que l'utilisateur courant peut modifier — un manager (de service,
        // général ou super-admin) pour n'importe quel rôle requis, ou un membre
        // déjà affecté pour SON propre rôle uniquement (cf. teamEditMode, sans
        // idx = portée campagne). Vide → pas de bouton d'ajout.
        var editableRoles = ['com', 'ebf', 'data'].filter(function(r) {
            return isTeamRequired(data, ROLE_LABELS_TEAM[r]) && teamEditMode(data, r);
        });
        if (!teamParts.length && !showCoPo && !editableRoles.length) return '';

        var html = '<div class="detail-section"><h3>👥 Équipe</h3>';
        if (teamParts.length) {
            html += '<div style="font-size:13px;"><strong>Composition :</strong> ' + teamParts.join(' &nbsp;|&nbsp; ') + '</div>';
        }
        // Ajout d'un membre à l'équipe (à tout moment, motif obligatoire, tracé
        // dans l'onglet Activité) — la personne sur la tâche ajoute à son propre
        // rôle, un manager à n'importe quel rôle qu'il gère.
        if (editableRoles.length) {
            html += '<div style="' + (teamParts.length ? 'margin-top:10px;' : '') + '">';
            html += '<button type="button" id="btn-team-add-toggle" style="background:none;border:1px solid var(--muted-2);border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;color:#555;">➕ Ajouter quelqu\'un à l\'équipe</button>';
            html += '</div>';
            html += '<div id="team-add-form" style="display:none;margin-top:10px;background:var(--line-2);border-radius:6px;padding:10px 12px;">';
            html += '<div style="font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5;">La personne ajoutée devient affectée sur toute la campagne. Le motif est obligatoire — l\'ajout est tracé dans l\'onglet Activité.</div>';
            html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">';
            if (editableRoles.length > 1) {
                html += '<select id="team-add-role" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-family:inherit;">';
                editableRoles.forEach(function(r) { html += '<option value="' + r + '">' + ROLE_LABELS_TEAM[r] + '</option>'; });
                html += '</select>';
            } else {
                html += '<input type="hidden" id="team-add-role" value="' + editableRoles[0] + '">';
                html += '<span style="font-size:12px;font-weight:700;padding:6px 4px;">' + ROLE_LABELS_TEAM[editableRoles[0]] + '</span>';
            }
            html += '<select id="team-add-person" style="flex:1;min-width:160px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-family:inherit;"></select>';
            html += '</div>';
            html += '<textarea id="team-add-motif" placeholder="Motif (obligatoire) — ex. congés, renfort ponctuel…" rows="2" style="width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:13px;resize:vertical;margin-bottom:8px;"></textarea>';
            html += '<button type="button" id="btn-team-add-save" style="background:var(--primary);color:#fff;border:none;border-radius:4px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:13px;">💾 Ajouter</button>';
            html += '</div>';
        }
        if (showCoPo) {
            var coPo = Array.isArray(data.coPo) ? data.coPo : [];
            html += '<div style="' + (teamParts.length ? 'margin-top:12px;padding-top:12px;border-top:1px solid var(--line);' : '') + 'font-size:13px;">';
            html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">';
            html += '<span><strong>Co-PO (suppléance) :</strong> ' + (coPo.length ? coPo.map(security.escapeHtml).join(', ') : '<em style="color:var(--muted-2);">aucun</em>') + '</span>';
            html += '<button id="btn-copo-toggle" style="background:none;border:1px solid var(--muted-2);border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;color:#555;">✏️ Gérer</button>';
            html += '</div>';
            html += '<div id="copo-form" style="display:none;margin-top:8px;">';
            html += '<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Un co-PO a les mêmes droits que vous sur cette campagne (validations, retours, test en prod…). Idéal pour vos congés.</div>';
            html += '<div style="max-height:130px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:8px;">';
            users.USERS.filter(function(u) { return u.name !== data.po && !u.inactive; }).forEach(function(u) {
                var ck = coPo.indexOf(u.name) !== -1 ? ' checked' : '';
                html += '<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;"><input type="checkbox" class="copo-cb" value="' + security.escapeHtml(u.name) + '"' + ck + '> ' + security.escapeHtml(u.name) + ' <span style="font-size:11px;color:var(--muted-2);">(' + security.escapeHtml(u.role || '') + ')</span></label>';
            });
            html += '</div>';
            html += '<button id="btn-copo-save" style="background:var(--primary);color:#fff;border:none;border-radius:4px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:13px;">💾 Enregistrer</button>';
            html += '</div>';
            html += '</div>';
        }
        html += '</div>';
        return html;
    }

    // Bandeau d'action sticky (haut de l'onglet Infos) : parmi tous les canaux,
    // l'étape actionnable (pending / revision_requested) qui attend depuis le
    // plus longtemps, avec un raccourci direct vers son bloc. Repose sur
    // workflow.getChannelStepDate (même horodatage que Pilotage ▸ Suivi de
    // campagne) — une étape sans date connue (antérieure à ce suivi) reste
    // signalée, juste sans « depuis Xj ».
    function buildStickyBanner(data) {
        if (!workflow || !data.workflow || workflow.isCompleted(data)) return '';
        var jur = workflow.juridiqueRequired(data);
        var channels = data.channels || [];
        var cs = (data.workflow && data.workflow.channelSteps) || {};
        var best = null;
        channels.forEach(function(ch, idx) {
            var ids = workflow.channelStepIds(data.requiredTeams, ch.content, jur);
            var steps = cs[idx] || {};
            for (var k = 0; k < ids.length; k++) {
                var id = ids[k];
                var status = steps[id] || 'locked';
                if (status === 'pending' || status === 'revision_requested') {
                    var iso = workflow.getChannelStepDate(data, idx, id);
                    var days = iso ? Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000)) : -1;
                    if (!best || days > best.days) {
                        var role = workflow.stepActor(id, ch.content);
                        var coPo = Array.isArray(data.coPo) ? data.coPo : [];
                        var names = (role === 'po') ? [data.po].concat(coPo).filter(Boolean) : workflow.channelAssignees(data, idx, role);
                        best = {
                            idx: idx, stepId: id, stepLabel: workflow.stepLabel(id),
                            canalLabel: ch.deliverableName || ('Canal ' + (idx + 1)),
                            revision: status === 'revision_requested', days: days,
                            names: names.length ? names : ['(non affecté)']
                        };
                    }
                    break; // une seule étape « courante » par canal
                }
            }
        });
        if (!best) return '';
        var sinceTxt = best.days < 0 ? '' : (' — ' + (best.days === 0 ? "depuis aujourd'hui" : ('depuis ' + best.days + ' j' + (best.days > 1 ? 's' : ''))));
        var text = (best.revision ? 'Révision demandée' : 'Étape bloquante') + ' : <strong>' + security.escapeHtml(best.stepLabel) + '</strong> (' + security.escapeHtml(best.canalLabel) + ')' + sinceTxt + ', à faire par <strong>' + security.escapeHtml(best.names.join(', ')) + '</strong>';
        return '<div class="sticky-banner">'
            + '<span class="sticky-banner-tag">' + (best.revision ? '🔄 Révision' : '📌 En attente') + '</span>'
            + '<span class="sticky-banner-text">' + text + '</span>'
            + '<button type="button" class="sticky-banner-cta" onclick="gotoChannelStep(' + best.idx + ', \'' + best.stepId + '\')">Voir l\'action →</button>'
            + '</div>';
    }

    // ─────────────────────────────────────────────
    // PAGE : INFOS CAMPAGNE
    // ─────────────────────────────────────────────
    function renderInfoPage(name, data) {
        // Workflow timeline + manager/PO actions (pleine largeur)
        var workflowHtml = '';
        if (workflow && data.workflow) {
            workflowHtml += buildWorkflowSection(name, data);
        }

        // Informations générales (carte principale)
        var infoGen = '<div class="detail-section"><h3>📋 Informations générales</h3><div class="detail-grid">';
        infoGen += '<div class="detail-item"><span class="detail-label">Nom</span><span class="detail-value">' + security.escapeHtml(name) + '</span></div>';
        infoGen += '<div class="detail-item"><span class="detail-label">PO</span><span class="detail-value">' + security.escapeHtml(data.po || '-') + '</span></div>';
        if (Array.isArray(data.coPo) && data.coPo.length) {
            infoGen += '<div class="detail-item"><span class="detail-label">Co-PO (suppléance)</span><span class="detail-value">' + security.escapeHtml(data.coPo.join(', ')) + '</span></div>';
        }
        infoGen += '<div class="detail-item"><span class="detail-label">Typologie</span><span class="detail-value">' + security.escapeHtml(data.typology || '-') + '</span></div>';
        infoGen += '<div class="detail-item"><span class="detail-label">Marché</span><span class="detail-value">' + security.escapeHtml(data.market || '-') + '</span></div>';
        infoGen += '<div class="detail-item"><span class="detail-label">Récurrence</span><span class="detail-value">' + security.escapeHtml(data.recurrence || '-') + '</span></div>';
        infoGen += '<div class="detail-item"><span class="detail-label">Date Envoi client</span><span class="detail-value">' + security.escapeHtml(data.launchDate || '-') + '</span></div>';
        infoGen += '<div class="detail-item"><span class="detail-label">Date de saisie</span><span class="detail-value">' + security.escapeHtml(data.instantiation || '-') + '</span></div>';
        infoGen += '</div>';
        if (data.description) {
            infoGen += '<div class="detail-item" style="margin-top:16px;"><span class="detail-label">Description</span><span class="detail-value" style="white-space:pre-wrap;line-height:1.55;">' + security.escapeHtml(data.description) + '</span></div>';
        }
        if (data.campagneLiee) {
            var linkedUrl = 'details.html?name=' + encodeURIComponent(data.campagneLiee);
            infoGen += '<div class="detail-item" style="margin-top:8px;"><span class="detail-label">Campagne liée</span><span class="detail-value"><a href="' + linkedUrl + '" style="color:var(--primary);">' + security.escapeHtml(data.campagneLiee) + ' →</a></span></div>';
        }
        infoGen += '</div>';

        // Petites cartes (segments / UB / produit / transfo) — côte à côte
        var smallCards = '';
        if (data.segments && data.segments.length > 0) {
            smallCards += '<div class="detail-section"><h3>👥 Segments (' + data.segments.length + ')</h3><div class="tag-list">';
            data.segments.forEach(function(s) { smallCards += '<span class="tag">' + security.escapeHtml(s) + '</span>'; });
            smallCards += '</div></div>';
        }
        if (data.ubs && data.ubs.length > 0) {
            smallCards += '<div class="detail-section"><h3>🎯 Univers de besoin (' + data.ubs.length + ')</h3><div class="tag-list">';
            data.ubs.forEach(function(u) { smallCards += '<span class="tag">' + security.escapeHtml(u) + '</span>'; });
            smallCards += '</div></div>';
        }
        if (data.cibleProspect) {
            smallCards += '<div class="detail-section"><h3>🧲 Prospects</h3><div class="detail-grid">';
            smallCards += '<div class="detail-item"><span class="detail-label">Cible prospects</span><span class="detail-value">Oui</span></div>';
            if (data.prospectSource) smallCards += '<div class="detail-item"><span class="detail-label">Source</span><span class="detail-value">' + security.escapeHtml(data.prospectSource) + '</span></div>';
            smallCards += '</div></div>';
        }
        // Produits ciblés : nouveau champ multi (targetProducts) avec repli sur l'ancien (targetProduct)
        var _detProds = Array.isArray(data.targetProducts) ? data.targetProducts : (data.targetProduct ? [data.targetProduct] : []);
        if (_detProds.length || data.productUrl || data.offerValidityDate || data.offrePromo || data.parcoursSelfcare || data.parcoursSimulateur) {
            smallCards += '<div class="detail-section"><h3>🛍️ Produit</h3><div class="detail-grid">';
            if (_detProds.length) smallCards += '<div class="detail-item"><span class="detail-label">Produits ciblés</span><span class="detail-value">' + security.escapeHtml(_detProds.join(', ')) + '</span></div>';
            if (data.productUrl)    smallCards += '<div class="detail-item"><span class="detail-label">URL Fiche Produit</span><span class="detail-value"><a href="' + security.escapeHtml(data.productUrl) + '" target="_blank">' + security.escapeHtml(data.productUrl) + '</a></span></div>';
            if (data.offrePromo) smallCards += '<div class="detail-item"><span class="detail-label">Offre promotionnelle</span><span class="detail-value">' + security.escapeHtml(data.offrePromo) + '</span></div>';
            if (data.offerValidityDate) smallCards += '<div class="detail-item"><span class="detail-label">Date validité offre</span><span class="detail-value">' + security.escapeHtml(data.offerValidityDate) + '</span></div>';
            if (data.parcoursSelfcare) smallCards += '<div class="detail-item"><span class="detail-label">Parcours selfcare</span><span class="detail-value">' + security.escapeHtml(data.parcoursSelfcare) + '</span></div>';
            if (data.parcoursSimulateur) smallCards += '<div class="detail-item"><span class="detail-label">Parcours simulateur</span><span class="detail-value">' + security.escapeHtml(data.parcoursSimulateur) + '</span></div>';
            smallCards += '</div></div>';
        }
        if (data.transfo) {
            smallCards += '<div class="detail-section"><h3>🔄 Transformation</h3><div class="detail-grid">';
            smallCards += '<div class="detail-item"><span class="detail-label">Transfo</span><span class="detail-value">' + security.escapeHtml(data.transfo) + '</span></div>';
            if (data.lotNumber) smallCards += '<div class="detail-item"><span class="detail-label">N° Lot</span><span class="detail-value">' + security.escapeHtml(data.lotNumber) + '</span></div>';
            smallCards += '</div></div>';
        }
        // Synthèse des canaux : supprimée (chaque canal a déjà son propre onglet
        // avec son statut dans la navigation latérale, cette liste faisait doublon).

        // Section juridique (colonne latérale) — vue d'ensemble en lecture seule.
        // La validation/refus se fait désormais étape par étape dans le workflow,
        // par la Com, sur chaque canal (étape ⚖️ Validation juridique).
        var jurHtml = '';
        if (data.juridique && data.juridique.required) {
            var jur = data.juridique;
            var jcs = (data.workflow && data.workflow.channelSteps) || [];
            var jurTotal = 0, jurDone = 0;
            for (var ji = 0; ji < jcs.length; ji++) {
                var st = jcs[ji] && jcs[ji].com_juridique;
                if (st === undefined || st === 'na') continue;
                jurTotal++;
                if (st === 'validated' || st === 'completed') jurDone++;
            }
            var jurAllDone = jurTotal > 0 && jurDone === jurTotal;
            jurHtml += '<div class="detail-section" style="border-left-color:' + (jurAllDone ? 'var(--primary)' : 'var(--amber)') + ';">';
            jurHtml += '<h3>⚖️ Validation juridique et conformité</h3>';
            jurHtml += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">';
            jurHtml += '<span style="background:' + (jurAllDone ? 'var(--green-50)' : 'var(--amber-50)') + ';color:' + (jurAllDone ? 'var(--primary-hover)' : '#d97706') + ';border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;">' + (jurAllDone ? '✅ Validée sur tous les canaux' : ('⏳ ' + jurDone + '/' + jurTotal + ' canal(aux) validé(s)')) + '</span>';
            jurHtml += '</div>';
            jurHtml += '<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Validation requise par la Com sur chaque canal, après validation de la maquette par le PO et avant transmission à l\'EBF.</div>';
            if (jur.comment) jurHtml += '<div style="font-size:13px;color:var(--gray-700);background:var(--line-2);border-radius:8px;padding:8px 12px;">' + security.escapeHtml(jur.comment) + '</div>';
            jurHtml += '</div>';
        }

        // Bandeau d'action sticky (haut de page, cf. buildStickyBanner ci-dessus).
        var stickyHtml = buildStickyBanner(data);

        // Bloc unifié : Infos générales / Documents / Activité en sous-onglets
        // (le Workflow reste seul, au-dessus, inchangé — cf. maquette validée).
        var docsPanel = '<div id="documents-loading" style="color:var(--muted-2);font-size:13px;">Chargement...</div>'
            + '<div id="documents-content" style="display:none;"></div>';

        var actPanel = '<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:8px;">'
            + '<select id="activity-filter" style="font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;">'
            + '<option value="">Tout</option><option value="workflow">Workflow</option><option value="document">Documents</option>'
            + '<option value="statut">Statut</option><option value="campagne">Campagne</option><option value="affectation">Affectation</option></select></div>'
            + '<div id="activity-loading" style="color:var(--muted-2);font-size:13px;">Chargement...</div>'
            + '<div id="activity-content" style="display:none;"></div>';

        var tabsHtml = '<div class="detail-section" id="info-subtabs-card">'
            + '<div class="subtab-strip" role="tablist">'
            + '<button type="button" class="subtab-btn active" data-subtab="info">📋 Infos générales</button>'
            + '<button type="button" class="subtab-btn" data-subtab="docs">📁 Documents</button>'
            + '<button type="button" class="subtab-btn" data-subtab="act">🕒 Activité</button>'
            + '</div>'
            + '<div class="subtab-panel active" data-subpanel="info">' + infoGen + buildTeamInfoBlock(data) + smallCards + jurHtml + '</div>'
            + '<div class="subtab-panel" data-subpanel="docs">' + docsPanel + '</div>'
            + '<div class="subtab-panel" data-subpanel="act">' + actPanel + '</div>'
            + '</div>';

        // Discussion : bulle flottante (bas droite) → panneau façon Facebook au clic
        // (au lieu d'une carte toujours visible). Même mécanique de chargement/
        // publication que par le passé (loadDiscussion / renderDiscussionMessages),
        // seule la présentation change.
        var chatUser = users && users.getCurrentUser && users.getCurrentUser();
        var chatInitials = '';
        if (chatUser && chatUser.name) {
            chatInitials = chatUser.name.trim().split(/\s+/).map(function(p) { return p[0]; }).join('').toUpperCase().slice(0, 2);
        }
        var chatHtml = '<button type="button" class="chat-bubble-btn" id="chat-bubble-btn" aria-label="Ouvrir la discussion" title="Discussion">'
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>'
            + '<span class="chat-bubble-badge" id="chat-bubble-badge"></span>'
            + '</button>'
            + '<div class="chat-panel" id="chat-panel">'
            + '<div class="chat-panel-head"><span>💬 Discussion</span><button type="button" class="chat-panel-close" id="chat-panel-close" aria-label="Fermer">✕</button></div>'
            + '<div class="chat-panel-body">'
            + '<div id="discussion-loading" style="color:var(--muted-2);font-size:13px;padding:8px 0;">Chargement...</div>'
            + '<div id="discussion-list" class="discussion-list" style="display:none;"></div>'
            + '<div id="discussion-form" class="discussion-form" style="display:none;">'
            + '<div class="discussion-msg-avatar">' + security.escapeHtml(chatInitials) + '</div>'
            + '<textarea id="discussion-input" placeholder="Écrire un commentaire..." rows="1"></textarea>'
            + '<div class="discussion-form-row"><button id="discussion-submit" title="Publier">➤</button></div>'
            + '</div>'
            + '<div id="discussion-no-user" style="display:none;color:var(--muted-2);font-size:13px;padding:8px 0;">Identifiez-vous pour participer à la discussion.</div>'
            + '</div>'
            + '</div>';

        return stickyHtml + workflowHtml + tabsHtml + chatHtml;
    }

    // ─────────────────────────────────────────────
    // HELPERS : assignations multi-membres (item 20)
    // assignments[role] peut être une string (legacy) ou un tableau de noms
    // ─────────────────────────────────────────────
    function getAssignees(assignments, role) {
        var val = (assignments || {})[role];
        if (!val) return [];
        return Array.isArray(val) ? val : [val];
    }
    function assigneesDisplay(assignments, role) {
        var arr = getAssignees(assignments, role);
        return arr.length ? arr.map(function(n){ return security.escapeHtml(n); }).join(', ') : '';
    }
    // Détermine qui peut modifier l'équipe affectée à un rôle, et dans quelle mesure :
    //  'full' : un manager de ce service, le manager général (marketing) ou un
    //           super-admin → ajout / retrait libre de toute l'équipe.
    //  'add'  : un membre lui-même affecté à ce rôle → peut ajouter un renfort de
    //           son équipe (congés / remplacement) et se retirer, sans toucher aux
    //           autres personnes déjà affectées.
    //  null   : lecture seule.
    function teamEditMode(data, role, idx) {
        var u = users && users.getCurrentUser();
        if (!u) return null;
        if (u.isSuperAdmin) return 'full';
        if (u.isManager && (u.role === 'marketing' || u.role === role)) return 'full';
        // Membre affecté (équipe campagne OU renfort de ce canal) → mode renfort.
        var eff = (idx !== undefined && workflow.channelAssignees)
            ? workflow.channelAssignees(data, idx, role)
            : getAssignees(data.workflow.assignments, role);
        if (eff.indexOf(u.name) !== -1) return 'add';
        return null;
    }

    // ── Retour à une étape antérieure (L2 #2/#12/#18) ──────────────────────
    var _REOPEN_LABELS = {
        com_maquette: 'Maquette Com', com_juridique: 'Validation juridique',
        ebf_bat: 'Réalisation BAT', data_ciblage: 'Ciblage Data',
        data_lancement_test: 'Lancement test', ebf_test_prod: 'Test en production',
        data_mise_en_prod: 'Mise en production'
    };
    function _stepRole(stepId) {
        if (/^com_/.test(stepId)) return 'com';
        if (/^ebf_/.test(stepId)) return 'ebf';
        if (/^data_/.test(stepId)) return 'data';
        return null;
    }
    // Date de validation mémorisée d'une étape PO (M8) → ' le jj/mm/aa hh:mm' ou ''.
    function _valDateSuffix(data, idx, poStepId) {
        var cd = data.workflow && data.workflow.channelDates;
        var v = cd && cd[idx] && cd[idx][poStepId];
        return v ? (' le ' + v) : '';
    }
    // Horodatage court partagé (jj/mm/aa hh:mm) — utilisé pour tracer qui a fait
    // quoi et quand (validations, demandes de modification…).
    function _nowStamp() {
        return new Date().toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
    }
    function _currentUserName() {
        return (users && users.getCurrentUser() && users.getCurrentUser().name) || '';
    }
    // Qui peut renvoyer un canal à une étape : le PO (toute étape franchie), un
    // super-admin / manager général, ou l'acteur affecté sur SA propre étape.
    // L'étape doit avoir été franchie (déposée / validée).
    function canReopenStep(data, idx, stepId) {
        var u = users && users.getCurrentUser();
        if (!u) return false;
        var cs = (data.workflow.channelSteps || {})[idx] || {};
        if (['submitted', 'validated', 'completed'].indexOf(cs[stepId]) === -1) return false;
        if (u.isSuperAdmin) return true;
        if (users.isCurrentUserPO && users.isCurrentUserPO(data)) return true;
        if (u.role === 'marketing' && u.isManager) return true;
        var role = _stepRole(stepId);
        if (role && u.role === role && getAssignees(data.workflow.assignments, role).indexOf(u.name) !== -1) return true;
        return false;
    }
    // Bouton « Revenir à cette étape » + formulaire de motif (obligatoire).
    function buildReopenControl(stepId, idx, data) {
        if (!canReopenStep(data, idx, stepId)) return '';
        var lbl = _REOPEN_LABELS[stepId] || stepId;
        var uid = stepId + '-' + idx;
        var h = '<div style="margin:-4px 0 14px;">';
        h += '<button type="button" class="btn-reopen-step" data-step="' + stepId + '" data-ch="' + idx + '" style="background:none;border:1px solid var(--amber);color:#9a6b00;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;">↩️ Revenir à l\'étape « ' + security.escapeHtml(lbl) + ' »</button>';
        h += '<div id="reopen-form-' + uid + '" style="display:none;margin-top:8px;background:var(--amber-50,#fdf3e2);border:1px solid var(--amber);border-radius:8px;padding:10px 12px;">';
        h += '<div style="font-size:12px;color:#7a5a00;margin-bottom:6px;line-height:1.5;">⚠️ Cette étape et les étapes suivantes qui en dépendent seront à refaire. Motif <strong>obligatoire</strong> :</div>';
        h += buildRichEditor('reopen-motif-' + uid, 'Décrivez pourquoi vous revenez à cette étape…');
        h += '<button type="button" class="btn-reopen-confirm" data-step="' + stepId + '" data-ch="' + idx + '" style="margin-top:8px;background:var(--amber);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:13px;">↩️ Renvoyer à cette étape</button>';
        h += '</div></div>';
        return h;
    }

    // Vérifie si une équipe est requise (délègue au module workflow)
    function isTeamRequired(data, team) {
        return workflow.isTeamRequired(data.requiredTeams, team);
    }

    // Libellés des rôles d'équipe (ajout de membre, cf. buildTeamInfoBlock).
    var ROLE_LABELS_TEAM = { com: 'Com', ebf: 'EBF', data: 'Data' };

    // ─────────────────────────────────────────────
    // PAGE : CANAL
    // ─────────────────────────────────────────────
    function renderChannelPage(idx, data) {
        var ch = (data.channels || [])[idx];
        if (!ch) return '<p class="error-message">Canal introuvable.</p>';

        // Étapes de CE canal (v2 : channelSteps par canal)
        var cs          = (data.workflow && data.workflow.channelSteps && data.workflow.channelSteps[idx]) || {};
        var assignments = data.workflow ? data.workflow.assignments : {};
        var currentUser = users && users.getCurrentUser();
        var html = '';

        var isPO = currentUser && currentUser.name === data.po;

        // En-tête canal
        html += '<div class="detail-section">';
        html += '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px;">';
        html += '<h3 style="margin:0;">📡 ' + security.escapeHtml(ch.deliverableName || ('Canal ' + (idx + 1))) + '</h3>';
        if (isPO) {
            html += '<button onclick="deleteChannel(' + idx + ')" style="background:none;border:1px solid var(--red);color:var(--red);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;">🗑️ Supprimer ce canal</button>';
        }
        html += '</div>';
        html += '<div class="detail-grid">';
        html += '<div class="detail-item"><span class="detail-label">Canal contenu</span><span class="detail-value">' + security.escapeHtml(ch.content || '-') + '</span></div>';
        html += '<div class="detail-item"><span class="detail-label">Date de réception client</span><span class="detail-value">' + security.escapeHtml(ch.sendDate || '-') + '</span></div>';
        html += '<div class="detail-item"><span class="detail-label">Type de Com</span><span class="detail-value">' + security.escapeHtml(ch.comType || '-') + '</span></div>';
        // Univers de besoin effectif du canal : propre au livrable s'il est défini, sinon celui de la campagne.
        var _chUbs = (ch.ubs && ch.ubs.length) ? ch.ubs : (data.ubs || []);
        if (_chUbs.length) html += '<div class="detail-item"><span class="detail-label">Univers de besoin</span><span class="detail-value">' + security.escapeHtml(_chUbs.join(', ')) + (ch.ubs && ch.ubs.length ? '' : ' <em style="color:var(--muted-2);font-size:11px;">(campagne)</em>') + '</span></div>';
        html += '<div class="detail-item"><span class="detail-label">Critère ciblage</span><span class="detail-value">' + security.escapeHtml(ch.targetingCriteria || '-') + '</span></div>';
        if (ch.emailObject) html += '<div class="detail-item"><span class="detail-label">Objet de l\'email</span><span class="detail-value">' + security.escapeHtml(ch.emailObject) + '</span></div>';
        if (ch.volumeCible) html += '<div class="detail-item"><span class="detail-label">Volume cible</span><span class="detail-value">' + ch.volumeCible.toLocaleString('fr-FR') + (ch.volumeCible > (window.ImpulsionMarketing.config.APP_SETTINGS.volumeAlertThreshold || 100000) ? ' ⚠️' : '') + '</span></div>';
        if (ch.comTypology) html += '<div class="detail-item"><span class="detail-label">Typologie Com</span><span class="detail-value">' + security.escapeHtml(ch.comTypology) + '</span></div>';
        if (ch.urlTicTac)   html += '<div class="detail-item"><span class="detail-label">URL TicTac</span><span class="detail-value"><a href="' + security.escapeHtml(ch.urlTicTac) + '" target="_blank">Ouvrir</a></span></div>';
        if (ch.urlLccx)     html += '<div class="detail-item"><span class="detail-label">Lien LCCX</span><span class="detail-value"><a href="' + security.escapeHtml(ch.urlLccx) + '" target="_blank">Ouvrir</a></span></div>';
        var comStoreUrls = (ch.urlsComStore && ch.urlsComStore.length) ? ch.urlsComStore : (ch.urlComStore ? [ch.urlComStore] : []);
        if (comStoreUrls.length > 0) {
            html += '<div class="detail-item"><span class="detail-label">URL ComStore</span><span class="detail-value">';
            comStoreUrls.forEach(function(u, ui) {
                html += '<a href="' + security.escapeHtml(u) + '" target="_blank" style="display:block;">Ouvrir' + (comStoreUrls.length > 1 ? ' ' + (ui + 1) : '') + '</a>';
            });
            html += '</span></div>';
        }
        // Codes saisis dans les dépôts (EBF/Data) puis recopiés sur le canal :
        // on les restitue aussi dans l'en-tête général du canal.
        if (ch.codeCom)    html += '<div class="detail-item"><span class="detail-label">Code Com</span><span class="detail-value">' + security.escapeHtml(ch.codeCom) + '</span></div>';
        if (ch.refParacom) html += '<div class="detail-item"><span class="detail-label">Réf Paracom</span><span class="detail-value">' + security.escapeHtml(ch.refParacom) + '</span></div>';
        if (ch.codeProjet) html += '<div class="detail-item"><span class="detail-label">Code Projet</span><span class="detail-value">' + security.escapeHtml(ch.codeProjet) + '</span></div>';
        if (ch.codeAction) html += '<div class="detail-item"><span class="detail-label">Code Action</span><span class="detail-value">' + security.escapeHtml(ch.codeAction) + '</span></div>';
        if (ch.codeMK)     html += '<div class="detail-item"><span class="detail-label">Code MK</span><span class="detail-value">' + security.escapeHtml(ch.codeMK) + '</span></div>';
        html += '</div></div>';

        var _isSuperAdmin  = currentUser && currentUser.isSuperAdmin;
        // Assignés effectifs de CE canal = équipe campagne + renfort du canal.
        var isAssignedCom  = _isSuperAdmin || (currentUser && workflow.channelAssignees(data, idx, 'com').indexOf(currentUser.name)  !== -1);
        var isAssignedEbf  = _isSuperAdmin || (currentUser && workflow.channelAssignees(data, idx, 'ebf').indexOf(currentUser.name)  !== -1);
        var isAssignedData = _isSuperAdmin || (currentUser && workflow.channelAssignees(data, idx, 'data').indexOf(currentUser.name) !== -1);
        // Autorisation d'agir sur une étape donnée, acteur résolu PAR CANAL
        // (surcharge admin éventuelle — Administration ▸ Workflow, ex. la Com
        // peut déposer le test en prod pour le canal Courrier).
        function isAssignedForStep(stepId) {
            var actor = workflow.stepActor(stepId, ch.content);
            if (actor === 'po')   return _isSuperAdmin || (users && users.isCurrentUserPO(data));
            if (actor === 'com')  return isAssignedCom;
            if (actor === 'ebf')  return isAssignedEbf;
            if (actor === 'data') return isAssignedData;
            return false;
        }

        // Étapes actives pour CE canal : source unique (moteur workflow), pilotée
        // par les équipes requises, le juridique et l'applicabilité par canal
        // (Administration ▸ Workflow) — remplace l'ancien flag isLP en dur, qui
        // ne gérait qu'un seul canal spécial. Élimine toute divergence entre la
        // page et le moteur (recalcChannelUnlocks/isChannelCompleted en découlent).
        var jur = !!(data.juridique && data.juridique.required);
        var activeStepIds = workflow.channelStepIds(data.requiredTeams, ch.content, jur);
        function stepActive(id) { return activeStepIds.indexOf(id) !== -1; }

        // Zone 1 : Maquette Com
        if (stepActive('com_maquette')) {
            var comActive = cs.com_maquette === 'pending' || cs.com_maquette === 'revision_requested';
            html += buildComChannelSection(data, ch, idx, cs, isAssignedForStep('com_maquette') && comActive);
            html += buildReopenControl('com_maquette', idx, data);
        }

        // Zone 1.5 : Validation juridique Com — visible si applicable et déverrouillée
        if (stepActive('com_juridique') && cs.com_juridique && cs.com_juridique !== 'locked') {
            var jurEditable = isAssignedForStep('com_juridique') && cs.com_juridique === 'pending';
            html += buildJuridiqueChannelSection(data, ch, idx, cs, jurEditable);
            html += buildReopenControl('com_juridique', idx, data);
        }

        // Zone 2 : BAT EBF
        if (stepActive('ebf_bat')) {
            var ebfBatActive = cs.ebf_bat === 'pending' || cs.ebf_bat === 'revision_requested';
            html += buildEbfBatChannelSection(data, ch, idx, cs, isAssignedForStep('ebf_bat') && ebfBatActive);
            html += buildReopenControl('ebf_bat', idx, data);
        }

        // Zone 3 : Ciblage Data
        if (stepActive('data_ciblage')) {
            var dataActive = cs.data_ciblage === 'pending' || cs.data_ciblage === 'revision_requested';
            html += buildDataChannelSection(data, ch, idx, cs, 'data_ciblage', 'Ciblage Data', isAssignedForStep('data_ciblage') && dataActive);
            html += buildReopenControl('data_ciblage', idx, data);
        }

        // Zone 4 : Lancement test
        if (stepActive('data_lancement_test') && cs.data_lancement_test !== 'locked') {
            var ltActive = cs.data_lancement_test === 'pending' || cs.data_lancement_test === 'revision_requested';
            html += buildDataLancementTestSection(data, ch, idx, cs, isAssignedForStep('data_lancement_test') && ltActive);
            html += buildReopenControl('data_lancement_test', idx, data);
        }

        // Zone 5 : Test en prod — déposé par l'acteur résolu pour ce canal (EBF par
        // défaut, surchargeable en admin — ex. Com pour le Courrier) OU un
        // destinataire du test sélectionné à l'étape « Lancement test » ; validé
        // séparément par le PO (M21 — comme le BAT).
        if (stepActive('ebf_test_prod')) {
            var ebfTpActive = cs.ebf_test_prod === 'pending' || cs.ebf_test_prod === 'revision_requested';
            var _isTestReceiver = currentUser && (ch.testReceivers || []).indexOf(currentUser.name) !== -1;
            html += buildEbfTestProdChannelSection(data, ch, idx, cs, (isAssignedForStep('ebf_test_prod') || _isTestReceiver) && ebfTpActive);
            html += buildReopenControl('ebf_test_prod', idx, data);
        }

        // Zone 6 : MEP Data
        if (stepActive('data_mise_en_prod') && cs.data_mise_en_prod !== 'locked') {
            var mepActive = cs.data_mise_en_prod === 'pending';
            html += buildDataMepSection(data, ch, idx, cs, isAssignedForStep('data_mise_en_prod') && mepActive);
        }

        // Zone 6 bis : MEP EBF (ex. flux type LP — piloté par la config du canal)
        if (stepActive('ebf_mise_en_prod') && cs.ebf_mise_en_prod !== 'locked') {
            var ebfMepActive = cs.ebf_mise_en_prod === 'pending';
            html += buildEbfMepSection(data, ch, idx, cs, isAssignedForStep('ebf_mise_en_prod') && ebfMepActive);
        }

        // Card historique des demandes de modification (M16) — en bas du livrable.
        html += buildRevisionHistoryCard(data, idx);

        return html;
    }

    // Historique de toutes les demandes de modification faites sur ce canal :
    // étape, demandeur, date/heure, description — avec un compteur d'allers-retours.
    function buildRevisionHistoryCard(data, idx) {
        var log = (workflow.getChannelRevisionLog ? workflow.getChannelRevisionLog(data, idx) : []) || [];
        if (!log.length) return '';
        var h = '<div class="detail-section" id="revision-history-' + idx + '">';
        h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;">';
        h += '<h3 style="margin:0;">🔁 Historique des demandes de modification</h3>';
        h += '<span style="font-size:12px;font-weight:700;background:var(--amber-50);color:#9a6b00;border-radius:999px;padding:4px 12px;">' + log.length + ' aller' + (log.length > 1 ? 's' : '') + '-retour' + (log.length > 1 ? 's' : '') + '</span>';
        h += '</div>';
        h += '<div style="display:flex;flex-direction:column;gap:10px;">';
        // Plus récent en premier.
        log.slice().reverse().forEach(function(entry) {
            h += '<div style="background:var(--line-2);border-radius:10px;padding:10px 14px;">';
            h += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;font-size:12px;">';
            h += '<span style="font-weight:700;color:var(--ink);">' + security.escapeHtml(_REOPEN_LABELS[entry.stepId] || entry.stepId) + '</span>';
            if (entry.author) h += '<span style="color:var(--muted);">· demandé par <strong>' + security.escapeHtml(entry.author) + '</strong></span>';
            if (entry.date) h += '<span style="color:var(--muted-2);">· ' + security.escapeHtml(entry.date) + '</span>';
            h += '</div>';
            if (entry.comment) h += '<div style="font-size:13px;color:var(--gray-700);white-space:pre-wrap;word-break:break-word;">' + sanitizeRichHtml(entry.comment) + '</div>';
            h += '</div>';
        });
        h += '</div></div>';
        return h;
    }

    // ─────────────────────────────────────────────
    // BUILDERS PAR CANAL (sans accordéon)
    // ─────────────────────────────────────────────

        h += '</h3>';
        if (stepStatus === 'locked') {
            h += '<p style="color:var(--muted-2);font-size:13px;font-style:italic;margin:4px 0 0;">🔒 En attente de l\'affectation des équipes.</p>';

            // DEFAULT_FIELDS['com_maquette']). Le nombre d'images continue de piloter
            // la liste d'URL dynamique (updateComImageUrls, hors périmètre du moteur
            // générique — pas de type « liste » adapté à un compteur externe) via le
            // même id DOM 'com-numimages-<idx>', inchangé par la migration.
            h += customFieldsSectionHtml('com_maquette', ch, { 'com-numimages-': 0 }, { idSuffix: idx });

            h += '</div>';
            h += '<div class="actor-submit-row">';
            h += '<button type="button" class="btn-actor-save btn-save-com" data-ch="' + idx + '">💾 Enregistrer</button>';
            h += '<button type="button" class="btn-actor-submit btn-submit-canal-com" data-ch="' + idx + '">📤 Soumettre ce canal</button>';
            h += '</div>';
        }
        // Bloc validation PO par canal (v2 : channelSteps — plus besoin de channelValidations)
        var isPO = users && users.isCurrentUserPO(data);
        if (isPO && cs.po_validation_maquette === 'pending') {
            h += buildPoValidationBlock('po_validation_maquette', 'com_maquette', true, true, idx, null);
        }
        // Dates de dépôt / validation (readonly)
        var chDates = data.workflow.channelDates && data.workflow.channelDates[idx];
        if (chDates && (chDates.depotMaquetteDate || chDates.validationMaquetteDate)) {
            h += '<div class="depot-readonly-grid" style="margin-top:8px;">';
            if (chDates.depotMaquetteDate) h += '<div class="depot-readonly-item"><strong>Date dépôt maquette</strong>' + security.escapeHtml(chDates.depotMaquetteDate) + '</div>';
            if (chDates.validationMaquetteDate) h += '<div class="depot-readonly-item"><strong>Date validation maquette</strong>' + security.escapeHtml(chDates.validationMaquetteDate) + '</div>';
            h += '</div>';
        }
        h += '</div>';
        return h;
    }

    // Zone 1.5 — Validation juridique et conformité (par la Com, par canal)

        } else {

    }

    function buildEbfBatChannelSection(data, ch, idx, cs, editable) {

        else if (stepStatus === 'submitted') h += ' <span style="font-size:11px;background:var(--blue-50);color:var(--blue);border-radius:4px;padding:2px 8px;margin-left:8px;font-weight:700;text-transform:none;letter-spacing:0;">En attente de validation</span>';

    function buildEbfTestProdChannelSection(data, ch, idx, cs, editable) {
