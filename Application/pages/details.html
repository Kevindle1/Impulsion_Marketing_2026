    // ── Bloc réaffectation pour les managers de service (items 16 & 17) ──
    // role             : 'com' | 'ebf' | 'data'
    // teamUsers        : liste des utilisateurs de ce rôle
    // currentAssignees : tableau de noms (peut être vide ou string legacy)
    // mode : 'full' (manager → ajout/retrait libre) | 'add' (membre affecté →
    // ajoute un renfort et peut se retirer, sans toucher aux autres).
    // Renforts propres à un canal (channelAssignments), en tableau.
    function _channelExtra(data, role, idx) {
        var ca = data.workflow && data.workflow.channelAssignments;
        if (ca && ca[idx] && ca[idx][role]) return Array.isArray(ca[idx][role]) ? ca[idx][role] : [ca[idx][role]];
        return [];
    }
    // Bloc de gestion d'équipe d'un canal : équipe de base (campagne, éditable par
    // les managers) + renfort propre à CE canal (ajout ciblé sans propagation).
    // mode : 'full' (managers → base + renfort) | 'add' (membre → renfort de ce canal).
    function buildReassignBlock(role, teamUsers, data, idx, mode) {
        mode = mode || 'full';
        var restricted = (mode === 'add');
        var selfName = (users && users.getCurrentUser() || {}).name || '';
        var labels = { com: 'Com', ebf: 'EBF', data: 'Data' };
        var roleLbl = labels[role] || role;
        var base  = getAssignees(data.workflow.assignments, role);
        var extra = _channelExtra(data, role, idx);
        var eff   = base.concat(extra.filter(function(n) { return base.indexOf(n) === -1; }));
        var uid   = role + '-' + idx;
        var h = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">';
        h += '<span style="font-size:13px;color:var(--muted);">' + roleLbl + ' assigné(s) : <strong>' + (eff.length ? eff.map(security.escapeHtml).join(', ') : 'non assigné') + '</strong></span>';
        h += '<button class="btn-team-reassign" data-role="' + role + '" data-ch="' + idx + '" style="background:none;border:1px solid var(--muted-2);border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;color:#555;">👥 Gérer l\'équipe</button>';
        h += '</div>';
        h += '<div id="reassign-form-' + uid + '" style="display:none;background:var(--line-2);border-radius:6px;padding:10px 12px;margin-bottom:12px;">';
        // Partie 1 : équipe de la campagne (managers uniquement)
        if (!restricted) {
            h += '<div style="font-size:11px;font-weight:700;color:var(--gray-700);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;">Équipe de la campagne <span style="font-weight:400;text-transform:none;">(tous les canaux)</span></div>';
            h += '<div style="max-height:110px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:10px;">';
            teamUsers.forEach(function(u) {
                var checked = base.indexOf(u.name) !== -1 ? ' checked' : '';
                h += '<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;"><input type="checkbox" class="reassign-cb-camp-' + uid + '" value="' + security.escapeHtml(u.name) + '"' + checked + '> ' + security.escapeHtml(u.name) + '</label>';
            });
            h += '</div>';
        }
        // Partie 2 : renfort sur CE canal
        h += '<div style="font-size:11px;font-weight:700;color:var(--gray-700);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;">Renfort sur ce canal <span style="font-weight:400;text-transform:none;">(uniquement)</span></div>';
        if (restricted) h += '<div style="font-size:11px;color:var(--muted);margin-bottom:6px;line-height:1.5;">Ajoutez un renfort de votre équipe (congés, remplacement) sur ce canal. Vous pouvez vous retirer. Les autres renforts ne sont modifiables que par un manager.</div>';
        h += '<div style="max-height:110px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:8px;">';
        teamUsers.forEach(function(u) {
            var inBase  = base.indexOf(u.name) !== -1;
            var inExtra = extra.indexOf(u.name) !== -1;
            var checked = inExtra ? ' checked' : '';
            // Déjà dans l'équipe campagne → présent sur tous les canaux, renfort inutile.
            var locked = inBase || (restricted && inExtra && u.name !== selfName);
            var dis = locked ? ' disabled' : '';
            h += '<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:' + (locked ? 'not-allowed' : 'pointer') + ';' + (locked ? 'opacity:0.6;' : '') + '"><input type="checkbox" class="reassign-cb-ch-' + uid + '" value="' + security.escapeHtml(u.name) + '"' + checked + dis + '> ' + security.escapeHtml(u.name) + (inBase ? ' <span style="font-size:11px;color:var(--muted-2);">(équipe campagne)</span>' : (u.name === selfName ? ' <span style="font-size:11px;color:var(--muted-2);">(moi)</span>' : '')) + '</label>';
        });
        h += '</div>';
        h += '<button class="btn-team-reassign-save" data-role="' + role + '" data-ch="' + idx + '" data-mode="' + mode + '" style="background:var(--primary);color:#fff;border:none;border-radius:4px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:13px;">💾 Enregistrer</button>';
        h += '</div>';
        return h;
    }

    // channelIdx : index du canal (pour validation par canal)
    // channelVal : état de validation de ce canal ('validated'|'revision_requested'|null)
    function buildPoValidationBlock(poStepId, sourceStepId, canRevise, needsImage, channelIdx, channelVal) {
        // Si ce canal est déjà validé → afficher un badge vert
        if (channelVal === 'validated') {
            return '<div style="background:var(--green-50);border:1px solid var(--green-600);border-radius:8px;padding:10px 14px;margin-top:12px;font-size:13px;font-weight:600;color:var(--green-600);">✅ Ce canal a été validé</div>';
        }
        var chAttr = (channelIdx !== undefined) ? (' data-ch="' + channelIdx + '"') : '';
        var uid = poStepId + (channelIdx !== undefined ? ('-' + channelIdx) : '');
        var ch = (channelIdx !== undefined && currentCampaignData.channels) ? currentCampaignData.channels[channelIdx] : null;
        var h = '<div style="background:var(--blue-50);border:1px solid var(--blue);border-radius:8px;padding:12px 14px;margin-top:12px;">';
        h += '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">';
        h += '<span style="font-size:13px;font-weight:600;color:var(--blue);">📤 En attente de votre validation</span>';
        h += '</div>';
        // Conteneur rempli après le chargement asynchrone du dépôt (ex. liens CTA
        // du BAT à valider). Placé à l'intérieur du cadre de validation du PO.
        h += '<div id="po-extra-' + uid + '"></div>';
        h += '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">';
        if (needsImage) {
            h += '</div>';
            h += '<div style="margin-top:10px;margin-bottom:8px;">';
            h += '<label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">Capture d\'écran de validation (optionnelle)</label>';
            h += '<input type="file" id="po-ch-img-' + uid + '" class="form-control" accept="image/*">';
            h += '<div id="po-ch-img-preview-' + uid + '" style="margin-top:8px;"></div>';
            h += '</div>';
        }
        if (ch) h += customFieldsSectionHtml(poStepId, ch, ch.customFieldValues && ch.customFieldValues[poStepId]);
        h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">';
        h += '<button class="btn-po-validate-ch" data-step="' + poStepId + '"' + chAttr + ' style="background:var(--green-600);color:#fff;border:none;border-radius:6px;padding:7px 16px;font-weight:600;cursor:pointer;">✅ Valider ce canal</button>';
        if (canRevise) {
            h += '<button class="btn-po-ask-revision-ch" data-step="' + poStepId + '"' + chAttr + ' style="background:var(--amber);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer;">🔄 Demander modification</button>';
        }
        h += '</div></div>';
        if (canRevise) {
            h += '<div id="revision-form-ch-' + uid + '" style="display:none;margin-top:10px;">';
            h += buildRichEditor('revision-comment-ch-' + uid, 'Décrivez la modification demandée...');
            h += '<button class="btn-po-send-revision-ch" data-step="' + poStepId + '"' + chAttr + ' data-source="' + sourceStepId + '" style="margin-top:8px;background:var(--amber);color:#fff;border:none;border-radius:6px;padding:7px 16px;font-weight:600;cursor:pointer;">📤 Envoyer la demande</button>';
            h += '</div>';
        }
        h += '</div>';
        return h;
    }

    // ─────────────────────────────────────────────
    // WORKFLOW SECTION (timeline + manager + PO)
    // ─────────────────────────────────────────────
    function buildWorkflowSection(name, data) {
        var currentUser = users && users.getCurrentUser();
        var steps = data.workflow.steps;
        var assignments = data.workflow.assignments;
        var isCompleted = workflow.isCompleted(data);

        var statusColors = {
            locked:             { bg: '#e0e0e0', color: '#9e9e9e', icon: '🔒' },
            pending:            { bg: 'var(--amber-50)', color: 'var(--amber)', icon: '⏳' },
            submitted:          { bg: 'var(--blue-50)', color: 'var(--blue)', icon: '📤' },
            validated:          { bg: 'var(--green-50)', color: 'var(--green-600)', icon: '✅' },
            completed:          { bg: '#c8e6c9', color: 'var(--green-700)', icon: '🏁' },
            revision_requested: { bg: 'var(--amber-50)', color: 'var(--amber)', icon: '🔄' }
        };

        var globalSteps = data.workflow.steps || {};
        var channelSteps = data.workflow.channelSteps || {};
        var channels = data.channels || [];
        var numCh = channels.length;

        var html = '<div class="detail-section" id="workflow-section">';
        html += '<h3>🔄 Workflow</h3>';

        // ── Helpers stepper ──
        function wfStateClass(s) {
            if (s === 'validated' || s === 'completed') return 'done';
            if (s === 'submitted') return 'submitted';
            if (s === 'revision_requested') return 'revision';
            if (s === 'pending') return 'current';
            return 'locked';
        }
        // Pastille-date : jour + mois pour une étape terminée (dépôt/validation
        // déjà horodatés), « Depuis Xj » pour une étape en cours ou en révision
        // (pas de date de fin, on montre l'attente). null si aucune date connue
        // pour cette étape (retombe sur le rond simple côté appelant).
        var WF_MONTHS = ['Janv', 'Févr', 'Mars', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sept', 'Oct', 'Nov', 'Déc'];
        function wfDateTile(cls, iso) {
            var d = new Date(iso);
            if (isNaN(d.getTime())) return null;
            if (cls === 'current' || cls === 'revision') {
                var days = Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
                var num = days === 0 ? 'Auj.' : (days + 'j');
                return '<div class="wf-cal"><div class="wf-cal-tag">Depuis</div><div class="wf-cal-num">' + num + '</div></div>';
            }
            var day = String(d.getDate()).padStart(2, '0');
            return '<div class="wf-cal"><div class="wf-cal-tag">' + WF_MONTHS[d.getMonth()] + '</div><div class="wf-cal-num">' + day + '</div></div>';
        }
        function wfStepper(stepDefs, getStatus, chIdx) {
            var linkable = (chIdx !== undefined && chIdx !== null);
            var h = '<div class="wf-stepper' + (linkable ? ' wf-stepper--cal' : '') + '">';
            stepDefs.forEach(function(step, i) {
                var st = getStatus(step, i);
                var cls = wfStateClass(st);
                var classAttr = 'wf-step ' + cls + (linkable ? ' wf-step--link' : '');
                var dataAttr = linkable ? (' data-ch="' + chIdx + '" data-step="' + security.escapeHtml(step.id) + '"') : '';
                var titleTxt = security.escapeHtml(step.label) + (linkable ? ' — cliquer pour ouvrir le bloc' : '');
                // Date dans la pastille : uniquement pour les étapes canal (pas la
                // timeline « Préparation », globale) atteintes (pas 'locked') et
                // pour lesquelles un horodatage existe déjà (cf. workflow.
                // getChannelStepDate / _stampChannelStepDates — nouveau suivi, ne
                // couvre pas les étapes déjà en place avant son introduction).
                var iso = (linkable && cls !== 'locked') ? workflow.getChannelStepDate(data, chIdx, step.id) : null;
                var tile = iso ? wfDateTile(cls, iso) : null;
                var nodeHtml = tile || ('<div class="wf-node">' + ((cls === 'done') ? '✓' : String(i + 1)) + '</div>');
                h += '<div class="' + classAttr + '"' + dataAttr + ' title="' + titleTxt + '">' + nodeHtml + '<div class="wf-label">' + security.escapeHtml(step.label) + '</div></div>';
            });
            h += '</div>';
            return h;
        }
        // Une étape de dépôt (maquette, BAT, ciblage, test) reste "submitted" même
        // après validation par le PO : c'est l'étape po_validation_* qui passe à
        // "validated". Pour la timeline, on l'affiche comme "faite" (verte) dès que
        // sa validation associée est acquise.
        var DEPOT_VALIDATION = {
            com_maquette:        'po_validation_maquette',
            ebf_bat:             'po_validation_bat',
            data_ciblage:        'po_validation_ciblage',
            data_lancement_test: 'po_validation_test_prod',
            ebf_test_prod:       'po_validation_test_prod'
        };
        function channelStepStatus(cs, stepId) {
            var raw = cs[stepId] || 'locked';
            var vId = DEPOT_VALIDATION[stepId];
            if (raw === 'submitted' && vId) {
                var vs = cs[vId];
                if (vs === 'validated' || vs === 'completed') return 'completed';
            }
            return raw;
        }

        // ── Étapes globales (stepper) ──
        html += '<div class="wf-block"><div class="wf-head"><span class="wf-title">🚀 Préparation</span></div>';
        html += wfStepper(workflow.STEPS.slice(0, 3), function(step) { var s = globalSteps[step.id] || 'locked'; if (isCompleted) s = 'completed'; return s; });
        html += '</div>';

        // ── Étapes par canal (v2) ──
        // Étapes actives par canal : même source unique que renderChannelPage
        // (workflow.channelStepIds), pour que le stepper du bilan et le contenu
        // de la fiche canal soient toujours cohérents (chaque canal peut avoir
        // un jeu d'étapes différent — Administration ▸ Workflow).
        var jurReq = !!(data.juridique && data.juridique.required);

        if (numCh > 0) {
            channels.forEach(function(ch, ci) {
                var cs = channelSteps[ci] || {};
                var chStepIds = workflow.channelStepIds(data.requiredTeams, ch.content, jurReq);
                if (!chStepIds.length) return;
                var chStepDefs = chStepIds.map(function(id) { return { id: id, label: workflow.stepLabel(id) }; });
                var chCompleted = isCompleted || workflow.isChannelCompleted(cs, data.requiredTeams, ch.content, jurReq);
                // Badge d'état courant du canal
                var badge = 'En cours', badgeCls = '';
                if (chCompleted) { badge = '🏁 Terminé'; badgeCls = 'done'; }
                else {
                    for (var i = 0; i < chStepDefs.length; i++) {
                        var st = channelStepStatus(cs, chStepDefs[i].id);
                        if (st === 'pending')            { badge = chStepDefs[i].label; badgeCls = 'wait'; break; }
                        if (st === 'submitted')          { badge = 'En validation : ' + chStepDefs[i].label; badgeCls = 'val'; break; }
                        if (st === 'revision_requested') { badge = 'Révision : ' + chStepDefs[i].label; badgeCls = 'rev'; break; }
                    }
                }
                html += '<div class="wf-block"><div class="wf-head"><span class="wf-title">📡 ' + security.escapeHtml(ch.deliverableName || ('Canal ' + (ci + 1))) + '</span><span class="wf-badge ' + badgeCls + '">' + security.escapeHtml(badge) + '</span></div>';
                html += '<div class="wf-chan-date">📅 Date de réception client demandée : <strong>' + security.escapeHtml(ch.sendDate || 'non renseignée') + '</strong></div>';
                html += wfStepper(chStepDefs, function(step) { return chCompleted ? 'completed' : channelStepStatus(cs, step.id); }, ci);
                html += '</div>';
            });
        }

        // Légende
        html += '<div class="wf-legend"><span><i style="background:var(--primary)"></i> Fait</span><span><i style="background:var(--amber)"></i> En cours</span><span><i style="background:var(--blue)"></i> En validation</span><span><i style="background:var(--red)"></i> Révision</span><span><i style="background:#fff;border:1px solid var(--muted-2)"></i> À venir</span></div>';

        if (isCompleted) {
            html += '<div style="background:#c8e6c9;color:var(--green-700);border-radius:8px;padding:12px 16px;font-weight:700;margin-bottom:12px;">🏁 Campagne terminée !</div>';
            html += '</div>';
            return html;
        }

        // Composition de l'équipe + Co-PO : déplacés dans l'onglet Infos
        // générales (cf. buildTeamInfoBlock, appelée depuis renderInfoPage) —
        // seule la garde ci-dessous (utilisateur non identifié) reste ici, pour
        // les sections d'action qui suivent (affectation, kick-off...).
        if (!currentUser) {
            html += '<p style="color:#888;font-size:13px;">Sélectionnez un utilisateur pour voir vos actions disponibles.</p>';
            html += '</div>';
            return html;
        }

        // Manager : affectation
        // #14 : un manager de service ayant déjà affecté son équipe ne voit plus le bloc.
        if (users.isCurrentUserManager() && steps.manager_affectation === 'pending'
            && !workflow.managerAffectationDone(currentUser, data)) {
            // isGeneralManager = super-admin uniquement → voit les 3 dropdowns.
            // Les managers de service (com/ebf/data), y compris le manager marketing,
            // ne voient que leur propre dropdown (item 15) — le manager marketing n'a
            // d'ailleurs jamais ce bloc affiché : managerAffectationDone() le considère
            // « rien à faire » puisque l'équipe Marketing n'a pas de dropdown ici.
            var isGeneralManager = currentUser.isSuperAdmin === true;
            // Filtrer les équipes selon les services requis par la campagne
            var _requiredTeams = data.requiredTeams || [];
            var _needsCom  = _requiredTeams.length === 0 || _requiredTeams.indexOf('Com')  !== -1;
            var _needsEbf  = _requiredTeams.length === 0 || _requiredTeams.indexOf('EBF')  !== -1;
            var _needsData = _requiredTeams.length === 0 || _requiredTeams.indexOf('Data') !== -1;
            html += '<div style="background:var(--amber-50);border:1px solid var(--amber);border-radius:8px;padding:14px;margin-bottom:12px;" id="assignment-form-container">';
            html += '<h4 style="margin:0 0 12px;color:var(--amber);">👥 Affecter les équipes</h4>';
            if (!isGeneralManager) {
                var _comArr = getAssignees(assignments, 'com');
                var _ebfArr = getAssignees(assignments, 'ebf');
                var _datArr = getAssignees(assignments, 'data');
                html += '<div style="background:#fffde7;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:12px;line-height:1.6;">';
                html += '<strong>État des affectations :</strong><br>';
                if (_needsCom)  html += (_comArr.length ? '✅' : '⏳') + ' Com : '  + (_comArr.length ? _comArr.map(security.escapeHtml).join(', ') : 'non assigné') + ' &nbsp;|&nbsp; ';
                if (_needsEbf)  html += (_ebfArr.length ? '✅' : '⏳') + ' EBF : '  + (_ebfArr.length ? _ebfArr.map(security.escapeHtml).join(', ') : 'non assigné') + ' &nbsp;|&nbsp; ';
                if (_needsData) html += (_datArr.length ? '✅' : '⏳') + ' Data : ' + (_datArr.length ? _datArr.map(security.escapeHtml).join(', ') : 'non assigné');
                html += '</div>';
            }
            // Helper local : génère un groupe de checkboxes pour une équipe
            function buildTeamCheckboxes(role, label, teamUsers, currentAssignments) {
                var cur = getAssignees(currentAssignments, role);
                var h = '<div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:4px;">' + label + '</label>';
                h += '<div style="max-height:130px;overflow-y:auto;border:1px solid #ccc;border-radius:6px;padding:6px;background:#fff;">';
                teamUsers.forEach(function(u) {
                    var checked = cur.indexOf(u.name) !== -1 ? ' checked' : '';
                    h += '<label style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px;cursor:pointer;">';
                    h += '<input type="checkbox" class="assign-cb-' + role + '" value="' + security.escapeHtml(u.name) + '"' + checked + '> ';
                    h += security.escapeHtml(u.name) + '</label>';
                });
                h += '</div></div>';
                return h;
            }
            var _showCom  = (isGeneralManager || currentUser.role === 'com')  && _needsCom;
            var _showEbf  = (isGeneralManager || currentUser.role === 'ebf')  && _needsEbf;
            var _showData = (isGeneralManager || currentUser.role === 'data') && _needsData;
            var _colCount = (_showCom ? 1 : 0) + (_showEbf ? 1 : 0) + (_showData ? 1 : 0);
            html += '<div style="display:grid;grid-template-columns:repeat(' + (_colCount || 1) + ',1fr);gap:10px;">';
            if (_showCom)  html += buildTeamCheckboxes('com', 'Communication', users.getUsersByRole('com'), assignments);
            if (_showEbf)  html += buildTeamCheckboxes('ebf', 'EBF', users.getUsersByRole('ebf'), assignments);
            if (_showData) html += buildTeamCheckboxes('data', 'Data', users.getUsersByRole('data'), assignments);
            html += '</div>';
            var _reqTeamsAttr = [_needsCom?'com':'', _needsEbf?'ebf':'', _needsData?'data':''].filter(function(x){return x;}).join(',');
            var btnLabel = isGeneralManager ? '✅ Valider l\'affectation' : '💾 Enregistrer mon affectation';
            html += '<button id="btn-validate-assignment" data-general="' + isGeneralManager + '" data-role="' + security.escapeHtml(currentUser.role) + '" data-required-teams="' + _reqTeamsAttr + '" style="margin-top:12px;background:var(--primary);color:#fff;border:none;border-radius:6px;padding:8px 20px;font-weight:600;cursor:pointer;">' + btnLabel + '</button>';
            if (!isGeneralManager) {
                html += '<span style="margin-left:10px;font-size:12px;color:#888;">L\'étape sera validée quand tous les services requis seront renseignés.</span>';
            }
            html += '</div>';
        }

        // PO : Kick-off (après affectation, avant le démarrage des équipes)
        var isPOKickoff = users.isCurrentUserPO(data);

        // Résumé kick-off (visible par tous quand validé)
        if (steps.po_kickoff === 'validated' && data.kickoffDate) {
            html += '<div style="background:var(--green-50);border:1px solid var(--green-600);border-radius:8px;padding:14px;margin-bottom:12px;">';
            html += '<h4 style="margin:0 0 10px;color:var(--green-700);">🚀 Kick-off réalisé le ' + security.escapeHtml(data.kickoffDate) + '</h4>';
            var kfNotes = data.kickoffPersonNotes || {};
            var kfNoteKeys = Object.keys(kfNotes);
            if (kfNoteKeys.length > 0) {
                html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;">';
                kfNoteKeys.forEach(function(person) {
                    if (kfNotes[person]) {
                        html += '<div style="background:#fff;border:1px solid #a5d6a7;border-radius:6px;padding:8px 10px;">';
                        html += '<div style="font-size:11px;font-weight:700;color:var(--green-600);margin-bottom:4px;">' + security.escapeHtml(person) + '</div>';
                        html += '<div style="font-size:12px;color:var(--gray-700);white-space:pre-wrap;">' + security.escapeHtml(kfNotes[person]) + '</div>';
                        html += '</div>';
                    }
                });
                html += '</div>';
            }
            html += '</div>';
        }

        // Note personnelle kick-off (participants non-PO)
        if (!isPOKickoff && steps.po_kickoff === 'pending' && currentUser) {
            var _kfAllAssignees = getAssignees(assignments, 'com').concat(getAssignees(assignments, 'ebf')).concat(getAssignees(assignments, 'data'));
            if (_kfAllAssignees.indexOf(currentUser.name) !== -1) {
                var _kfMyNote = (data.kickoffPersonNotes || {})[currentUser.name] || '';
                html += '<div style="background:var(--blue-50);border:1px solid var(--blue);border-radius:8px;padding:14px;margin-bottom:12px;" id="kickoff-personal-container">';
                html += '<h4 style="margin:0 0 10px;color:var(--blue);">🚀 Kick-off — ma note</h4>';
                html += '<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">Saisissez vos notes pour le kick-off. Le PO organisera la réunion.</div>';
                html += '<div style="background:#fff;border:1px solid #90caf9;border-radius:6px;padding:8px 10px;">';
                html += '<div style="font-size:11px;font-weight:700;color:var(--blue);margin-bottom:4px;">' + security.escapeHtml(currentUser.name) + '</div>';
                html += '<textarea id="kickoff-my-note" class="form-control" rows="3" style="resize:vertical;font-size:13px;" placeholder="Vos notes, idées, questions pour le kick-off...">' + security.escapeHtml(_kfMyNote) + '</textarea>';
                html += '</div>';
                html += '<button id="btn-save-kickoff-note" style="margin-top:12px;background:var(--blue);color:#fff;border:none;border-radius:6px;padding:8px 20px;font-weight:600;cursor:pointer;">💾 Sauvegarder ma note</button>';
                html += '</div>';
            }
        }

        // Formulaire kick-off (pending, PO uniquement)
        if (isPOKickoff && steps.po_kickoff === 'pending') {
            var teamsSubject = encodeURIComponent('Kick-off \u2014 ' + (name || ''));
            var teamsUrl = 'https://teams.microsoft.com/l/meeting/new?subject=' + teamsSubject + '&tenantId=fb3baf17-c313-474c-8d5d-577a3ec97a32';
            var kfParticipants = [];
            if (data.po) kfParticipants.push({ role: 'PO', name: data.po });
            getAssignees(assignments, 'com').forEach(function(n) { kfParticipants.push({ role: 'Com', name: n }); });
            getAssignees(assignments, 'ebf').forEach(function(n) { kfParticipants.push({ role: 'EBF', name: n }); });
            getAssignees(assignments, 'data').forEach(function(n) { kfParticipants.push({ role: 'Data', name: n }); });
            var kfExistingNotes = data.kickoffPersonNotes || {};

            html += '<div style="background:var(--blue-50);border:1px solid var(--blue);border-radius:8px;padding:14px;margin-bottom:12px;" id="kickoff-form-container">';
            html += '<h4 style="margin:0 0 12px;color:var(--blue);">🚀 Organiser le Kick-off</h4>';
            html += '<div style="margin-bottom:14px;">';
            html += '<a href="' + teamsUrl + '" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:8px;background:#5558af;color:#fff;border-radius:6px;padding:8px 16px;font-weight:600;font-size:13px;text-decoration:none;">📅 Planifier sur Teams</a>';
            html += '<span style="margin-left:10px;font-size:12px;color:var(--muted);">Ouvre l\'agenda Teams avec le nom de la campagne pré-rempli</span>';
            html += '</div>';
            html += '<div class="form-row"><label style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;">Date du kick-off</label>';
            html += '<input type="date" id="kickoff-date-input" class="form-control" value="' + security.escapeHtml(data.kickoffDate || '') + '"></div>';
            if (kfParticipants.length > 0) {
                html += '<div class="form-row" style="margin-top:12px;">';
                html += '<label style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;display:block;margin-bottom:8px;">Notes par personne <small style="font-weight:normal;text-transform:none;">(optionnel)</small></label>';
                html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;">';
                kfParticipants.forEach(function(p) {

            .then(function(chDir) { return chDir.getFileHandle(fileName); })

    // Les champs personnalisés d'une étape de DÉPÔT sont rendus vides au premier
    // rendu synchrone (le dépôt n'est pas encore chargé) — une fois le JSON de
    // dépôt lu (async), on reconstruit le bloc avec les valeurs réelles et on le
    // recâble. Remplace le bloc existant dans le DOM plutôt que de le vider champ
    // par champ (plus simple, réutilise directement renderFields/wireFields).
    function fillCustomFieldsFromDepot(stepId, idx, values) {
        if (!customFields) return;
        var ch = currentCampaignData.channels[idx];
        if (!ch) return;
        var old = document.querySelector('.cf-fields-block[data-cf-attach="' + stepId + '"]');
        if (!old || !old.parentNode) return;
        // idSuffix impératif ici : le premier rendu synchrone (customFieldsSectionHtml,
        // avant chargement du dépôt) génère les ids DOM des champs migrés avec
        // idSuffix (ex. « data-codeproj-0 »). Sans le refournir ici, ce remplacement
        // régénère des ids différents (préfixe auto) et casse silencieusement toute
        // collecte ultérieure par id (collectDataDepot, setVal…) : au prochain dépôt,
        // les champs migrés sont relus comme vides — bug remonté sur Ciblage Data
        // après une demande de modification (le rechargement du dépôt existant
        // déclenche ce remplacement avant la resoumission).
        var html = customFields.renderFields(stepId, values || {}, { canalType: ch.content, idSuffix: idx });
        if (!html) return;
        var wrapper = document.createElement('div');
        wrapper.innerHTML = html;
        var fresh = wrapper.firstElementChild;
        if (!fresh) return;
        old.parentNode.replaceChild(fresh, old);
        wireCustomFieldsSection(stepId, ch);
    }

    function buildLinksBlock(title, urls) {

    // Contrainte URL des dépôts : renvoie le premier champ URL renseigné mais
    // invalide (hors http/https) dans un conteneur, sinon null. Ignore les
    // champs masqués.
    function firstInvalidUrl(scopeEl) {
        if (!scopeEl) return null;
        var inputs = scopeEl.querySelectorAll('input[type="url"]');
        for (var i = 0; i < inputs.length; i++) {
            if (inputs[i].offsetParent === null) continue; // champ masqué
            var v = (inputs[i].value || '').trim();
            if (!v) { inputs[i].style.borderColor = ''; continue; }
            var ok = /^https?:\/\/.+/i.test(v);
            if (ok) { try { new URL(v); } catch (e) { ok = false; } }
            if (!ok) return inputs[i];
            inputs[i].style.borderColor = '';
        }
        return null;
    }
    // Bloque la soumission d'un dépôt si une URL est invalide (met en évidence).
    function depotUrlGuard(btn) {
        var bad = firstInvalidUrl(btn && btn.closest('.actor-section'));
        if (bad) {
            bad.style.borderColor = 'var(--red)';
            bad.focus();
            errors.showNotification('Une URL renseignée est invalide : elle doit commencer par http:// ou https://.', 'warning');
            return false;
        }
        return true;
    }

    // ── Éditeur de texte enrichi (demande de modification) ──────────────────
    // Gras / italique / souligné / listes / retours à la ligne. Le contenu est
    // stocké en HTML et re-nettoyé à l'affichage (liste blanche de balises).
    function _safeInlineStyle(style) {
        if (!style) return '';
        var allow = /^(font-weight|font-style|text-decoration|text-decoration-line)$/i;
        var kept = [];
        String(style).split(';').forEach(function(p) {
            var i = p.indexOf(':'); if (i < 0) return;
            var k = p.slice(0, i).trim().toLowerCase();
            var v = p.slice(i + 1).trim();
            if (!allow.test(k)) return;
            if (/expression|url\(|javascript:|[<>]/i.test(v)) return;
            kept.push(k + ':' + v);
        });
        return kept.join(';');
    }
    // Nettoie un HTML enrichi selon une liste blanche stricte de balises/attributs.
    // Tout le reste est réduit à son texte (échappé). Sûr contre l'injection.
    function sanitizeRichHtml(html) {
        if (html == null) return '';
        var str = String(html);
        if (str.indexOf('<') === -1) return security.escapeHtml(str); // texte simple
        var ALLOWED = { B:1, STRONG:1, I:1, EM:1, U:1, BR:1, P:1, DIV:1, UL:1, OL:1, LI:1, SPAN:1, A:1 };
        var doc;
        try { doc = new DOMParser().parseFromString(str, 'text/html'); }
        catch (e) { return security.escapeHtml(str); }
        function clean(node) {
            var out = '';
            Array.prototype.forEach.call(node.childNodes, function(child) {

    // ── Dépôt d'un mail HTML autonome (BAT / test prod) ────────────────────
    // Un mail HTML référence ses images par chemin relatif (ex. images/logo.png),
    // dans un dossier voisin. Comme l'aperçu se fait via une URL blob: (sans base
    // relative) et qu'on ne stocke que le fichier HTML, ces images seraient
    // manquantes. On lit donc les images sélectionnées et on les intègre dans le
    // HTML sous forme de data: URIs → un fichier HTML autonome, complet.
    function fileToDataUrl(file) {

    // Nom de fichier seul, en minuscules, sans dossier ni query/hash.
    function _assetBase(path) {

    }
    // Renvoie le nom du fichier « principal » d'une sélection : le .html s'il
    // existe (cas mail HTML + images), sinon le premier fichier.

        return (htmlF || arr[0]).name;
    }
    // Construit un Blob HTML autonome : remplace les références d'images
    // relatives (src/href/background, CSS url(), srcset) par des data: URIs.
    function buildSelfContainedHtml(htmlFile, assetFiles) {
        return Promise.all((assetFiles || []).map(function(f) {
            return fileToDataUrl(f).then(function(durl) { return { name: _assetBase(f.name), durl: durl }; });
        })).then(function(entries) {
            var byName = {};
            entries.forEach(function(e) { byName[e.name] = e.durl; });
            function keepAbsolute(v) { return /^(https?:|data:|cid:|mailto:|tel:|#)/i.test(v); }
            return htmlFile.text().then(function(html) {
                html = html.replace(/(src|href|background)\s*=\s*(["'])([^"']+)\2/gi, function(m, attr, q, val) {
                    if (keepAbsolute(val)) return m;

                });
                html = html.replace(/url\(\s*(["']?)([^)"']+)\1\s*\)/gi, function(m, q, val) {

                            var d = byName[_assetBase(seg[0])];
                            if (d) seg[0] = d;
                        }

    // Prépare le fichier EBF à enregistrer (BAT / test prod).
    // HTML (+ images) → HTML autonome (.html). Sinon → le fichier tel quel.
    // Renvoie Promise<{blob, ext} | null>.
    // ── MHTML (archive web mono-fichier) → HTML autonome ──────────────────
    // Un .mht/.mhtml embarque le HTML + ses images (MIME multipart/related).
    // Chrome ne l'affiche pas dans une iframe via blob: ; on le convertit donc
    // en HTML autonome (images intégrées en data: URIs), prévisualisable.
    function _qpToBytes(input) {
        var s = String(input).replace(/=\r?\n/g, '');
        var bytes = [];
        for (var i = 0; i < s.length; i++) {
            if (s[i] === '=' && /^[0-9A-Fa-f]{2}$/.test(s.substr(i + 1, 2))) {
                bytes.push(parseInt(s.substr(i + 1, 2), 16)); i += 2;
            } else {

            }

        return new Uint8Array(bytes);
    }
    function _b64ToBytes(b64) {

        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
    }
    // Encodage base64 par blocs (évite la limite d'arguments de String.fromCharCode).
    function _bytesToBase64(bytes) {

        for (var i = 0; i < bytes.length; i += CHUNK) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
        }
        return btoa(bin);
    }
    // Octets d'une partie MIME selon son encodage.
    function _partBytes(p) {
        if (p.cte === 'base64') return _b64ToBytes(p.body);
        if (p.cte === 'quoted-printable') return _qpToBytes(p.body);
        var arr = new Uint8Array(p.body.length); // 7bit / 8bit / binary
        for (var i = 0; i < p.body.length; i++) arr[i] = p.body.charCodeAt(i) & 0xFF;

    }
    function _mhtmlParts(text) {
        var sep = text.indexOf('\r\n\r\n'); var nl = 4;
        if (sep === -1) { sep = text.indexOf('\n\n'); nl = 2; }
        if (sep === -1) return null;
        var header = text.slice(0, sep);
        var body = text.slice(sep + nl);
        var m = /boundary="?([^";\r\n]+)"?/i.exec(header);
        if (!m) return null;
        var parts = [];
        body.split('--' + m[1]).forEach(function(chunk) {
            chunk = chunk.replace(/^\r?\n/, '');
            if (!chunk || chunk.slice(0, 2) === '--') return; // séparateur de fin
            var s2 = chunk.indexOf('\r\n\r\n'); var nl2 = 4;
            if (s2 === -1) { s2 = chunk.indexOf('\n\n'); nl2 = 2; }
            if (s2 === -1) return;
            var ph = chunk.slice(0, s2);
            var pbody = chunk.slice(s2 + nl2).replace(/\r?\n$/, '');
            parts.push({
                ctype: (((/Content-Type:\s*([^;\r\n]+)/i.exec(ph) || [])[1]) || '').trim().toLowerCase(),
                cte:   (((/Content-Transfer-Encoding:\s*([^\r\n]+)/i.exec(ph) || [])[1]) || '').trim().toLowerCase(),
                cloc:  (((/Content-Location:\s*([^\r\n]+)/i.exec(ph) || [])[1]) || '').trim(),
                cid:   (((/Content-ID:\s*<?([^>\r\n]+)>?/i.exec(ph) || [])[1]) || '').trim(),
                body:  pbody
            });
        });

    }
    function _replaceUrlAll(str, find, repl) {
        if (!find) return str;
        [find, find.replace(/&/g, '&amp;')].forEach(function(v) { if (v) str = str.split(v).join(repl); });
        return str;
    }
    function mhtmlToHtml(text) {
        var parts = _mhtmlParts(text);
        if (!parts || !parts.length) return null;
        var htmlPart = parts.filter(function(p) { return p.ctype.indexOf('text/html') === 0; })[0];
        if (!htmlPart) return null;
        var htmlBytes = (htmlPart.cte === 'quoted-printable') ? _qpToBytes(htmlPart.body)
                      : (htmlPart.cte === 'base64')           ? _b64ToBytes(htmlPart.body)
                      : null;
        var html;
        try { html = htmlBytes ? new TextDecoder('utf-8').decode(htmlBytes) : htmlPart.body; }
        catch (e) { html = htmlPart.body; }
        parts.forEach(function(p) {
            if (p === htmlPart) return;
            if (p.ctype.indexOf('image/') !== 0 && p.ctype.indexOf('text/css') !== 0) return;
            var b64 = (p.cte === 'base64') ? p.body.replace(/\s+/g, '') : _bytesToBase64(_partBytes(p));
            var dataUri = 'data:' + (p.ctype || 'application/octet-stream') + ';base64,' + b64;
            if (p.cloc) html = _replaceUrlAll(html, p.cloc, dataUri);
            if (p.cid)  html = _replaceUrlAll(html, 'cid:' + p.cid, dataUri);
        });
        return html;
    }

    function prepareEbfDepotFile(fileList) {
        var files = Array.prototype.slice.call(fileList || []);
        if (!files.length) return Promise.resolve(null);
        // MHTML : archive mono-fichier → conversion en HTML autonome.
        var mhtmlFile = files.filter(function(f) {
            return /\.mht(ml)?$/i.test(f.name || '') || /message\/rfc822|multipart\/related/i.test(f.type || '');
        })[0];
        if (mhtmlFile) {
            return mhtmlFile.text().then(function(txt) {
                var html = mhtmlToHtml(txt);
                if (html == null) { // parsing impossible : on garde le fichier brut
                    var ext0 = (mhtmlFile.name.split('.').pop() || 'mhtml').toLowerCase();
                    return { blob: mhtmlFile, ext: ext0 };
                }
                return { blob: new Blob([html], { type: 'text/html' }), ext: 'html' };
            });
        }
        var htmlFile = files.filter(function(f) { return /\.html?$/i.test(f.name || '') || f.type === 'text/html'; })[0];
        if (htmlFile) {
            var assets = files.filter(function(f) { return f !== htmlFile; });
            return buildSelfContainedHtml(htmlFile, assets).then(function(blob) { return { blob: blob, ext: 'html' }; });
        }
        var single = files[0];
        var ext = (single.name.split('.').pop() || 'bin').toLowerCase();
        return Promise.resolve({ blob: single, ext: ext });
    }

        if (d.codeProjet) h += '<div class="depot-readonly-item"><strong>Code Projet</strong>' + security.escapeHtml(d.codeProjet) + '</div>';
        if (d.codeAction) h += '<div class="depot-readonly-item"><strong>Code Action</strong>' + security.escapeHtml(d.codeAction) + '</div>';

        if (d.urlEchantillon) h += '<div class="depot-readonly-item"><strong>Échantillon à valider</strong><a href="' + security.escapeHtml(d.urlEchantillon) + '" target="_blank" rel="noopener">' + security.escapeHtml(d.urlEchantillon) + '</a></div>';
        h += '</div>';
        el.innerHTML = h;
        el.style.display = 'block';
        var emptyEl = document.getElementById('data-empty-' + idx);
        if (emptyEl) emptyEl.style.display = 'none';

    // ─────────────────────────────────────────────
    // CHARGEMENT DÉPÔTS PAR CANAL
    // ─────────────────────────────────────────────
    // #27 — Recherche par références. Les codes (Code Com, Réf Paracom, Code
    // Projet, Code Action) sont saisis dans les dépôts EBF/Data ; on les recopie
    // sur le canal de la campagne pour qu'ils alimentent l'index et deviennent
    // cherchables depuis le tableau de bord. Renvoie true si une valeur a changé.
    function mirrorChannelCodes(idx, depot) {
        if (!depot || !currentCampaignData || !currentCampaignData.channels) return false;
        var ch = currentCampaignData.channels[idx];
        if (!ch) return false;
        var changed = false;
        ['codeCom', 'refParacom', 'codeProjet', 'codeAction', 'codeMK', 'emailObject'].forEach(function(k) {
            var v = (depot[k] || '').toString().trim();
            if (v && ch[k] !== v) { ch[k] = v; changed = true; }
        });
        return changed;
    }
    // Persistance différée (backfill à l'ouverture) : ne sauvegarde qu'une fois,
    // en silence, si l'ouverture d'une campagne a complété des codes manquants.
    var _codesPersistTimer = null;
    function persistMirroredCodes() {
        if (_codesPersistTimer) return;
        _codesPersistTimer = setTimeout(function() {
            _codesPersistTimer = null;
            workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData)
                .catch(function(e) { console.warn('Indexation des codes échouée (non bloquant) :', e && e.message); });
        }, 1000);
    }

    function loadDepotForChannel(campaignName, idx, ch) {
        if (!currentRootHandle || !ch) return;
        var folder = sanitizeName(ch.deliverableName || ('canal_' + idx));

        if (loadedDepots[idx]) {
            var cache = loadedDepots[idx];
            if (cache.com)     { fillComForm(idx, cache.com); renderComReadonly(idx, cache.com); if (cache.com.pdfComSavedName) loadComFilePreview(idx, folder, cache.com.pdfComSavedName); }
            else { var ce = document.getElementById('com-empty-' + idx);  if (ce) ce.style.display = 'block'; }
            if (cache.ebf)     { fillEbfForm(idx, cache.ebf); renderEbfReadonly(idx, cache.ebf); if (cache.ebf.pdfBatSavedName) loadBatImagePreview(idx, folder, cache.ebf.pdfBatSavedName); }
            else { var ee = document.getElementById('ebf-empty-' + idx);  if (ee) ee.style.display = 'block'; }
            if (cache.data)    { fillDataForm(idx, cache.data); renderDataReadonly(idx, cache.data); }
            else { var de = document.getElementById('data-empty-' + idx); if (de) de.style.display = 'block'; }
            if (cache.datamep) { renderDataMepReadonly(idx, cache.datamep); fillCustomFieldsFromDepot('data_mise_en_prod', idx, cache.datamep.customFieldValues); }
            else { var dme = document.getElementById('data-mep-empty-' + idx); if (dme) dme.style.display = 'block'; }
            if (cache.ebftest) { renderEbfTestProdReadonly(idx, cache.ebftest); if (cache.ebftest.pdfTestProdSavedName) loadTestProdImagePreview(idx, folder, cache.ebftest.pdfTestProdSavedName); fillCustomFieldsFromDepot('ebf_test_prod', idx, cache.ebftest.customFieldValues); }
            else { var ete = document.getElementById('ebf-testprod-empty-' + idx); if (ete) ete.style.display = 'block'; }
            if (cache.datatest) { renderDataLancementTestReadonly(idx, cache.datatest); fillCustomFieldsFromDepot('data_lancement_test', idx, cache.datatest.customFieldValues); }
            else { var dte = document.getElementById('data-testlaunch-empty-' + idx); if (dte) dte.style.display = 'block'; }
            if (cache.ebfmep) { renderEbfMepReadonly(idx, cache.ebfmep); fillCustomFieldsFromDepot('ebf_mise_en_prod', idx, cache.ebfmep.customFieldValues); }
            else { var eme = document.getElementById('ebf-mep-empty-' + idx); if (eme) eme.style.display = 'block'; }
            return;
        }

        loadedDepots[idx] = {};

        readDepotFile(campaignName, folder, 'depotcom.json')
            .then(function(d) {
                loadedDepots[idx].com = d;
                fillComForm(idx, d);
                renderComReadonly(idx, d);
                if (d.pdfComSavedName) loadComFilePreview(idx, folder, d.pdfComSavedName);
            })
            .catch(function() {
                var el = document.getElementById('com-empty-' + idx);
                if (el) el.style.display = 'block';
            });

        readDepotFile(campaignName, folder, 'depotebf.json')
            .then(function(d) {
                loadedDepots[idx].ebf = d;
                fillEbfForm(idx, d);
                renderEbfReadonly(idx, d);
                if (mirrorChannelCodes(idx, d)) persistMirroredCodes();
                if (d.pdfBatSavedName) loadBatImagePreview(idx, folder, d.pdfBatSavedName);
            })
            .catch(function() {
                var el = document.getElementById('ebf-empty-' + idx);
                if (el) el.style.display = 'block';
            });

        readDepotFile(campaignName, folder, 'depotdata.json')
            .then(function(d) {
                loadedDepots[idx].data = d;
                fillDataForm(idx, d);
                renderDataReadonly(idx, d);
                if (mirrorChannelCodes(idx, d)) persistMirroredCodes();
            })
            .catch(function() {
                var el = document.getElementById('data-empty-' + idx);
                if (el) el.style.display = 'block';
            });

        readDepotFile(campaignName, folder, 'depotebf_test.json')
            .then(function(d) {
                loadedDepots[idx].ebftest = d;
                renderEbfTestProdReadonly(idx, d);
                if (d.pdfTestProdSavedName) loadTestProdImagePreview(idx, folder, d.pdfTestProdSavedName);
                fillCustomFieldsFromDepot('ebf_test_prod', idx, d.customFieldValues);
            })
            .catch(function() {
                var el = document.getElementById('ebf-testprod-empty-' + idx);
                if (el) el.style.display = 'block';
            });

        readDepotFile(campaignName, folder, 'depotdata_mep.json')
            .then(function(d) {
                loadedDepots[idx].datamep = d;
                renderDataMepReadonly(idx, d);
                fillCustomFieldsFromDepot('data_mise_en_prod', idx, d.customFieldValues);
            })
            .catch(function() {
                var el = document.getElementById('data-mep-empty-' + idx);
                if (el) el.style.display = 'block';
            });

        readDepotFile(campaignName, folder, 'depotdata_test.json')
            .then(function(d) {
                loadedDepots[idx].datatest = d;
                renderDataLancementTestReadonly(idx, d);
                fillCustomFieldsFromDepot('data_lancement_test', idx, d.customFieldValues);
            })
            .catch(function() {
                var el = document.getElementById('data-testlaunch-empty-' + idx);
                if (el) el.style.display = 'block';
            });

        readDepotFile(campaignName, folder, 'depotebf_mep.json')
            .then(function(d) {
                loadedDepots[idx].ebfmep = d;
                renderEbfMepReadonly(idx, d);
                fillCustomFieldsFromDepot('ebf_mise_en_prod', idx, d.customFieldValues);
            })
            .catch(function() {
                var el = document.getElementById('ebf-mep-empty-' + idx);
                if (el) el.style.display = 'block';
            });
    }

    // ─────────────────────────────────────────────
    // EVENTS : PAGE CANAL (par canal)
    // ─────────────────────────────────────────────
    // Les 12 id d'étape par canal (mêmes id que js/workflow-standalone.js) — sert à
    // câbler les champs personnalisés sur toutes les étapes en une seule boucle,
    // sans savoir à l'avance lesquelles sont actives pour ce canal (wireFields est
    // un no-op silencieux si l'étape n'a pas de bloc dans le DOM).
    var ALL_STEP_IDS = ['com_maquette', 'po_validation_maquette', 'com_juridique', 'ebf_bat', 'po_validation_bat',
        'data_ciblage', 'po_validation_ciblage', 'data_lancement_test', 'ebf_test_prod', 'po_validation_test_prod',
        'data_mise_en_prod', 'ebf_mise_en_prod'];

    function setupChannelPageEvents(idx) {
        var chForCfWire = currentCampaignData.channels[idx];
        ALL_STEP_IDS.forEach(function (sid) { wireCustomFieldsSection(sid, chForCfWire); });

        // COM : numImages → dynamic URL inputs
        var numImgInput = document.getElementById('com-numimages-' + idx);
        if (numImgInput) {
            numImgInput.addEventListener('input', function() {
                updateComImageUrls(idx, parseInt(numImgInput.value) || 0, []);
            });
        }

        // EBF : numCta → dynamic CTA inputs
        var numCtaInput = document.getElementById('ebf-numcta-' + idx);
        if (numCtaInput) {
            numCtaInput.addEventListener('input', function() {
                updateEbfCtaUrls(idx, parseInt(numCtaInput.value) || 0, []);
            });
        }

        // ── Save COM (M13 : brouillon, sans faire avancer le workflow) ──
        var btnSaveCom = document.querySelector('.btn-save-com[data-ch="' + idx + '"]');
        if (btnSaveCom) {
            btnSaveCom.addEventListener('click', function() {
                var folder = getChannelFolder(idx);
                var depot  = collectComDepot(idx);
                depot.status = 'draft';
                attachCustomFieldsToDepot(depot, 'com_maquette', idx);
                var comFileEl = document.getElementById('com-pdf-' + idx);
                var comFileToSave = comFileEl && comFileEl.files[0];
                if (comFileToSave) {
                    var comExt = comFileToSave.name.split('.').pop().toLowerCase();
                    depot.pdfComSavedName = 'maquette_canal_' + idx + '.' + comExt;
                }
                // Persister la date de dépôt maquette dans campagne.json
                if (depot.depotMaquetteDate) {
                    currentCampaignData.workflow.channelDates = currentCampaignData.workflow.channelDates || {};
                    currentCampaignData.workflow.channelDates[idx] = currentCampaignData.workflow.channelDates[idx] || {};
                    currentCampaignData.workflow.channelDates[idx].depotMaquetteDate = depot.depotMaquetteDate;
                    workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData)
                        .catch(function(err) {
                            console.error('Échec de la sauvegarde de la date de dépôt maquette :', err);
                            errors.showNotification('La date de dépôt n\'a pas pu être enregistrée : ' + errors.getErrorMessage(err), 'error');
                        });
                }
                disableBtn(btnSaveCom, 'Enregistrement...');
                saveDepotFile(currentCampaignName, folder, 'depotcom.json', depot)
                    .then(function() {
                        loadedDepots[idx] = loadedDepots[idx] || {};
                        loadedDepots[idx].com = depot;
                        renderComReadonly(idx, depot);
                        if (comFileToSave && depot.pdfComSavedName) {
                            return currentRootHandle.getDirectoryHandle('Campagnes')
                                .then(function(d) { return d.getDirectoryHandle(currentCampaignName); })
                                .then(function(d) { return d.getDirectoryHandle(folder, {create:true}); })
                                .then(function(d) { return d.getFileHandle(depot.pdfComSavedName, {create:true}); })
                                .then(function(fh) { return fh.createWritable(); })
                                .then(function(w) { return comFileToSave.arrayBuffer().then(function(buf) { return w.write(buf).then(function() { return w.close(); }); }); })
                                .then(function() { loadComFilePreview(idx, folder, depot.pdfComSavedName); })
                                .catch(function(err) {
                                    console.error('Échec de l\'enregistrement du fichier maquette :', err);
                                    errors.showNotification('Le fichier maquette n\'a pas pu être enregistré : ' + errors.getErrorMessage(err), 'error');
                                });
                        }
                    })
                    .then(function() {
                        enableBtn(btnSaveCom, '💾 Enregistrer');
                        errors.showNotification('Enregistré (brouillon, pas encore soumis).', 'success', 2500);
                    })
                    .catch(function(err) { enableBtn(btnSaveCom, '💾 Enregistrer'); errors.showNotification('Erreur : ' + errors.getErrorMessage(err), 'error'); });
            });
        }

        // ── Submit COM ──
        var btnSubmitCom = document.querySelector('.btn-submit-canal-com[data-ch="' + idx + '"]');
        if (btnSubmitCom) {
            btnSubmitCom.addEventListener('click', function() {
                if (!depotUrlGuard(btnSubmitCom)) return;
                var folder = getChannelFolder(idx);
                var depot  = collectComDepot(idx);
                depot.status = 'submitted';
                var comFileEl = document.getElementById('com-pdf-' + idx);
                var comFileToSave = comFileEl && comFileEl.files[0];
                if (comFileToSave) {
                    var comExt = comFileToSave.name.split('.').pop().toLowerCase();
                    depot.pdfComSavedName = 'maquette_canal_' + idx + '.' + comExt;
                }
                var cfErrsCom = attachCustomFieldsToDepot(depot, 'com_maquette', idx);
                if (cfErrsCom.length) { notify(cfErrsCom[0].message, 'warning'); return; }
                disableBtn(btnSubmitCom, 'Envoi...');
                saveDepotFile(currentCampaignName, folder, 'depotcom.json', depot)
                    .then(function() {
                        loadedDepots[idx] = loadedDepots[idx] || {};
                        loadedDepots[idx].com = depot;
                        if (comFileToSave && depot.pdfComSavedName) {
                            currentRootHandle.getDirectoryHandle('Campagnes')
                                .then(function(d) { return d.getDirectoryHandle(currentCampaignName); })
                                .then(function(d) { return d.getDirectoryHandle(folder, {create:true}); })
                                .then(function(d) { return d.getFileHandle(depot.pdfComSavedName, {create:true}); })
                                .then(function(fh) { return fh.createWritable(); })
                                .then(function(w) { return comFileToSave.arrayBuffer().then(function(buf) { return w.write(buf).then(function() { return w.close(); }); }); })
                                .catch(function(err) {
                                    console.error('Échec de l\'enregistrement du fichier maquette :', err);
                                    errors.showNotification('Le fichier maquette n\'a pas pu être enregistré : ' + errors.getErrorMessage(err), 'error');
                                });
                        }
                        // v2 : avancement direct du canal
                        workflow.advanceChannelStep(currentCampaignData, idx, 'com_maquette', 'submitted');
                        workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData)
                            .then(function() { refreshCurrentPage(); });
                        enableBtn(btnSubmitCom, '📤 Soumettre ce canal');
                        errors.showNotification('Canal soumis !', 'success', 2000);
                    })
                    .catch(function(err) { enableBtn(btnSubmitCom, '📤 Soumettre ce canal'); errors.showNotification('Erreur : ' + errors.getErrorMessage(err), 'error'); });
            });
        }

        // ── Save EBF (BAT ou Test Prod) — M13 : brouillon, pas d'avancement ──
        document.querySelectorAll('.btn-save-ebf[data-ch="' + idx + '"]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var stepId     = btn.getAttribute('data-step') || 'ebf_bat';
                var isTestProd = stepId === 'ebf_test_prod';
                var folder     = getChannelFolder(idx);
                var depotFile  = isTestProd ? 'depotebf_test.json' : 'depotebf.json';
                var inputEl    = document.getElementById((isTestProd ? 'ebf-pdf-testprod-' : 'ebf-pdf-bat-') + idx);
                disableBtn(btn, 'Enregistrement...');
                prepareEbfDepotFile(inputEl && inputEl.files).then(function(prepared) {
                    var depot = isTestProd ? collectEbfTestProdDepot(idx) : collectEbfDepot(idx);
                    depot.status = 'draft';
                    attachCustomFieldsToDepot(depot, stepId, idx);
                    var savedName = null;
                    if (prepared) {
                        savedName = (isTestProd ? 'testprod_canal_' : 'bat_canal_') + idx + '.' + prepared.ext;
                        if (isTestProd) depot.pdfTestProdSavedName = savedName;
                        else            depot.pdfBatSavedName = savedName;
                    }
                    return saveDepotFile(currentCampaignName, folder, depotFile, depot).then(function() {
                        loadedDepots[idx] = loadedDepots[idx] || {};
                        if (isTestProd) { loadedDepots[idx].ebftest = depot; renderEbfTestProdReadonly(idx, depot); }
                        else            { loadedDepots[idx].ebf = depot; renderEbfReadonly(idx, depot); }
                        if (prepared && savedName) {
                            return currentRootHandle.getDirectoryHandle('Campagnes')
                                .then(function(d) { return d.getDirectoryHandle(currentCampaignName); })
                                .then(function(d) { return d.getDirectoryHandle(folder, {create:true}); })
                                .then(function(d) { return d.getFileHandle(savedName, {create:true}); })
                                .then(function(fh) { return fh.createWritable(); })
                                .then(function(w) { return prepared.blob.arrayBuffer().then(function(buf) { return w.write(buf).then(function() { return w.close(); }); }); })
                                .catch(function(err) {
                                    console.error('Échec de l\'enregistrement du fichier EBF :', err);
                                    errors.showNotification('Le fichier n\'a pas pu être enregistré : ' + errors.getErrorMessage(err), 'error');
                                });
                        }
                    });
                }).then(function() {
                    enableBtn(btn, '💾 Enregistrer');
                    errors.showNotification('Enregistré (brouillon, pas encore soumis).', 'success', 2500);
                }).catch(function(err) {
                    enableBtn(btn, '💾 Enregistrer');
                    errors.showNotification('Erreur : ' + errors.getErrorMessage(err), 'error');
                });
            });
        });

        // ── Submit EBF (BAT ou Test Prod) ──
        document.querySelectorAll('.btn-submit-canal-ebf[data-ch="' + idx + '"]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                if (!depotUrlGuard(btn)) return;
                var stepId      = btn.getAttribute('data-step') || 'ebf_bat';
                var isTestProd  = stepId === 'ebf_test_prod';
                var cfResultEbf = collectCustomFields(stepId, currentCampaignData.channels[idx]);
                if (cfResultEbf.errors.length) { notify(cfResultEbf.errors[0].message, 'warning'); return; }
                var folder      = getChannelFolder(idx);
                var depotFile   = isTestProd ? 'depotebf_test.json' : 'depotebf.json';
                var btnLabel    = '📤 Soumettre ce canal';
                var inputEl     = document.getElementById((isTestProd ? 'ebf-pdf-testprod-' : 'ebf-pdf-bat-') + idx);
                disableBtn(btn, 'Envoi...');
                // Prépare le fichier : pour un mail HTML, les images sélectionnées
                // sont intégrées en data: URIs pour obtenir un HTML autonome.
                prepareEbfDepotFile(inputEl && inputEl.files).then(function(prepared) {
                    var depot = isTestProd ? collectEbfTestProdDepot(idx) : collectEbfDepot(idx);
                    depot.status = 'submitted';
                    depot.customFieldValues = cfResultEbf.values;
                    var savedName = null;
                    if (prepared) {
                        savedName = (isTestProd ? 'testprod_canal_' : 'bat_canal_') + idx + '.' + prepared.ext;
                        if (isTestProd) depot.pdfTestProdSavedName = savedName;
                        else            depot.pdfBatSavedName = savedName;
                    }
                    return saveDepotFile(currentCampaignName, folder, depotFile, depot).then(function() {
                        loadedDepots[idx] = loadedDepots[idx] || {};
                        if (isTestProd) { loadedDepots[idx].ebftest = depot; renderEbfTestProdReadonly(idx, depot); }
                        else            { loadedDepots[idx].ebf = depot; renderEbfReadonly(idx, depot); }
                        var writePromise = Promise.resolve();
                        if (prepared && savedName) {
                            writePromise = currentRootHandle.getDirectoryHandle('Campagnes')
                                .then(function(d) { return d.getDirectoryHandle(currentCampaignName); })
                                .then(function(d) { return d.getDirectoryHandle(folder, {create:true}); })
                                .then(function(d) { return d.getFileHandle(savedName, {create:true}); })
                                .then(function(fh) { return fh.createWritable(); })
                                .then(function(w) { return prepared.blob.arrayBuffer().then(function(buf) { return w.write(buf).then(function() { return w.close(); }); }); })
                                .catch(function(err) {
                                    console.error('Échec de l\'enregistrement du fichier EBF :', err);
                                    errors.showNotification('Le fichier n\'a pas pu être enregistré : ' + errors.getErrorMessage(err), 'error');
                                });
                        }
                        // v2 : avancement direct du canal
                        mirrorChannelCodes(idx, depot); // #27 : indexer les codes saisis
                        // M21 : dépôt et validation redeviennent deux étapes séparées (comme
                        // le BAT) — le test en prod reste « soumis », en attente de la
                        // validation PO (bloc buildPoValidationBlock).
                        workflow.advanceChannelStep(currentCampaignData, idx, stepId, 'submitted');
                        return writePromise
                            .then(function() { return workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData); })
                            .then(function() { refreshCurrentPage(); });
                    });
                }).then(function() {
                    enableBtn(btn, btnLabel);
                    errors.showNotification('Canal soumis !', 'success', 2000);
                }).catch(function(err) {
                    enableBtn(btn, btnLabel);
                    errors.showNotification('Erreur : ' + errors.getErrorMessage(err), 'error');
                });
            });
        });

        // ── Gestion d'équipe : équipe campagne (managers) + renfort par canal ──
        document.querySelectorAll('.btn-team-reassign').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var uid = btn.getAttribute('data-role') + '-' + btn.getAttribute('data-ch');
                var formEl = document.getElementById('reassign-form-' + uid);
                if (formEl) formEl.style.display = formEl.style.display === 'none' ? 'block' : 'none';

    // ─────────────────────────────────────────────
    // EVENTS : PAGE INFO (global)
    // ─────────────────────────────────────────────
    function setupGlobalEvents(name, data) {
        // ── Clic sur une étape de la timeline d'un canal → ouvrir le bloc correspondant ──
        var wfSection = document.getElementById('workflow-section');
        if (wfSection) {
            wfSection.addEventListener('click', function(e) {
                var stepEl = e.target.closest && e.target.closest('.wf-step--link');
                if (!stepEl) return;
                var ci = parseInt(stepEl.getAttribute('data-ch'), 10);
                var stepId = stepEl.getAttribute('data-step');
                if (isNaN(ci) || !stepId) return;
                gotoChannelStep(ci, stepId);
            });
        }

        // ── Sous-onglets Infos générales / Documents / Activité ──
        var subtabsCard = document.getElementById('info-subtabs-card');
        if (subtabsCard) {
            subtabsCard.querySelectorAll('.subtab-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var key = btn.getAttribute('data-subtab');
                    subtabsCard.querySelectorAll('.subtab-btn').forEach(function(b) { b.classList.toggle('active', b === btn); });
                    subtabsCard.querySelectorAll('.subtab-panel').forEach(function(p) { p.classList.toggle('active', p.getAttribute('data-subpanel') === key); });
                });
            });
        }

        // ── Discussion : bulle flottante → ouvre/ferme le panneau ──
        var chatBubbleBtn = document.getElementById('chat-bubble-btn');
        var chatPanel = document.getElementById('chat-panel');
        if (chatBubbleBtn && chatPanel) {
            chatBubbleBtn.addEventListener('click', function() { chatPanel.classList.toggle('open'); });
            var chatCloseBtn = document.getElementById('chat-panel-close');
            if (chatCloseBtn) chatCloseBtn.addEventListener('click', function() { chatPanel.classList.remove('open'); });
        }

        // ── Co-PO (suppléance) ──
        var btnCoPoToggle = document.getElementById('btn-copo-toggle');
        if (btnCoPoToggle) {
            btnCoPoToggle.addEventListener('click', function() {

        var btnCoPoSave = document.getElementById('btn-copo-save');
        if (btnCoPoSave) {

                currentCampaignData.coPo = sel;
                workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData)
                    .then(function() {

                        refreshCurrentPage();

                    .catch(function(err) { enableBtn(btnCoPoSave, '💾 Enregistrer'); notify('Erreur : ' + errors.getErrorMessage(err), 'error'); });

        // ── Équipe (Infos générales) : ajout d'un membre, motif obligatoire,
        // tracé dans l'onglet Activité (cf. buildTeamInfoBlock). ──
        var btnTeamAddToggle = document.getElementById('btn-team-add-toggle');
        if (btnTeamAddToggle) {
            var teamAddForm   = document.getElementById('team-add-form');
            var teamAddRoleEl = document.getElementById('team-add-role');
            var teamAddPersonEl = document.getElementById('team-add-person');
            function populateTeamAddPerson() {
                var role = teamAddRoleEl.value;
                var already = getAssignees(currentCampaignData.workflow.assignments, role);
                var candidates = users.getUsersByRole(role).filter(function(u) { return already.indexOf(u.name) === -1; });
                teamAddPersonEl.innerHTML = candidates.length
                    ? candidates.map(function(u) { return '<option value="' + security.escapeHtml(u.name) + '">' + security.escapeHtml(u.name) + '</option>'; }).join('')
                    : '<option value="">Toute l\'équipe est déjà affectée</option>';
            }
            populateTeamAddPerson();
            if (teamAddRoleEl.tagName === 'SELECT') teamAddRoleEl.addEventListener('change', populateTeamAddPerson);

            btnTeamAddToggle.addEventListener('click', function() {
                teamAddForm.style.display = teamAddForm.style.display === 'none' ? 'block' : 'none';

            var btnTeamAddSave = document.getElementById('btn-team-add-save');
            if (btnTeamAddSave) {
                btnTeamAddSave.addEventListener('click', function() {
                    var role   = teamAddRoleEl.value;

                    disableBtn(btnTeamAddSave, 'Ajout...');
                    var assignments = currentCampaignData.workflow.assignments;
                    var cur = getAssignees(assignments, role);

                    assignments[role] = cur;
                    workflow.saveCampaignWorkflow(currentRootHandle, currentCampaignName, currentCampaignData)
                        .then(function() {

                            logActivity(currentCampaignName, 'affectation', 'Ajout de ' + person + ' à l\'équipe ' + roleLabel + ' — motif : ' + motif);
                            refreshCurrentPage();

        // ── Manager : affectation ──
        var btnAssign = document.getElementById('btn-validate-assignment');
        if (btnAssign) {
            btnAssign.addEventListener('click', function() {
                var isGeneral = btnAssign.getAttribute('data-general') === 'true';
                var userRole  = btnAssign.getAttribute('data-role');
                function collectChecked(cls) {
                    return Array.from(document.querySelectorAll('.' + cls + ':checked')).map(function(cb){ return cb.value; });
                }
                var reqTeamsStr = btnAssign.getAttribute('data-required-teams') || 'com,ebf,data';
                var reqTeamsArr = reqTeamsStr.split(',').filter(function(x) { return x; });
                if (isGeneral) {
                    var com = collectChecked('assign-cb-com');
                    var ebf = collectChecked('assign-cb-ebf');
                    var dat = collectChecked('assign-cb-data');
                    var missing = false;
                    if (reqTeamsArr.indexOf('com')  !== -1 && !com.length) missing = true;
                    if (reqTeamsArr.indexOf('ebf')  !== -1 && !ebf.length) missing = true;
                    if (reqTeamsArr.indexOf('data') !== -1 && !dat.length) missing = true;
                    if (missing) { notify('Veuillez sélectionner au moins une personne pour chaque équipe requise.', 'warning'); return; }
                    if (com.length) currentCampaignData.workflow.assignments.com  = com;
                    if (ebf.length) currentCampaignData.workflow.assignments.ebf  = ebf;
                    if (dat.length) currentCampaignData.workflow.assignments.data = dat;
                    currentCampaignData.workflow.assignments.manager = (users.getCurrentUser() || {}).name || '';
                    workflow.advanceStep(currentCampaignData, 'manager_affectation', 'validated');
                } else {
                    var vals = collectChecked('assign-cb-' + userRole);
                    if (!vals.length) { notify('Veuillez sélectionner au moins une personne.', 'warning'); return; }
                    currentCampaignData.workflow.assignments[userRole] = vals;
                }
                disableBtn(btnAssign, 'Enregistrement...');
                workflow.saveCampaignWorkflow(currentRootHandle, name, currentCampaignData)
                    .then(function() {
                        // Après la sauvegarde, currentCampaignData reflète la fusion disque : il
                        // contient donc les affectations faites par les AUTRES managers. On revérifie
                        // ici si l'équipe est complète et, le cas échéant, on valide automatiquement
                        // l'étape d'affectation (ce qui évite de devoir passer par le manager général).
                        var a = (currentCampaignData.workflow && currentCampaignData.workflow.assignments) || {};
                        var steps = (currentCampaignData.workflow && currentCampaignData.workflow.steps) || {};
                        function teamOK(key) { return reqTeamsArr.indexOf(key) === -1 || !!(a[key] && a[key].length); }
                        var complete = teamOK('com') && teamOK('ebf') && teamOK('data');
                        var notValidated = steps.manager_affectation !== 'validated' && steps.manager_affectation !== 'completed';
                        if (complete && notValidated) {
                            if (!a.manager) a.manager = (users.getCurrentUser() || {}).name || '';
                            workflow.advanceStep(currentCampaignData, 'manager_affectation', 'validated');
                            return workflow.saveCampaignWorkflow(currentRootHandle, name, currentCampaignData).then(function() {
                                errors.showNotification('Affectation complète — étape validée ✅', 'success', 2400);
                                refreshCurrentPage();
                            });
                        }
                        if (!isGeneral) errors.showNotification(complete ? 'Affectation enregistrée.' : 'Affectation enregistrée — en attente des autres équipes.', 'success', 2400);
                        refreshCurrentPage();
                    })
                    .catch(function(err) {
                        enableBtn(btnAssign, (btnAssign.getAttribute('data-general') === 'true') ? '✅ Valider l\'affectation' : '💾 Enregistrer mon affectation');
                        notify('Erreur : ' + errors.getErrorMessage(err), 'error');
                    });

        // ── PO : valider le kick-off ──
        var btnKickoff = document.getElementById('btn-validate-kickoff');
        if (btnKickoff) {
            btnKickoff.addEventListener('click', function() {

                if (!kickoffDate) { notify('Veuillez saisir la date du kick-off.', 'warning'); return; }
                currentCampaignData.kickoffDate = kickoffDate;
                // Notes par personne
                var personNotes = {};
                var noteEls = document.querySelectorAll('.kickoff-person-note');
                for (var i = 0; i < noteEls.length; i++) {
                    var person = noteEls[i].getAttribute('data-person');
                    if (person && noteEls[i].value.trim()) {
                        personNotes[person] = noteEls[i].value.trim();

                currentCampaignData.kickoffPersonNotes = personNotes;
                disableBtn(btnKickoff, 'Enregistrement...');
                workflow.advanceStep(currentCampaignData, 'po_kickoff', 'validated');

                    .then(function() { refreshCurrentPage(); })
                    .catch(function(err) {
                        enableBtn(btnKickoff, '✅ Kick-off réalisé');

        // ── Participant : sauvegarder sa note kick-off ──
        var btnSaveNote = document.getElementById('btn-save-kickoff-note');
        if (btnSaveNote) {
            btnSaveNote.addEventListener('click', function() {
                var noteEl = document.getElementById('kickoff-my-note');
                if (!noteEl) return;
                var kfUser = users && users.getCurrentUser();
                if (!kfUser) { notify('Session expirée, veuillez vous reconnecter.', 'warning'); return; }
                var noteVal = noteEl.value.trim();
                if (!currentCampaignData.kickoffPersonNotes) currentCampaignData.kickoffPersonNotes = {};
                currentCampaignData.kickoffPersonNotes[kfUser.name] = noteVal;

                workflow.saveCampaignWorkflow(currentRootHandle, name, currentCampaignData)
                    .then(function() {
                        enableBtn(btnSaveNote, '💾 Sauvegarder ma note');
                        errors.showNotification('Note sauvegardée', 'success', 2000);
                    })
                    .catch(function(err) {
